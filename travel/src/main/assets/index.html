<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>东南亚旅游攻略</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅游攻略">
<meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F171A" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
:root{
  --bg:#F6F2EA;--card:#FFFFFF;--soft:#EEE7DA;--line:#E2D8C8;--ink:#1D2A2E;--sub:#66737A;--faint:#9AA3A6;
  --acc:#0E7672;--accSoft:#DDF0EC;--acc2:#E8622F;--accInk:#FFFFFF;--warn:#B54708;--warnBg:#FDF0E2;
  --shadow:0 6px 22px rgba(40,30,15,.10);
  --c-city:#4F5BD5;--c-culture:#B4441B;--c-nature:#2F7D3A;--c-theme:#C2307A;--c-beach:#0B7E9C;--c-food:#A86F00;
}
:root[data-theme="dark"]{
  --bg:#0F171A;--card:#162125;--soft:#1E2C30;--line:#28393E;--ink:#E8EFEE;--sub:#9AA9AC;--faint:#6A7A7E;
  --acc:#3DB5AD;--accSoft:#173A38;--acc2:#FF875A;--accInk:#062221;--warn:#F5A55B;--warnBg:#33240F;
  --shadow:0 6px 22px rgba(0,0,0,.4);color-scheme:dark;
  --c-city:#8F99FF;--c-culture:#F08A5D;--c-nature:#6CCB7A;--c-theme:#F07AB6;--c-beach:#4CC6E0;--c-food:#E9B949;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button svg,.search svg{width:20px;height:20px;fill:currentColor;flex:none}
a{color:var(--acc)}
.view{padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) calc(88px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));max-width:760px;margin:0 auto}
h1{font-size:26px;line-height:1.2;margin:6px 0 2px;letter-spacing:.3px;text-wrap:balance}
h2{font-size:18px;margin:18px 0 8px}
.lead{color:var(--sub);margin:0 0 14px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.lbl{font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:.4px;margin-bottom:6px}
.field{display:flex;flex-direction:column}
.inp{height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);outline:0;min-width:0;width:100%}
.inp:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 13px;border-radius:17px;background:var(--soft);font-size:14px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--accInk);font-weight:700}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.12);font-weight:700;color:var(--acc)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:17px;background:var(--soft);font-size:18px;font-weight:700}
.step b{min-width:28px;text-align:center;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{height:50px;border-radius:14px;background:var(--acc);color:var(--accInk);font-weight:800;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--soft);color:var(--ink);font-weight:700}
.btn.sm{height:38px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);z-index:30;max-height:260px;overflow:auto}
.sug button{display:block;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.sug small{color:var(--sub)}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--acc)}.switch.on::after{transform:translateX(18px)}
/* plan result */
.sum h3{margin:0 0 6px;font-size:19px;text-wrap:balance}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:14px;color:var(--sub)}
.chain b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--soft);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-size:16px;white-space:nowrap}
.stat small{color:var(--sub);font-size:12px}
.day{padding:0;overflow:hidden}
.dayhd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(90deg,var(--accSoft),transparent)}
.dayno{width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--accInk);display:grid;place-items:center;font-weight:800;line-height:1;text-align:center;font-size:12px}
.dayno b{font-size:17px;display:block}
.dayhd .t{flex:1;min-width:0}
.dayhd .t b{display:block}
.dayhd .t small{color:var(--sub)}
.wx{font-size:13px;color:var(--sub);text-align:right;white-space:nowrap}
.wx b{font-size:15px;color:var(--ink)}
.tl{padding:4px 14px 12px}
.stop{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.time{width:46px;flex:none;font-size:13px;font-weight:700;color:var(--acc);padding-top:2px;font-variant-numeric:tabular-nums;line-height:1.3}
.time small{display:block;color:var(--faint);font-weight:500}
.ph{width:64px;height:64px;border-radius:12px;flex:none;overflow:hidden;background:var(--soft);position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ico{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint)}
.sbody{flex:1;min-width:0}
.sbody b{font-size:15.5px;display:block;line-height:1.35}
.meta{font-size:12.5px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.price{font-weight:700;color:var(--ink)}
.price.free{color:var(--c-nature)}
.price.unk{color:var(--faint);font-weight:500}
.warn{margin-top:6px;font-size:12.5px;background:var(--warnBg);color:var(--warn);border-radius:8px;padding:5px 8px}
.meal .ph{display:grid;place-items:center;font-size:26px;background:var(--warnBg)}
.meal .meta a{cursor:pointer;text-decoration:underline}
.x{width:32px;height:32px;border-radius:16px;color:var(--faint);display:grid;place-items:center;flex:none}
.leg{display:flex;align-items:center;gap:10px;margin-left:58px;padding:4px 0;color:var(--sub);font-size:13px;border-left:2px dashed var(--line);padding-left:12px;flex-wrap:wrap}
.leg.big{margin-left:0;border:0;padding:10px 12px;background:var(--soft);border-radius:12px;color:var(--ink);margin:6px 0}
.leg .nav{display:flex;gap:6px;margin-left:auto}
.leg .nav a{font-size:12px;padding:3px 9px;border-radius:10px;background:var(--card);text-decoration:none;color:var(--acc);border:1px solid var(--line)}
.leg.big .note{flex-basis:100%;font-size:12.5px;color:var(--sub)}
.hotel{margin:2px 0 0;font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.cat{font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;color:#fff;display:inline-block}
.cat.city{background:var(--c-city)}.cat.culture{background:var(--c-culture)}.cat.nature{background:var(--c-nature)}
.cat.theme{background:var(--c-theme)}.cat.beach{background:var(--c-beach)}.cat.food{background:var(--c-food)}
:root[data-theme="dark"] .cat{color:#10181a}
.map{height:300px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--soft);position:relative;isolation:isolate;z-index:0}
.leaflet-container{font:inherit}
.pin{width:26px;height:26px;border-radius:13px;color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:140px}
/* explore */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;height:46px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;outline:0;background:none;min-width:0}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
.pc{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column}
.pc .im{aspect-ratio:4/3;background:var(--soft);position:relative;max-width:100%}
.pc .im img{width:100%;height:100%;object-fit:cover;display:block}
.pc .im .cat{position:absolute;left:8px;top:8px}
.pc .im .ico,.rc .im .ico{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;opacity:.7}
.rc .im{position:relative}
.pc .bd{padding:8px 10px 10px;min-width:0}
.pc .bd b{display:block;font-size:14.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .bd small{color:var(--sub);font-size:12px;display:flex;justify-content:space-between;gap:6px}
.stars{color:#E6A700;letter-spacing:1px;font-size:12px}
.rc{display:flex;gap:12px;padding:0;overflow:hidden;text-align:left;width:100%}
.rc .im{width:110px;flex:none;background:var(--soft)}
.rc .im img{width:100%;height:100%;object-fit:cover;display:block}
.rc .bd{padding:12px 12px 12px 0;min-width:0;flex:1}
.rc b{display:block;font-size:16px}
.rc small{color:var(--sub);display:block;margin-top:2px}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
/* overlay pages */
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.ovtop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.ovtop b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;background:#111;aspect-ratio:16/10;max-height:56vh;max-width:100%}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.credit{font-size:11px;color:var(--faint);padding:4px 16px 0;word-break:break-word}
.dtl{padding:12px max(16px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));max-width:760px;margin:0 auto}
.dtl h1{font-size:24px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:12px 0}
.facts dt{color:var(--sub)}
.facts dd{margin:0}
table.pt{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.pt th,.pt td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.pt th{color:var(--sub);font-weight:600;font-size:12.5px}
.note{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.6}
.tip{background:var(--accSoft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.src{font-size:12px;color:var(--faint);margin-top:8px;word-break:break-all}
/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);display:flex;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--faint);padding:4px 0}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--acc);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,30,32,.92);color:#fff;padding:9px 16px;border-radius:18px;font-size:14px;z-index:90;max-width:88vw;text-align:center}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mini{font-size:12px;color:var(--faint)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));box-shadow:0 -6px 30px rgba(0,0,0,.25);max-height:80vh;overflow:auto}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
/* food, navigation, Grab */
.days7{display:flex;gap:3px;margin-top:6px}
.days7 i{font-style:normal;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;background:var(--soft);color:var(--faint);text-decoration:line-through}
.days7 i.on{background:var(--accSoft);color:var(--acc);font-weight:700;text-decoration:none}
.days7 i.today{box-shadow:0 0 0 2px var(--acc2)}
table.eat{width:100%;border-collapse:collapse;font-size:14px}
.eat td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.eat td.p{text-align:right;white-space:nowrap;font-weight:700;padding-left:10px}
.eat small{display:block;color:var(--sub);font-size:12px}
.fc{display:flex;gap:12px;text-align:left;width:100%}
.fc .ph{width:84px;height:84px}
.fc .dish{font-size:12.5px;color:var(--sub);margin-top:5px;line-height:1.5}
.badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:8px;background:var(--acc2);color:#fff;white-space:nowrap}
.btnrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btnrow a,.btnrow button{font-size:13px;padding:6px 12px;border-radius:12px;background:var(--soft);color:var(--ink);text-decoration:none;font-weight:600}
.grab,.btnrow .grab,.leg .nav a.grab{background:#00B14F!important;color:#fff!important;border-color:#00B14F!important}
.btn.grab{background:#00B14F;color:#fff}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px;align-items:flex-start}
.steps li i{font-style:normal;width:24px;text-align:center;font-weight:800;color:var(--acc);flex:none}
.steps li span{flex:1;min-width:0}
.steps li small{color:var(--sub);white-space:nowrap}
.steps li.now{background:var(--accSoft);border-radius:10px}
.nextbar{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:4;background:var(--acc);color:var(--accInk);border-radius:14px;padding:10px 14px;margin-top:12px;font-weight:700;box-shadow:var(--shadow)}
.nextbar small{display:block;font-weight:500;opacity:.9}
.me{width:18px;height:18px;border-radius:9px;background:#1A73E8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.navsum b{font-size:20px}
.spot{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.spot .wd{width:42px;font-weight:700;color:var(--acc)}
.spot .nm{flex:1;min-width:0}
.ferry{display:flex;flex-direction:column;gap:8px}
.ferry .fh b{font-size:15.5px;display:block;line-height:1.35}
.fcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcols>div{min-width:0;background:var(--soft);border-radius:12px;padding:8px 10px}
.times{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.times i{font-style:normal;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;padding:3px 7px;border-radius:8px;background:var(--card);color:var(--ink)}
.times i.past{color:var(--faint);text-decoration:line-through;font-weight:500;background:none}
.times i.next{background:var(--acc);color:var(--accInk)}
.leg .note.warn,.note.warn{color:var(--warn);background:var(--warnBg);border-radius:8px;padding:4px 8px}
.fdays{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.fdays input{height:34px;border-radius:17px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px}
</style>
</head>
<body>
<main id="pPlan" class="view"></main>
<main id="pRoutes" class="view" hidden></main>
<main id="pExplore" class="view" hidden></main>
<main id="pFood" class="view" hidden></main>
<main id="pMine" class="view" hidden></main>
<nav class="tabs" id="tabs">
  <button data-p="pPlan" class="on"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5.2-7 13-7 13S5 14.2 5 9a7 7 0 0 1 7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>规划</button>
  <button data-p="pRoutes"><svg viewBox="0 0 24 24"><path d="M6 3a3 3 0 0 1 1 5.83V11h7a3 3 0 0 1 3 3v1.17a3 3 0 1 1-2 0V14a1 1 0 0 0-1-1H7v2.17a3 3 0 1 1-2 0V8.83A3 3 0 0 1 6 3z"/></svg>线路</button>
  <button data-p="pExplore"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5zm3 11 3-4 2.5 3 2-2.5L17 16H7zm2-8.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>景点</button>
  <button data-p="pFood"><svg viewBox="0 0 24 24"><path d="M2 11h20a10 10 0 0 1-6 9.2V22H8v-1.8A10 10 0 0 1 2 11zM7 2.5h1.6c.3 1.3-.5 2.2-.5 3.6 0 .5.1.9.3 1.4H6.8c-.2-.5-.3-.9-.3-1.4 0-1.4.8-2.3.5-3.6zm4.2 0h1.6c.3 1.3-.5 2.2-.5 3.6 0 .5.1.9.3 1.4H11c-.2-.5-.3-.9-.3-1.4 0-1.4.8-2.3.5-3.6zm4.2 0H17c.3 1.3-.5 2.2-.5 3.6 0 .5.1.9.3 1.4h-1.6c-.2-.5-.3-.9-.3-1.4 0-1.4.8-2.3.5-3.6z"/></svg>美食</button>
  <button data-p="pMine"><svg viewBox="0 0 24 24"><path d="M12 21 10.6 19.7C5.6 15.2 2.5 12.4 2.5 8.9 2.5 6.1 4.7 4 7.4 4c1.6 0 3.1.7 4.1 1.9C12.5 4.7 14 4 15.6 4c2.8 0 4.9 2.1 4.9 4.9 0 3.5-3.1 6.3-8.1 10.8L12 21z"/></svg>我的</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="lib/leaflet.js"></script>
<script src="data.js"></script>
<script>
'use strict';
const A = window.A || null;           // Android bridge (absent on the web version)
const D = window.DATA;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = {}; D.regions.forEach(r => R[r.key] = r);
const PL = {}; D.places.forEach(p => PL[p.id] = p);
const COUNTRY = {MY:'西马', SG:'新加坡', TH:'泰国', ID:'印尼'};

/* ---------------- geography & time ---------------- */
function km(a, b) {
  const r = Math.PI / 180, x = Math.sin((b.lat - a.lat) * r / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin((b.lng - a.lng) * r / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(x));

const MX = {}; (D.matrix.ids || []).forEach((id, i) => MX[id] = i);
function roadFromMatrix(a, b) {

  const m = D.matrix.min[MX[a]][MX[b]], k = D.matrix.km[MX[a]][MX[b]];
  // the public routing server snaps some points to the wrong roads; ignore answers that cannot be right
  const straight = km(MXPT[a], MXPT[b]);

const MXPT = {}; D.regions.forEach(r => { MXPT[r.key] = r; if (r.ferry) MXPT['ferry:' + r.key] = r.ferry; });
/* road time between two points: OSRM times between region centres (scaled to the real points), or an estimate */
function roadBetween(a, b, ak, bk) {
  if (ak && bk && ak !== bk) {
    const m = roadFromMatrix(ak, bk);
    if (m) {
      const base = km(MXPT[ak], MXPT[bk]);
      const ratio = base > 1 ? Math.min(1.35, Math.max(0.7, km(a, b) / base)) : 1;
      return {min: Math.round(m.min * ratio + 5), km: Math.round(m.km * ratio)};

}
function fmtDur(m) {

const hhmm = m => { m = Math.round(m); const h = Math.floor(m / 60) % 24; return String(h).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

  for (const r of D.regions) { if (filter && !filter(r)) continue; const d = km(pt, r); if (d < bd) { bd = d; best = r; } }

  return {t: best, d: bd};

/* Transport between two points (each {lat,lng} with optional region key "rk").

function legPlan(from, to, mode) {
  const fr = from.rk ? R[from.rk] : null, tr = to.rk ? R[to.rk] : null;
  const fg = fr ? fr.group : 'main', tg = tr ? tr.group : 'main';
  const d = km(from, to);
  const local = mode === 'public' && (d < 15 || (from.rk && from.rk === to.rk && d < 40)); // in town: Grab, taxi or the metro

    const m = roadBetween(a, b, ak, bk);
    if (mode !== 'public') return m;
    return local ? {min: Math.round(m.min * 1.1 + 8), km: m.km} : {min: Math.round(m.min * 1.25 + 20), km: m.km};
  };
  const roadType = mode === 'public' ? (local ? 'grab' : 'bus') : 'drive';

  if (tr && tr.ferry && fg !== tg) {
    const pier = {lat: tr.ferry.lat, lng: tr.ferry.lng};
    const r1 = road(from, pier, from.rk, 'ferry:' + tr.key);
    const fl = flightOption(from, to, fr, tr);
    const ferryMin = r1.min + tr.ferry.hours * 60 + 40;
    if (fl && fl.total < ferryMin - 60) return fl.segs;
    return [{type: roadType, min: r1.min, km: r1.km, to: tr.ferry.name}, {type: 'ferry', min: Math.round(tr.ferry.hours * 60 + 40), km: Math.round(km(pier, to)), to: tr.name, isl: tr.key, dir: 'out'}];
  }
  if (fr && fr.ferry && fg !== tg) {
    const pier = {lat: fr.ferry.lat, lng: fr.ferry.lng};
    const r1 = road(pier, to, 'ferry:' + fr.key, to.rk);
    const fl = flightOption(from, to, fr, tr);
    const ferryMin = fr.ferry.hours * 60 + 40 + r1.min;
    if (fl && fl.total < ferryMin - 60) return fl.segs;
    return [{type: 'ferry', min: Math.round(fr.ferry.hours * 60 + 40), km: Math.round(km(from, pier)), to: fr.ferry.name, isl: fr.key, dir: 'back'}, {type: roadType, min: r1.min, km: r1.km, to: tr ? tr.name : ''}];
  }
  if (fg !== tg) {
    const fl = flightOption(from, to, fr, tr);
    if (fl) return fl.segs;
  }
  const rd = road(from, to, from.rk, to.rk);

    const fl = flightOption(from, to, fr, tr);
    if (fl && fl.total < rd.min) return fl.segs;

}
function airportNear(pt, group) {
  const c = nearestRegion(pt, r => r.airport && (!group || r.group === group || (group === 'main' && r.group === 'main')));
  return c.r;
}
function flightOption(from, to, fr, tr) {
  const a1 = fr && fr.airport ? fr : airportNear(from, fr ? fr.group : 'main');
  const a2 = tr && tr.airport ? tr : airportNear(to, tr ? tr.group : 'main');
  if (!a1 || !a2 || a1 === a2) return null;
  const segs = [];
  let total = 0;
  if (km(from, a1) > 25) { const m = roadEst(from, a1); segs.push({type: 'drive', min: m.min, km: m.km, to: a1.name + '机场'}); total += m.min; }
  const fk = km(a1, a2), fm = Math.round(150 + fk / 700 * 60 + 60);
  segs.push({type: 'flight', min: fm, km: Math.round(fk), from: a1.airport, to: a2.name + ' ' + a2.airport, air: Math.round(fk / 700 * 60 + 25)});
  total += fm;
  if (km(a2, to) > 25) { const m = roadEst(a2, to); segs.push({type: 'drive', min: m.min, km: m.km, to: tr ? tr.name : ''}); total += m.min; }

const toRM = (v, cur) => v * (FX[cur] || 1);
function money(v, cur) {

const rm = v => 'RM' + (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10);
/** Ticket cost for the party: {local, rm, cur, text, unknown, free, assumedChild}. */
function cost(p, party, resident) {

/* ---------------- ferries ---------------- */
const FERRY = D.ferries || [];
const FR = {}; FERRY.forEach(x => FR[x.id] = x);
const toMin = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
/** departure times ("HH:MM") on that date, sorted */
function sailings(list, date) { const wd = date.getDay(); return (list || []).filter(x => !x[1] || x[1].includes(wd)).map(x => x[0]).sort(); }
function ferryStatus(fe, date) {
  const m = date.getMonth() + 1;
  if (fe.closed && fe.closed.includes(m)) return 'closed';
  if (fe.monsoon && fe.monsoon.includes(m)) return 'monsoon';
  return '';
}
function ferriesForPlace(p) { return FERRY.filter(x => (x.places && x.places.includes(p.id)) || (!x.places && x.island === p.region)); }
/** the main ferry to an island: the one leaving from the pier the planner drives to */
function mainFerry(isl) {
  const r = R[isl], list = FERRY.filter(x => x.island === isl && !x.places);
  if (!list.length) return null;
  return r && r.ferry ? list.sort((a, b) => km(a.a, r.ferry) - km(b.a, r.ferry))[0] : list[0];
}
function islandClosed(isl, date) { const fe = mainFerry(isl); return !!(fe && ferryStatus(fe, date) === 'closed'); }
/** give ferry segments real sailing times: wait at the pier for the next boat that day */
function timeFerries(segs, t0, date) {
  let tt = t0;
  for (const s of segs) {
    if (s.type === 'ferry' && s.isl) {
      const fe = mainFerry(s.isl);
      if (fe) {
        s.route = fe.id;
        const st = ferryStatus(fe, date);
        if (st) s.season = st;
        const times = sailings(s.dir === 'out' ? fe.out : fe.back, date).map(toMin);
        delete s.dep; delete s.none; delete s.wait;
        if (times.length) {
          const dep = times.find(x => x >= tt + 20);   // 20 minutes to buy tickets and board
          if (dep != null) { s.dep = dep; s.wait = dep - tt; s.min = s.wait + fe.mins; }
          else { s.none = true; s.min = fe.mins + 40; }
        } else s.min = fe.mins + 40;
      }

  }

/* ---------------- planner ---------------- */
const PACE = {relax: [570, 1050, 7], normal: [540, 1140, 9], tight: [480, 1260, 11]};
const CAP = {relax: 4, normal: 5, tight: 7}; // most attractions a day
function score(p, f) {
  let s = Math.pow(p.rank, 1.7);
  if (!f.interests.includes(p.cat)) s *= p.rank >= 5 ? 0.6 : 0.3;
  if (f.must.includes(p.id)) s *= 6;
  return s;
}
function dateAt(f, i) { const d = new Date(f.date + 'T00:00:00'); d.setDate(d.getDate() + i); return d; }
function openOn(p, date) { return !p.closed.includes(date.getDay()); }

function plan(f) {
  const [dayStart, dayEnd, dayHours] = PACE[f.pace];
  const start = {lat: f.start.lat, lng: f.start.lng, name: f.start.name};
  const sr = nearestRegion(start);
  if (sr.d < 35) start.rk = sr.r.key;
  const countries = new Set(f.countries);
  const used = new Set();
  const days = [];
  let loc = Object.assign({}, start), t = dayStart, region = null;
  const ctx = {f, dayStart, dayEnd, dayHours};
  const newDay = () => days.push({date: dateAt(f, days.length), items: [], region: null});
  newDay();
  const fixed = f.fixed; // curated route: [[ids]]
  const exhausted = new Set(); // areas where nothing more fits into a day
  let stayDay = -1;              // the day we decided to stay put (nothing better within reach)
  let triedSwitch = -1, wantSwitch = false;   // free afternoon: look at another area once
  const loose = new Set();     // areas where we also take spots outside the chosen interests
  const cand = rk => exhausted.has(rk) ? [] : D.places.filter(p => p.region === rk && !used.has(p.id) && score(p, f) >= (loose.has(rk) ? 0.8 : 3.2));
  const moreHere = rk => !loose.has(rk) && D.places.some(p => p.region === rk && !used.has(p.id));
  const regionValue = (rk, daysAvail) => {
    const ps = cand(rk).sort((a, b) => score(b, f) - score(a, f));
    let h = 0, v = 0;
    for (const p of ps) {
      if (f.must.includes(p.id)) { h += p.dur + 0.5; v += score(p, f); continue; } // must-go places always count
      if (h + p.dur > daysAvail * dayHours) break;
      h += p.dur + 0.5; v += score(p, f);
    }
    return {v, h};
  };
  const returnMin = from => f.roundtrip ? segMin(legPlan(from, start, f.mode)) : 0;
  // must-go places ("必去清单") in the chosen countries that are not planned yet
  const mustLeft = () => f.must.filter(id => PL[id] && !used.has(id) && countries.has(R[PL[id].region].country));
  const mustIn = rk => mustLeft().some(id => PL[id].region === rk);
  /** days still needed to reach the remaining must-go places elsewhere and get back */
  const needDays = () => {
    const rs = [...new Set(mustLeft().map(id => PL[id].region))].filter(rk => rk !== region);
    if (!rs.length) return 0;
    let h = 0, at = loc;
    for (const rk of rs) {
      const rp = Object.assign({}, R[rk], {rk});
      h += segMin(legPlan(at, rp, f.mode)) / 60 + mustLeft().filter(id => PL[id].region === rk).reduce((a, id) => a + PL[id].dur, 0);
      at = rp;
    }
    return (h + returnMin(at) / 60) / dayHours;
  };

    const segs = legPlan(loc, to, f.mode);
    const total = segMin(segs);
    const big = segs.some(s => s.type === 'flight' || s.type === 'ferry') || total > 150;
    // long trips start on a fresh morning if the day is mostly gone
    if (big && t > dayStart + 120 && dayEnd - t < total * 0.6) { days[days.length - 1].region = days[days.length - 1].region || region; newDay(); t = dayStart; }

    timeFerries(segs, t, day.date);
    const total2 = segMin(segs);
    day.items.push({type: 'leg', segs, start: t, end: t + total2, from: loc.name || '', to: to.name || label || '', big, fromPt: {lat: loc.lat, lng: loc.lng}, toPt: {lat: to.lat, lng: to.lng}});
    t += total2;
    loc = Object.assign({}, to);
    while (t > dayEnd + 120) { t = t - (dayEnd - dayStart) - 720; newDay(); if (t < dayStart) t = dayStart; }
  };
  const meal = (day, kind, at) => {
    const s0 = at == null ? t : at;
    day.items.push({type: 'meal', meal: kind, start: s0, end: s0 + 60, rk: loc.rk || region, at: {lat: loc.lat, lng: loc.lng}, wd: day.date.getDay()});
    if (at == null) t += 60;
    day[kind] = true;
  };
  const addStop = p => {
    const day = days[days.length - 1];
    const pt = {lat: p.lat, lng: p.lng, rk: p.region, name: p.name};
    // meals: lunch once it is past 11:30, dinner after 18:00 (a food stop counts as the meal)
    if (p.cat === 'food') { if (t >= 660 && t < 900) day.lunch = true; if (t >= 1020) day.dinner = true; }

      const there = Object.assign({}, R[firstP.region], {rk: firstP.region});

      const need = fixed[0].reduce((a, id) => a + (PL[id] && PL[id].slot !== 'evening' && PL[id].slot !== 'night' ? PL[id].dur * 60 + 20 : 0), 0);

      const dayNow0 = days[days.length - 1];

      if (region && cand(region).length && !daytime(region) && t < 870 && !dayNow0.ended && !loose.has(region)
          && D.places.some(p => p.region === region && !used.has(p.id) && p.cat !== 'food' && p.slot !== 'evening' && p.slot !== 'night')) { loose.add(region); continue; }
      // move on when the area is done, or only evening spots are left while most of the day is still ahead
      const hurry = region && !mustIn(region) && mustLeft().length && daysLeft <= needDays() + 0.35;
      const switching = wantSwitch; wantSwitch = false;
      if (!region || hurry || switching || cand(region).length === 0 || (!daytime(region) && t < 870 && !dayNow0.ended && stayDay !== days.length)) {
        // leaving in the middle of the day while spots remain here (only evening ones): just nearby places
        const nearOnly = switching || (region && !hurry && cand(region).length > 0);
        let best = null, bestEff = -1;
        for (const r of D.regions) {
          if (!countries.has(r.country) || r.key === region) continue;
          if (r.ferry && islandClosed(r.key, dateAt(f, days.length - 1)) && !mustIn(r.key)) continue; // boats stop in the monsoon
          const rp = Object.assign({}, r, {rk: r.key});
          const segs = legPlan(loc, rp, f.mode);
          const travelH = segMin(segs) / 60;
          // filling a free afternoon: only places a short drive away
          if (nearOnly && (travelH > 2.5 || segs.some(x => x.type === 'flight' || x.type === 'ferry'))) continue;
          const retH = returnMin(rp) / 60;
          const avail = daysLeft - travelH / dayHours - retH / dayHours;
          // not worth it when most of the remaining time would be spent getting there and back
          if (region && !mustIn(r.key) && (travelH + retH) > Math.max(daysLeft, 0.5) * dayHours * 0.5) continue;
          const hasMust = mustIn(r.key);
          if (avail < (hasMust ? 0.15 : 0.45)) continue;
          const {v} = regionValue(r.key, Math.min(avail, 3));
          if (v <= 0) continue;
          const eff = v / (travelH * 1.4 + 2.5);
          const mustBoost = hasMust ? 100 : 1;
          if (eff * mustBoost > bestEff) { bestEff = eff * mustBoost; best = rp; }
        }
        if (!best) {
          if (region && moreHere(region)) { loose.add(region); stayDay = days.length; continue; } // nothing better nearby: see more here
          if (region && cand(region).length) { stayDay = days.length; continue; } // stay and enjoy the evening here
          break;
        }
        if (region || km(loc, best) > 30) addLeg(best, best.name);
        region = best.key;
        if (days.length > f.days) break;
      }
      // fill the rest of today
      const dayNow = days[days.length - 1];
      const endToday = (days.length === f.days ? dayEnd - Math.min(returnMin(loc), dayEnd - dayStart - 120) : dayEnd) + 150;
      const full = dayNow.ended || dayNow.items.filter(x => x.type === 'stop').length >= CAP[f.pace];
      const stopsNow = dayNow.items.filter(x => x.type === 'stop');
      const mealOk = p => {   // food spots are meals: breakfast first thing, lunch around noon, one night market or dinner spot a day
        if (p.cat !== 'food' || f.must.includes(p.id)) return true;
        if (p.slot === 'morning') return !stopsNow.length && t <= dayStart + 60;
        if (p.slot === 'day') return !dayNow.lunch && t <= 840;
        return !stopsNow.some(x => PL[x.id].cat === 'food' && (PL[x.id].slot === 'night' || PL[x.id].slot === 'evening'));
      };
      const options = full ? [] : cand(region).filter(p => (openOn(p, dayNow.date) || f.must.includes(p.id)) && mealOk(p));
      // every spot that can still fit today, then keep evening and night spots for later while daytime ones fit
      const feasible = [];
      for (const p of options) {
        const pt = {lat: p.lat, lng: p.lng};
        const tm = segMin(legPlan(loc, Object.assign({rk: p.region}, pt), f.mode));
        let st = t + tm;
        if (p.slot === 'night') st = Math.max(st, 1170);
        if (p.slot === 'sunrise' && (dayNow.items.some(x => x.type !== 'meal') || t > dayStart + 30)) continue;
        if (p.dur >= 5 && st > 660 && p.slot !== 'night' && (p.cat !== 'beach' || p.dur >= 7)) continue; // full-day parks and tours start in the morning; a beach is fine in the afternoon
        if (p.cat === 'food' && p.slot === 'day' && !f.must.includes(p.id) && (st < 660 || st > 840)) continue; // lunch spots at lunch time
        let limit = p.slot === 'night' ? endToday + 90 : p.slot === 'evening' ? endToday + 60 : endToday - 150;
        if (p.dur >= 6) limit = Math.max(limit, Math.min(endToday - 90, dayEnd + 60)); // day tours: back by evening
        // a must-go place may run into the evening (and push the trip home later)
        if (st + p.dur * 60 > (f.must.includes(p.id) && p.slot !== 'night' ? Math.max(limit, dayEnd + 60) : limit)) continue;
        feasible.push({p, v: score(p, f) / (1 + tm / 40)});
      }
      const isDay = x => x.p.slot === 'day' || x.p.slot === 'morning' || x.p.slot === 'sunrise';
      let pool = feasible;
      if (t < 900 && feasible.some(isDay)) pool = feasible.filter(isDay);
      else if (t < 1050 && feasible.some(x => x.p.slot !== 'night')) pool = feasible.filter(x => x.p.slot !== 'night');
      // morning spots late in the day only when nothing else fits
      if (t > dayStart + 120 && pool.some(x => x.p.slot !== 'morning')) pool = pool.filter(x => x.p.slot !== 'morning');
      let pick = null, pv = -1;
      for (const x of pool) if (x.v > pv) { pv = x.v; pick = x.p; }
      if (pick) { addStop(pick); continue; }
      // a fresh morning and still nothing fits: this area is done
      if (!dayNow.items.some(x => x.type === 'stop') && t <= dayStart + 180) {
        if (moreHere(region)) loose.add(region); else exhausted.add(region);
        continue;
      }
      // still early in the day: try another area for the afternoon (once a day)
      if (t < 900 && triedSwitch !== days.length) { triedSwitch = days.length; wantSwitch = true; continue; }
      // nothing fits today: next day (or finish)
      if (days.length >= f.days) break;
      dayNow.region = dayNow.region || region;
      newDay(); t = dayStart;
      loc = Object.assign({}, R[region], {rk: region, name: R[region].name});
    }
  }
  while (days.length > f.days && !days[days.length - 1].items.length) days.pop();
  while (days.length < (f.fixed ? f.fixed.length : f.days)) newDay();
  if (f.roundtrip && km(loc, start) > 3) {
    const last = days[days.length - 1];
    if (t < dayStart) t = dayStart;
    const segs = legPlan(loc, start, f.mode);
    last.items.push({type: 'leg', segs, start: t, end: t + segMin(segs), from: loc.name, to: start.name, big: true, back: true, fromPt: {lat: loc.lat, lng: loc.lng}, toPt: start});
  }
  days.forEach((d, i) => {
    if (!d.region) { const s = d.items.find(x => x.type === 'stop'); d.region = s ? PL[s.id].region : (i ? days[i - 1].region : (start.rk || null)); }
    // where the night is spent: the last place reached that day
    let sleep = null;
    for (const it of d.items) {
      if (it.type === 'stop') sleep = PL[it.id].region;
      else if (it.type === 'leg' && !it.back) sleep = nearestRegion(it.toPt).r.key;
    }
    d.sleep = sleep || d.region;
    const seen = [];
    d.items.forEach(it => { if (it.type === 'stop' && seen[seen.length - 1] !== PL[it.id].region) seen.push(PL[it.id].region); });
    d.regions = seen.filter((k, j) => seen.indexOf(k) === j);
    // a day spent on the road: show where it goes from and to
    const big = d.items.find(x => x.type === 'leg' && x.big && !x.back);
    if (!d.regions.length && big) d.regions = [nearestRegion(big.fromPt).r.key, nearestRegion(big.toPt).r.key].filter((k, j, a) => a.indexOf(k) === j);
    d.travel = !seen.length && !!big;
  });
  return {input: f, days, made: Date.now()};
}

const SEG = {drive: ['🚗', '开车'], bus: ['🚌', '长途巴士 / 火车'], grab: ['🚕', 'Grab / 地铁'], walk: ['🚶', '步行'], ferry: ['⛴', '渡轮'], flight: ['✈️', '飞机']};
function navLinks(a, b, mode, name, grab) {

function mealHtml(it, pl, di) {

  const inPlan = new Set(); pl.days.forEach(d => d.items.forEach(x => x.type === 'stop' && inPlan.add(x.id)));

let LASTPOS = null;
function getPosition() {

    const ok = (lat, lng) => { LASTPOS = {lat, lng, t: Date.now()}; res(LASTPOS); };
    if (A && A.locate) { window.onLocate = (lat, lng, err) => err ? rej(new Error(err)) : ok(lat, lng); A.locate(); return; }
    if (!navigator.geolocation) { rej(new Error('这台设备不能定位')); return; }
    navigator.geolocation.getCurrentPosition(p => ok(p.coords.latitude, p.coords.longitude), () => rej(new Error('定位失败，请打开定位或换个出发地')), {timeout: 20000, enableHighAccuracy: true});

function osrm(points, profile) {
  const url = `https://routing.openstreetmap.de/routed-${profile}/route/v1/driving/${points.map(p => (+p.lng).toFixed(6) + ',' + (+p.lat).toFixed(6)).join(';')}?overview=full&geometries=geojson&steps=true`;
  return getJSON(url).then(j => {
    if (j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error(j.message || j.code || 'no route');
    const r = j.routes[0];
    let straight = 0;
    for (let i = 1; i < points.length; i++) straight += km(points[i - 1], points[i]);
    if (r.distance / 1000 < straight * 0.9) throw new Error('bad route');
    return r;
  });
}
const TURN = {uturn: ['⤺', '掉头'], 'sharp right': ['↱', '向右急转'], right: ['→', '右转'], 'slight right': ['↗', '稍向右'],
  straight: ['↑', '直行'], 'slight left': ['↖', '稍向左'], left: ['←', '左转'], 'sharp left': ['↰', '向左急转']};

  switch (m.type) {
    case 'depart': return ['🚩', '出发' + (road ? '，沿' + road + '走' : '')];
    case 'arrive': return ['🏁', '到达目的地' + (m.modifier && /left|right/.test(m.modifier) ? `（在${/left/.test(m.modifier) ? '左' : '右'}边）` : '')];
    case 'roundabout': case 'rotary': return ['⟲', `进入环岛，从第 ${m.exit || 1} 个出口出去` + (road ? '，进入' + road : '')];
    case 'exit roundabout': case 'exit rotary': return ['⟲', '离开环岛' + (road ? '，进入' + road : '')];
    case 'merge': return [t[0], '并入' + (road || '主路')];

    case 'off ramp': return [t[0], (t[1] && t[1] !== '直行' ? t[1] + '，' : '') + '下匝道' + (road ? '往' + road : '')];
    case 'fork': return [t[0], '岔路口' + (/left/.test(m.modifier) ? '靠左' : /right/.test(m.modifier) ? '靠右' : '直走') + (road ? '，进入' + road : '')];

    const gb = `<button class="btn ${st.mode === 'grab' ? '' : 'sm '}grab" style="flex:1" data-grab="${dest.lat},${dest.lng}" data-name="${esc(dest.en || dest.name)}"${st.from && !st.from.here ? ` data-from="${st.from.lat},${st.from.lng}"` : ''}>🚕 叫 Grab（目的地已填好）</button>`;
    if (st.mode === 'grab') return `<div class="acts" style="margin-top:12px">${gb}</div><div class="btnrow"><a href="${g}">Google 地图看路线</a></div>`;
    return `<div class="acts" style="margin-top:12px"><a class="btn sm" style="flex:1;text-decoration:none" href="${g}">Google 地图导航</a>${st.mode === 'car' ? `<a class="btn sm ghost" style="flex:1;text-decoration:none" href="${w}">Waze 导航</a>` : ''}</div>
      ${st.mode !== 'car' ? `<div class="btnrow">${gb.replace('btn sm grab', 'grab').replace(' style="flex:1"', '')}</div>` : ''}
      <button class="btn ghost sm" id="nFollow" style="margin-top:10px;width:100%">${WATCH ? '⏹ 停止跟随' : '📍 跟着我走（显示我的位置和下一步）'}</button>`;
  }
  function draw(coords, dashed) {
    st.last = [coords, dashed];
    if (!st.map) return;
    if (st.layer) st.layer.remove();
    st.layer = L.layerGroup().addTo(st.map);
    L.polyline(coords, dashed ? {color: '#888', weight: 3, dashArray: '6 8'} : {color: '#0E7672', weight: 6, opacity: .85}).addTo(st.layer);
    if (st.from) L.marker([st.from.lat, st.from.lng], {icon: pinIcon(st.from.here ? '我' : '起', '#1D2A2E')}).addTo(st.layer);
    st.map.fitBounds(L.latLngBounds(coords.concat([[dest.lat, dest.lng]])).pad(0.12));
  }
  function calc() {
    const seq = ++st.seq;
    st.route = null; st.cum = null;
    $q('#nSteps').innerHTML = ''; $q('#nNext').innerHTML = '';
    if (!st.from) { $q('#nSum').innerHTML = '<div class="mini">先选出发地。</div>'; return; }
    const from = st.from, d = km(from, dest);
    const fr = nearestRegion(from).r, tr = PL[dest.id] ? R[PL[dest.id].region] : nearestRegion(dest).r;
    // across the sea or very far: show the trip plan (flight / ferry) instead of a road route
    const sea = fr && tr && fr.group !== tr.group && d > 3;
    if (sea || d > 900) {
      const segs = legPlan(Object.assign({rk: fr && km(from, fr) < 35 ? fr.key : null}, from), Object.assign({rk: tr ? tr.key : null}, dest), st.mode === 'transit' ? 'public' : 'car');
      $q('#nSum').innerHTML = `<b>约 ${fmtDur(segMin(segs))}</b><div class="mini" style="margin-top:4px">${segs.map(s => SEG[s.type][0] + ' ' + SEG[s.type][1] + (s.to ? '到 ' + esc(s.to) : '') + ' 约 ' + fmtDur(s.min)).join('　→　')}</div><div class="note">要过海或距离太远，没有直达的开车路线。</div>` + links();
      draw([[from.lat, from.lng], [dest.lat, dest.lng]], true);
      return;
    }
    if (st.mode === 'transit') {
      const segs = legPlan(from, dest, 'public');
      $q('#nSum').innerHTML = `<b>约 ${fmtDur(segMin(segs))}</b><span class="mini">（估算）</span><div class="note">公交、地铁和巴士的班次请用 Google 地图查看，会给你具体坐哪一路车。</div>` + links();
      draw([[from.lat, from.lng], [dest.lat, dest.lng]], true);
      bindFollow();
      return;
    }
    if (d < 0.05) { $q('#nSum').innerHTML = '<b>你已经在这里了 🎉</b>'; return; }
    $q('#nSum').innerHTML = '<div class="row"><span class="spin" style="border-color:var(--line);border-top-color:var(--acc)"></span> 正在计算路线…</div>';
    osrm([from, dest], st.mode === 'walk' ? 'foot' : 'car').then(r => {
      if (seq !== st.seq) return;
      st.route = r;
      const coords = r.geometry.coordinates.map(c => [c[1], c[0]]);
      // distance along the route at each point, and where each step starts
      st.cum = [0];
      for (let i = 1; i < coords.length; i++) st.cum.push(st.cum[i - 1] + km({lat: coords[i - 1][0], lng: coords[i - 1][1]}, {lat: coords[i][0], lng: coords[i][1]}) * 1000);
      st.coords = coords;
      const steps = r.legs[0].steps;
      st.starts = []; let acc = 0;
      steps.forEach(s => { st.starts.push(acc); acc += s.distance; });
      st.steps = steps;
      const head = {car: '🚗 开车', grab: '🚕 Grab 车程', walk: '🚶 步行'}[st.mode];
      $q('#nSum').innerHTML = `<div class="mini">${head}</div><b>${fmtDur(r.duration / 60)}</b> · ${fmtM(r.distance)}
        ${st.mode === 'grab' ? '<div class="note">不含等车时间；车费以 Grab App 报价为准，高峰期和下雨天会贵一些。</div>' : ''}
        ${st.mode === 'walk' && r.distance > 3000 ? '<div class="warn">走路有点远，可以改坐 Grab。</div>' : ''}
        ${st.mode === 'car' ? '<div class="note">不含塞车时间。</div>' : ''}` + links();
      $q('#nSteps').innerHTML = steps.filter((s, i) => s.distance > 0 || i === steps.length - 1).map(s => {
        const [ic, tx] = stepText(s);
        return `<li data-s="${steps.indexOf(s)}"><i>${ic}</i><span>${esc(tx)}</span><small>${s.distance > 0 ? fmtM(s.distance) : ''}</small></li>`;
      }).join('');
      draw(coords, false);
      bindFollow();
      if (WATCH) follow(LASTPOS);
    }).catch(err => {
      if (seq !== st.seq) return;
      console.warn(err);
      const segs = legPlan(from, dest, 'car');
      $q('#nSum').innerHTML = `<b>约 ${fmtDur(segMin(segs))}</b><span class="mini">（估算，${navigator.onLine === false ? '没有网络' : '暂时算不出详细路线'}）</span>` + links();
      draw([[from.lat, from.lng], [dest.lat, dest.lng]], true);
      bindFollow();
    });
  }
  function bindFollow() {
    const b = $q('#nFollow'); if (!b) return;
    b.onclick = () => {
      if (WATCH) { stopWatch(); $q('#nNext').innerHTML = ''; if (st.me) { st.me.remove(); st.me = null; } b.textContent = '📍 跟着我走（显示我的位置和下一步）'; return; }
      b.textContent = '⏹ 停止跟随';
      $q('#nNext').innerHTML = '<div class="nextbar">正在取得你的位置…</div>';
      startWatch(follow);
    };
  }
  function follow(pos) {
    if (!pos || !st.map) return;
    if (!st.me) st.me = L.marker([pos.lat, pos.lng], {icon: L.divIcon({className: '', html: '<div class="me"></div>', iconSize: [18, 18]}), zIndexOffset: 1000}).addTo(st.map);
    else st.me.setLatLng([pos.lat, pos.lng]);
    st.map.panTo([pos.lat, pos.lng], {animate: true});
    const left = km(pos, dest) * 1000;
    if (left < 60) { $q('#nNext').innerHTML = '<div class="nextbar">🏁 到了！</div>'; return; }
    if (!st.coords) { $q('#nNext').innerHTML = `<div class="nextbar">离目的地直线 ${fmtM(left)}</div>`; return; }
    // nearest point of the route
    let bi = 0, bd = 1e9;
    st.coords.forEach((c, i) => { const dd = km(pos, {lat: c[0], lng: c[1]}); if (dd < bd) { bd = dd; bi = i; } });
    const done = st.cum[bi];
    if (bd > 0.2) { $q('#nNext').innerHTML = `<div class="nextbar">⚠ 你离开路线了（约 ${fmtM(bd * 1000)}）<small>点「我的位置」重新规划，或继续往目的地方向走</small></div>`; return; }
    let k = st.starts.findIndex(x => x > done + 15);
    if (k < 0) k = st.steps.length - 1;
    const [ic, tx] = stepText(st.steps[k]);
    $q('#nNext').innerHTML = `<div class="nextbar">${ic} ${esc(tx)}<small>还有 ${fmtM(Math.max(0, st.starts[k] - done))} · 全程剩 ${fmtM(Math.max(0, st.route.distance - done))}</small></div>`;
    B.querySelectorAll('#nSteps li').forEach(li => li.classList.toggle('now', +li.dataset.s === k));
  }
  fromChoices();
  if (LASTPOS && Date.now() - LASTPOS.t < 60e3) setFrom('here', {lat: LASTPOS.lat, lng: LASTPOS.lng, name: '我的位置', here: true});
  else useHere();
  return st;
}

/* a whole day of the plan: every stop on one map, with one-tap navigation or Grab to each */
function openDayNav(di) {
  const pl = CUR_PLAN, d = pl.days[di], f = pl.input;
  const stops = d.items.filter(x => x.type === 'stop').map(x => PL[x.id]);
  const firstLeg = d.items.find(x => x.type === 'leg');
  const begin = firstLeg && d.items.indexOf(firstLeg) < d.items.findIndex(x => x.type === 'stop') ? firstLeg.fromPt : null;
  const ov = overlay(`第 ${di + 1} 天路线`);
  let map = null;
  ov.onclose = () => { if (map) map.remove(); };
  const pts = (begin ? [{lat: begin.lat, lng: begin.lng, name: '出发'}] : []).concat(stops.map(p => ({lat: p.lat, lng: p.lng, name: p.name})));
  // Google Maps takes up to 9 stops in between
  const g = pts.length >= 2 ? `https://www.google.com/maps/dir/?api=1&origin=${pts[0].lat},${pts[0].lng}&destination=${pts[pts.length - 1].lat},${pts[pts.length - 1].lng}${pts.length > 2 ? '&waypoints=' + pts.slice(1, -1).slice(0, 9).map(p => p.lat + ',' + p.lng).join('%7C') : ''}&travelmode=${f.mode === 'public' ? 'transit' : 'driving'}` : '';
  ov.body.innerHTML = `<div class="dtl"><h1>第 ${di + 1} 天 · ${d.date.getMonth() + 1}月${d.date.getDate()}日 ${WD[d.date.getDay()]}</h1>
    <div class="map" id="dMap" style="height:300px"></div><div class="card" id="dSum" style="margin-top:12px"><div class="mini">正在计算全天路线…</div></div>
    ${g ? `<a class="btn" style="text-decoration:none;margin-top:12px" href="${g}">用 Google 地图导航全天（${pts.length} 个点）</a>` : ''}
    <h2>每一站</h2><div class="stack">${stops.map((p, i) => `<div class="card fc" style="padding:12px"><div class="pin" style="background:${DAYC[di % DAYC.length]};flex:none">${i + 1}</div>
      <div class="sbody"><b data-open="${p.id}">${esc(p.name)}</b><div class="mini">${esc(p.hours)}</div>
      <div class="btnrow"><button data-nav="${p.id}">🧭 导航</button><button class="grab" data-grab="${p.lat},${p.lng}" data-name="${esc(p.en)}">Grab</button></div></div></div>`).join('')}</div></div>`;
  ov.body.onclick = e => { const o = e.target.closest('[data-open]'); if (o) openPlace(o.dataset.open); };
  setTimeout(() => {
    if (!window.L || !pts.length) return;
    map = mapIn(ov.body.querySelector('#dMap'));
    pts.forEach((p, i) => L.marker([p.lat, p.lng], {icon: pinIcon(begin && i === 0 ? '起' : String(begin ? i : i + 1), begin && i === 0 ? '#1D2A2E' : DAYC[di % DAYC.length])}).addTo(map));
    map.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lng])).pad(0.15));
    const sum = ov.body.querySelector('#dSum');
    const groups = new Set(pts.map(p => nearestRegion(p).r.group));
    if (pts.length < 2) { sum.innerHTML = '<div class="mini">这天只有一站。</div>'; return; }
    if (groups.size > 1 || pts.length > 25) { sum.innerHTML = '<div class="mini">这天要坐船或飞机，地图上只画直线。</div>'; L.polyline(pts.map(p => [p.lat, p.lng]), {color: '#888', dashArray: '6 8'}).addTo(map); return; }
    osrm(pts, 'car').then(r => {
      L.polyline(r.geometry.coordinates.map(c => [c[1], c[0]]), {color: DAYC[di % DAYC.length], weight: 5, opacity: .85}).addTo(map);
      sum.innerHTML = `<b>${fmtM(r.distance)}</b> · 开车约 ${fmtDur(r.duration / 60)}<div class="note">按顺序走完全部景点的路程（不含塞车和游玩时间）。</div>`;
    }).catch(() => { L.polyline(pts.map(p => [p.lat, p.lng]), {color: '#888', dashArray: '6 8'}).addTo(map); sum.innerHTML = '<div class="mini">暂时算不出详细路线（可能没有网络），先显示直线。</div>'; });
  }, 240);
}

/* ---------------- ferry timetable cards ---------------- */
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function sameDay(a, b) { return ymd(a) === ymd(b); }
function timesHtml(list, date) {
  const now = new Date(), today = sameDay(date, now), nm = now.getHours() * 60 + now.getMinutes();
  let marked = false;
  return list.map(t => {
    const past = today && toMin(t) < nm;
    const next = !past && !marked && today;
    if (next) marked = true;
    return `<i class="${past ? 'past' : next ? 'next' : ''}">${t}</i>`;
  }).join('');
}
function fareHtml(fe) {
  const fr = fe.fares || {};
  if (!fr.rows || !fr.rows.length) return '';
  const hasChild = fr.rows.some(r => r[2] != null);
  const cell = v => v == null ? '–' : esc(money(v, fr.cur)) + (fr.cur !== 'MYR' ? `<br><small class="mini">≈${rm(toRM(v, fr.cur))}</small>` : '');
  return `<table class="pt"><tr><th>船票${fr.unit ? `<small class="mini"> · ${esc(fr.unit)}</small>` : ''}</th><th>成人</th>${hasChild ? '<th>儿童</th>' : ''}</tr>
    ${fr.rows.map(r => `<tr><td>${esc(r[0])}</td><td>${cell(r[1])}</td>${hasChild ? `<td>${cell(r[2])}</td>` : ''}</tr>`).join('')}</table>`;
}
function ferryCard(fe, date) {
  const st = ferryStatus(fe, date);
  const out = sailings(fe.out, date), back = sailings(fe.back, date);
  const short = s => s.replace(/（.*?）/g, '');
  const col = (label, list) => `<div><div class="lbl" style="margin:0">${esc(label)}</div>${list.length ? `<div class="times">${timesHtml(list, date)}</div>` : '<div class="mini" style="margin-top:4px">时间每天不同，看下面说明</div>'}</div>`;
  const today = sameDay(date, new Date());
  const left = today ? out.filter(t => toMin(t) >= new Date().getHours() * 60 + new Date().getMinutes()).length : null;
  return `<div class="card ferry">
    <div class="fh"><b>⛴ ${esc(fe.name)}</b><div class="mini">${esc(fe.ops)} · 船程约 ${fmtDur(fe.mins)}</div></div>
    ${st === 'closed' ? `<div class="warn">⚠ ${date.getMonth() + 1} 月是季风期，这条航线基本停航。</div>` : st === 'monsoon' ? '<div class="warn">⚠ 季风期：班次少，风浪大会取消，出发前一天一定要确认。</div>' : ''}
    ${st !== 'closed' && today && out.length && left === 0 ? '<div class="warn">今天去程的船都开走了，看明天的班次。</div>' : ''}
    <div class="fcols">${col('去程 · ' + short(fe.a.name) + ' 开', out)}${col('回程 · ' + short(fe.b.name) + ' 开', back)}</div>
    ${fe.note ? `<p class="note" style="margin:0">${esc(fe.note)}</p>` : ''}
    ${fe.approx && (out.length || back.length) ? '<p class="mini" style="margin:0">⚠ 开船时间是参考资料，可能有变，以码头公告为准。</p>' : ''}
    ${fareHtml(fe)}
    ${fe.extra ? `<p class="note" style="margin:0">${esc(fe.extra)}</p>` : ''}
    <div class="btnrow" style="margin:0"><button data-navpt="${fe.a.lat},${fe.a.lng}" data-name="${esc(fe.a.name)}">🧭 导航到${esc(short(fe.a.name))}</button><button class="grab" data-grab="${fe.a.lat},${fe.a.lng}" data-name="${esc(short(fe.a.name))}">Grab 到码头</button>${fe.link ? `<a href="${esc(fe.link.url)}">${esc(fe.link.text)}</a>` : ''}</div>
    <p class="src" style="margin:0">资料来源（${esc(fe.asof || '')}）：${fe.src.map(u => `<a href="${esc(u)}">${esc(u.replace(/^https?:\/\//, '').split('/')[0])}</a>`).join('、')}</p>
  </div>`;
}
/** ferry section with a day picker; "box" is filled and re-filled when the day changes */
function ferrySection(box, routes, date) {
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const d0 = new Date(date); d0.setHours(0, 0, 0, 0);
  const chips = [0, 1, 2].map(i => { const d = new Date(t0); d.setDate(d.getDate() + i); return [d, ['今天', '明天', '后天'][i]]; });
  box.innerHTML = `<div class="fdays">${chips.map(([d, n]) => `<button class="chip${sameDay(d, d0) ? ' on' : ''}" data-fd="${ymd(d)}">${n}</button>`).join('')}
    <input type="date" value="${ymd(d0)}" data-fdate="1"><span class="mini">${d0.getMonth() + 1}月${d0.getDate()}日 ${WD[d0.getDay()]}</span></div>
    <div class="stack">${routes.map(fe => ferryCard(fe, d0)).join('')}</div>`;
  const go = v => { if (!v) return; const [y, m, d] = v.split('-').map(Number); ferrySection(box, routes, new Date(y, m - 1, d)); };
  box.querySelectorAll('[data-fd]').forEach(b => b.onclick = () => go(b.dataset.fd));
  box.querySelector('[data-fdate]').onchange = e => go(e.target.value);
}
function openFerry(id, date) {
  const fe = FR[id];
  if (!fe) return;
  const ov = overlay('船班 · ' + fe.name);
  ov.body.innerHTML = '<div class="dtl"><h1 style="font-size:20px">' + esc(fe.name) + '</h1><div id="fBox"></div></div>';
  ferrySection(ov.body.querySelector('#fBox'), [fe], date || new Date());
}

/* ---------------- food tab ---------------- */
let FD = {country: 'all', region: 'all', day: new Date().getDay()};
function foodCard(p, wd) {

  return `<div class="card fc" style="padding:12px"><button class="ph" data-open="${p.id}">${photo(p, true)}</button>
    <div class="sbody"><b data-open="${p.id}">${esc(p.name)}</b> ${weekly ? `<span class="badge">只在${esc(openDaysText(p))}</span>` : ''}
      <div class="meta"><span>${esc(R[p.region].name)}</span><span>${esc(p.hours)}</span></div>
      ${p.closed.length ? days7(p, wd) : ''}
      ${p.eat ? `<div class="dish">🍴 ${p.eat.slice(0, 3).map(e => esc(e.name) + (e.price ? ` <b>${esc(e.price)}</b>` : '')).join(' · ')}</div>` : ''}
      ${p.spots ? `<div class="dish">📍 ${WD[wd]}在：${esc((p.spots.find(x => x.day === wd) || {}).name || '—')}</div>` : ''}
      <div class="btnrow"><button data-nav="${p.id}">🧭 导航</button><button class="grab" data-grab="${p.lat},${p.lng}" data-name="${esc(p.en)}">Grab</button></div>

function renderFood() {
  const P = $('pFood');
  const foods = D.places.filter(x => x.cat === 'food');
  const inC = x => FD.country === 'all' || R[x.region].country === FD.country;
  const inSel = x => inC(x) && (FD.region === 'all' || x.region === FD.region);
  const regs = [...new Set(foods.filter(inC).map(x => x.region))].map(k => R[k]);
  const today = new Date().getDay();
  const nightish = x => x.slot === 'night' || x.slot === 'evening';
  const night = foods.filter(x => inSel(x) && nightish(x) && !x.closed.includes(FD.day)).sort((a, b) => (b.closed.length >= 4) - (a.closed.length >= 4) || b.rank - a.rank);
  const shut = foods.filter(x => inSel(x) && nightish(x) && x.closed.includes(FD.day));
  const dayEat = foods.filter(x => inSel(x) && !nightish(x)).sort((a, b) => b.rank - a.rank);
  P.innerHTML = `<h1>美食夜市</h1><p class="lead">${foods.length} 个美食点：必吃菜、价钱和夜市开市日。</p>
  <div class="hscroll">${[['all', '全部'], ...Object.entries(COUNTRY)].map(([k, v]) => `<button class="chip${FD.country === k ? ' on' : ''}" data-c="${k}">${v}</button>`).join('')}</div>
  <div class="hscroll">${[['all', '全部地区'], ...regs.map(r => [r.key, r.name])].map(([k, v]) => `<button class="chip${FD.region === k ? ' on' : ''}" data-r="${k}">${esc(v)}</button>`).join('')}</div>
  <h2>${FD.day === today ? '今晚' : WD[FD.day] + '晚上'}开的夜市</h2>
  <div class="hscroll" style="margin-bottom:8px">${[1, 2, 3, 4, 5, 6, 0].map(d => `<button class="chip${FD.day === d ? ' on' : ''}" data-d="${d}">${WD[d]}${d === today ? '（今天）' : ''}</button>`).join('')}</div>
  <div class="stack">${night.length ? night.map(x => foodCard(x, FD.day)).join('') : '<div class="empty" style="padding:20px">这一天这些地区没有收录的夜市</div>'}</div>
  ${shut.length ? `<p class="mini" style="margin-top:8px">${WD[FD.day]}不开：${shut.map(x => esc(x.name)).join('、')}</p>` : ''}
  <h2>白天吃什么</h2><div class="stack">${dayEat.length ? dayEat.map(x => foodCard(x, FD.day)).join('') : '<div class="mini">这里没有收录</div>'}</div>
  <p class="mini" style="margin-top:14px">价钱和营业时间来自各美食点下方注明的资料来源（2023–2026 年），小贩常会调整，以现场为准。</p>`;
  P.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { FD.country = b.dataset.c; FD.region = 'all'; renderFood(); });
  P.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { FD.region = b.dataset.r; renderFood(); });
  P.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { FD.day = +b.dataset.d; renderFood(); });
  P.onclick = e => { const o = e.target.closest('[data-open]'); if (o) openPlace(o.dataset.open); };
}

/* ---------------- mine ---------------- */
function renderMine() {
  const p = $('pMine');
  const plans = store.get('plans', []), favs = store.get('favs', []).filter(id => PL[id]), must = store.get('must', []).filter(id => PL[id]);
  const mini = ids => ids.length ? `<div class="cards">${ids.map(id => { const x = PL[id]; return `<button class="pc" data-open="${id}"><div class="im">${photo(x, true)}</div><div class="bd"><b>${esc(x.name)}</b><small><span>${esc(R[x.region].name)}</span></small></div></button>`; }).join('')}</div>` : '<div class="mini">还没有</div>';
  const fxLine = c => `1 ${c} ≈ RM${(FX[c] || 0).toFixed(c === 'IDR' ? 6 : 4)}`;
  p.innerHTML = `<h1>我的</h1>
  <h2>保存的攻略</h2>${plans.length ? `<div class="stack">${plans.map(x => `<div class="card row"><div style="flex:1;min-width:0"><b>${esc(x.title)}</b><div class="mini">${esc(x.input.start.name)} 出发 · ${new Date(x.days[0].date).toLocaleDateString('zh-CN')}</div></div><button class="btn sm" data-plan="${x.id}">打开</button><button class="x" data-del="${x.id}">✕</button></div>`).join('')}</div>` : '<div class="mini">生成攻略后点「保存攻略」就会出现在这里</div>'}
  <h2>必去清单</h2>${mini(must)}
  <h2>收藏的景点</h2>${mini(favs)}
  <h2>汇率</h2><div class="card"><div class="mini">${['SGD', 'THB', 'IDR', 'USD'].map(fxLine).join('　')}</div><div class="mini" style="margin-top:4px">更新于 ${esc(FX.asof || '')}（${esc(String(FX.src || '').replace(/^https?:\/\//, '').split('/')[0])}）</div><button class="btn ghost sm" id="fxNow" style="margin-top:8px">立即更新汇率</button></div>
  <h2>关于</h2><div class="card note" style="margin:0">景点照片来自维基共享资源 Wikimedia Commons，作者与授权写在每张照片下方。门票价格于 2026 年 11 月整理，每个价格都附来源和资料日期，「约」表示未能在官网核实；出发前请以官方为准。车程按道路距离估算，天气来自 Open-Meteo，地图 © OpenStreetMap 贡献者。<br>数据版本：${esc(D.built)}</div>`;
  p.onclick = e => {
    const o = e.target.closest('[data-open]'); if (o) { openPlace(o.dataset.open); return; }
    const pl = e.target.closest('[data-plan]');
    if (pl) { const x = store.get('plans', []).find(y => y.id === pl.dataset.plan); if (x) { CUR_PLAN = deserialize(x); showTab('pPlan'); renderPlanResult(); window.scrollTo(0, 0); } return; }
    const d = e.target.closest('[data-del]');
    if (d) { store.set('plans', store.get('plans', []).filter(y => y.id !== d.dataset.del)); renderMine(); return; }
    if (e.target.id === 'fxNow') refreshFx(true);
  };
}

/* ---------------- tabs & back ---------------- */
function showTab(id) {
  ['pPlan', 'pRoutes', 'pExplore', 'pFood', 'pMine'].forEach(k => $(k).hidden = k !== id);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === id));
  if (id === 'pRoutes') renderRoutes();
  if (id === 'pExplore') renderExplore();
  if (id === 'pMine') renderMine();
  if (id === 'pFood') renderFood();
  if (id === 'pPlan' && !CUR_PLAN) renderPlanForm();
  if (id === 'pPlan' && CUR_PLAN && planMap) setTimeout(() => planMap.invalidateSize(), 50);
  window.scrollTo(0, 0);
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { while (OV.length) closeOverlay(); showTab(b.dataset.p); });
window.onAndroidBack = () => {
  if (closeSheet()) return true;
  if (closeOverlay()) return true;
  if ($('pPlan').hidden) { showTab('pPlan'); return true; }
  if (CUR_PLAN) { CUR_PLAN = null; renderPlanForm(); return true; }
  return false;
};

/* ---------------- start ---------------- */
(function start() {
  const last = store.get('last', null);
  renderPlanForm();
  if (last && last.days && last.days.length) { try { CUR_PLAN = deserialize(last); renderPlanResult(); } catch (e) { CUR_PLAN = null; renderPlanForm(); } }
  refreshFx(false);
  const demo = A && A.demo ? A.demo() : decodeURIComponent((location.hash || '').slice(1));
  if (demo) runDemo(demo);
})();
// used by automatic tests: "plan:<town>:<days>", "tab:<id>", "place:<id>", "route:<id>"
function runDemo(d) {
  const [k, a, b] = d.split(':');
  if (k === 'plan') { while (OV.length) closeOverlay(); showTab('pPlan'); const t = matchTowns(a)[0]; if (t) { F.start = t; F.days = +b || 3; F.fixed = null; renderPlanForm(); go(); } }
  if (k === 'tab') { while (OV.length) closeOverlay(); showTab(a); }
  if (k === 'place') openPlace(a);
  if (k === 'route') { showTab('pRoutes'); openRoute(a); }
  if (k === 'locate') { while (OV.length) closeOverlay(); CUR_PLAN = null; showTab('pPlan'); renderPlanForm(); locate(); }
  if (k === 'go') { while (OV.length) closeOverlay(); if (F.start) { F.days = +a || F.days; F.fixed = null; go(); } }
  if (k === 'scroll') window.scrollTo(0, +a || 0);
  if (k === 'nav') { while (OV.length) closeOverlay(); openNavTo(a); }
  if (k === 'grab') { const p = PL[a]; openGrab({lat: p.lat, lng: p.lng, name: p.en}); }
  if (k === 'daynav') { showTab('pPlan'); if (CUR_PLAN) openDayNav(+a || 0); }
  if (k === 'ferry') { while (OV.length) closeOverlay(); openFerry(a, b ? new Date(b + 'T00:00:00') : new Date()); }
  if (k === 'follow') { const bt = document.querySelector('#nFollow'); if (bt) bt.click(); }
}
window.runDemo = runDemo;
if (!A && location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
