name: Travel guide emulator test

on:
  push:
    paths:
      - "travel/**"
      - "tests/travel-emulator.sh"
      - "tests/travel-planner.js"
      - ".github/workflows/travel-e2e.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  planner:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Planner checks (plans, edits, costs, calendar file)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/travel-planner.js

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          # services.gradle.org is sometimes slow: try a few times
          for i in 1 2 3; do ./gradlew :travel:assembleDebug --no-daemon && exit 0; echo "build try $i failed"; sleep 20; done; exit 1
      - name: Run in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tests/travel-emulator.sh
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p travel-e2e && cd travel-e2e && zip -q ../travel-e2e.zip * || true
          cd ..
          gh release delete travel-e2e --yes --cleanup-tag || true
          gh release create travel-e2e travel-e2e.zip --title "旅游攻略模拟器测试" --notes "emulator run" --latest=false --prerelease
