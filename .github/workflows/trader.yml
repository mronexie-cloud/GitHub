name: Build trader game APKs

# 天才交易员（文字版）和 天才交易员3D：单独编译并发布到固定的
# "trader" / "trader3d" 下载链接，合并到 main 之前也能直接下载安装。
on:
  push:
    paths:
      - "trader/**"
      - "trader3d/**"
      - ".github/workflows/trader.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build APKs
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          for i in 1 2 3; do ./gradlew :trader:assembleDebug :trader3d:assembleDebug --no-daemon 2>&1 | tee build.log && break; echo "build try $i failed"; [ $i = 3 ] && exit 1; sleep 20; done
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 200000 build.log > trader-build-tail.log || true
          gh release delete trader-build-log --yes --cleanup-tag || true
          gh release create trader-build-log trader-build-tail.log --target "$GITHUB_SHA" --title "trader build log" --notes "last failed trader build" --latest=false --prerelease
      - name: Publish APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp trader/build/outputs/apk/debug/trader-debug.apk trader.apk
          cp trader3d/build/outputs/apk/debug/trader3d-debug.apk trader3d.apk
          gh release delete trader --yes --cleanup-tag || true
          gh release create trader "trader.apk#天才交易员.apk" --target "$GITHUB_SHA" --title "天才交易员 下载" --notes "点中文名称即可下载安装。由 GitHub Actions 自动编译。" --latest=false
          gh release delete trader3d --yes --cleanup-tag || true
          gh release create trader3d "trader3d.apk#天才交易员3D.apk" --target "$GITHUB_SHA" --title "天才交易员3D 下载" --notes "点中文名称即可下载安装。由 GitHub Actions 自动编译。" --latest=false
