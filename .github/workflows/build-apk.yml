name: Build APK

on:
  push:
    paths-ignore:
      - "tts/**"
      - "ios/**"
      - ".github/workflows/pages.yml"
      - "tests/**"
      - ".github/workflows/probe.yml"
      - ".github/workflows/probe-turn.yml"
      - ".github/workflows/probe-platforms.yml"
      - ".github/workflows/probe-douyin.yml"
      - ".github/workflows/music-e2e.yml"
      - ".github/workflows/travel-e2e.yml"
      - ".github/workflows/travel-data.yml"
      - "travel-data/**"
      - ".github/workflows/downloader-e2e.yml"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/chat-e2e.yml"
      - ".github/workflows/tts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          # services.gradle.org is sometimes slow: try a few times
          for i in 1 2 3; do ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log && break; echo "build try $i failed"; [ $i = 3 ] && exit 1; sleep 20; done
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 200000 build.log > build-tail.log || true
          gh release delete build-log --yes --cleanup-tag || true
          gh release create build-log build-tail.log --title "build log" --notes "last failed build" --latest=false --prerelease
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            xiangqi/build/outputs/apk/debug/xiangqi-debug.apk
            sanguo/build/outputs/apk/debug/sanguo-debug.apk
            mahjong/build/outputs/apk/debug/mahjong-debug.apk
            chat/build/outputs/apk/debug/chat-debug.apk
            downloader/build/outputs/apk/debug/*.apk
            music/build/outputs/apk/debug/music-debug.apk
            travel/build/outputs/apk/debug/travel-debug.apk
            deathclock/build/outputs/apk/debug/deathclock-debug.apk
      - name: Publish APK as release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gomoku.apk
          cp xiangqi/build/outputs/apk/debug/xiangqi-debug.apk xiangqi.apk
          cp sanguo/build/outputs/apk/debug/sanguo-debug.apk sanguo.apk
          cp mahjong/build/outputs/apk/debug/mahjong-debug.apk mahjong.apk
          cp chat/build/outputs/apk/debug/chat-debug.apk chat.apk
          cp downloader/build/outputs/apk/debug/downloader-arm64-v8a-debug.apk downloader-arm64.apk
          cp downloader/build/outputs/apk/debug/downloader-armeabi-v7a-debug.apk downloader-armv7.apk
          cp music/build/outputs/apk/debug/music-debug.apk music.apk
          cp travel/build/outputs/apk/debug/travel-debug.apk travel.apk
          cp deathclock/build/outputs/apk/debug/deathclock-debug.apk deathclock.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "deathclock.apk#死亡倒计时（每年邮件提醒）.apk" "travel.apk#东南亚旅游攻略（马新泰印行程规划）.apk" "music.apk#音乐盒（本地音乐播放器）.apk" "downloader-arm64.apk#万能下载（视频下载器，多数手机选这个）.apk" "downloader-armv7.apk#万能下载（老款 32 位手机）.apk" "chat.apk#译聊（多人聊天自动翻译）.apk" "mahjong.apk#二人麻将（联网对战）.apk" "gomoku.apk#五子棋.apk" "xiangqi.apk#象棋.apk" "sanguo.apk#三国身份局.apk" --title "安卓 App 下载" --notes "点中文名称即可下载安装。由 GitHub Actions 自动编译。" --latest
