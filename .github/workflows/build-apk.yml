name: Build APK

on:
  push:
    paths-ignore:
      - "tts/**"
      - "ios/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/tts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            xiangqi/build/outputs/apk/debug/xiangqi-debug.apk
            sanguo/build/outputs/apk/debug/sanguo-debug.apk
      - name: Publish APK as release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gomoku.apk
          cp xiangqi/build/outputs/apk/debug/xiangqi-debug.apk xiangqi.apk
          cp sanguo/build/outputs/apk/debug/sanguo-debug.apk sanguo.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest gomoku.apk xiangqi.apk sanguo.apk --title "游戏 App" --notes "gomoku.apk 是五子棋，xiangqi.apk 是象棋，sanguo.apk 是三国身份局。手机上点文件名即可下载安装，由 GitHub Actions 自动编译。" --latest
