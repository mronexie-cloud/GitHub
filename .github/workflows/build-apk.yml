name: Build APK

on:
  push:
    paths-ignore:
      - "tts/**"
      - "ios/**"
      - ".github/workflows/pages.yml"
      - "tests/**"
      - ".github/workflows/probe.yml"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/chat-e2e.yml"
      - ".github/workflows/tts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            xiangqi/build/outputs/apk/debug/xiangqi-debug.apk
            sanguo/build/outputs/apk/debug/sanguo-debug.apk
            mahjong/build/outputs/apk/debug/mahjong-debug.apk
            chat/build/outputs/apk/debug/chat-debug.apk
      - name: Publish APK as release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gomoku.apk
          cp xiangqi/build/outputs/apk/debug/xiangqi-debug.apk xiangqi.apk
          cp sanguo/build/outputs/apk/debug/sanguo-debug.apk sanguo.apk
          cp mahjong/build/outputs/apk/debug/mahjong-debug.apk mahjong.apk
          cp chat/build/outputs/apk/debug/chat-debug.apk chat.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "chat.apk#译聊（多人聊天自动翻译）.apk" "mahjong.apk#二人麻将（联网对战）.apk" "gomoku.apk#五子棋.apk" "xiangqi.apk#象棋.apk" "sanguo.apk#三国身份局.apk" --title "安卓 App 下载" --notes "点中文名称即可下载安装。由 GitHub Actions 自动编译。" --latest
