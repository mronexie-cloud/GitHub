name: Build translator APK

# 全屏翻译（基于开源项目 屏译 / ciddwd/overlay-translator，Apache-2.0）。
# 它是独立的 Gradle 工程（translator/），和其他 App 分开编译、分开发布。
on:
  push:
    paths:
      - "translator/**"
      - ".github/workflows/translator.yml"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: translator
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build release APK (signed with the repo's shared key)
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          RELEASE_KEYSTORE_PASSWORD: android
          RELEASE_KEY_ALIAS: androiddebugkey
          RELEASE_KEY_PASSWORD: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          for i in 1 2 3; do ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log && break; echo "build try $i failed"; [ $i = 3 ] && exit 1; sleep 20; done
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 200000 build.log > translator-build-tail.log || true
          gh release delete translator-build-log --yes --cleanup-tag || true
          gh release create translator-build-log translator-build-tail.log --target "$GITHUB_SHA" --title "translator build log" --notes "last failed translator build" --latest=false --prerelease
      - name: Locate APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n1)
          [ -n "$APK" ] || { echo "::error::no signed release APK"; ls -la app/build/outputs/apk/release; exit 1; }
          cp "$APK" translator.apk
          ls -la translator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: translator-apk
          path: translator/translator.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete translator --yes --cleanup-tag || true
          gh release create translator "translator.apk#全屏翻译（屏幕实时翻译，64 位安卓 8.0+）.apk" --target "$GITHUB_SHA" --title "全屏翻译 App 下载" --notes "点中文名称即可下载安装。基于开源项目 屏译（ciddwd/overlay-translator，Apache-2.0）修改，由 GitHub Actions 自动编译。" --latest=false
