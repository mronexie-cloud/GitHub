name: Build grammar game APK

# 0基础英语发音：单独编译并发布到固定的 "grammar" 下载链接，
# 这样在合并到 main 之前也能直接下载安装。
on:
  push:
    paths:
      - "grammar/**"
      - ".github/workflows/grammar.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grammar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          for i in 1 2 3; do ./gradlew :grammar:assembleDebug --no-daemon 2>&1 | tee build.log && break; echo "build try $i failed"; [ $i = 3 ] && exit 1; sleep 20; done
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 200000 build.log > grammar-build-tail.log || true
          gh release delete grammar-build-log --yes --cleanup-tag || true
          gh release create grammar-build-log grammar-build-tail.log --target "$GITHUB_SHA" --title "grammar build log" --notes "last failed grammar build" --latest=false --prerelease
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp grammar/build/outputs/apk/debug/grammar-debug.apk grammar.apk
          gh release delete grammar --yes --cleanup-tag || true
          gh release create grammar "grammar.apk#0基础英语发音.apk" --target "$GITHUB_SHA" --title "0基础英语发音 下载" --notes "点中文名称即可下载安装。由 GitHub Actions 自动编译。" --latest=false
