name: Build wallet APK

# 账号卡包：编译 APK，发布到固定的 "wallet" 下载链接（不用等合并到 main）。
on:
  push:
    paths:
      - "wallet/**"
      - ".github/workflows/wallet.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          for i in 1 2 3; do ./gradlew :wallet:assembleDebug --no-daemon 2>&1 | tee build.log && break; echo "build try $i failed"; [ $i = 3 ] && exit 1; sleep 20; done
      - name: Publish log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 200000 build.log > wallet-build-tail.log || true
          gh release delete wallet-build-log --yes --cleanup-tag || true
          gh release create wallet-build-log wallet-build-tail.log --target "$GITHUB_SHA" --title "wallet build log" --notes "last failed wallet build" --latest=false --prerelease
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp wallet/build/outputs/apk/debug/wallet-debug.apk wallet.apk
          gh release delete wallet --yes --cleanup-tag || true
          gh release create wallet "wallet.apk#账号卡包.apk" --target "$GITHUB_SHA" --title "账号卡包 下载" --notes "点中文名称即可下载安装。由 GitHub Actions 自动编译。" --latest=false
