name: Probe Douyin in a browser

on:
  push:
    paths:
      - "tests/probe-douyin.py"
      - ".github/workflows/probe-douyin.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium && sudo apt-get install -y -qq ffmpeg xvfb > /dev/null
      - run: python tests/probe-douyin.py 2>&1 | tee douyin.log
      - run: HEADFUL=1 xvfb-run -a python tests/probe-douyin.py 2>&1 | grep -E "^==|  D-headful|in-page|detail desc|play_addr|bit_rate|fetch play|frame.*desktop" | tee -a douyin.log
      - if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr douyin-shots.zip shots || true
          gh release delete probe-douyin --yes --cleanup-tag || true
          gh release create probe-douyin douyin.log douyin-shots.zip --title "probe" --notes "douyin probe" --latest=false --prerelease
