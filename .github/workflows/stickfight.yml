name: Build stickman fighting game APK

# 暗影格斗场（横版火柴人格斗）：单独编译并发布到固定的 "stickfight" 下载链接，
# 合并到 main 之前也能直接下载安装。
on:
  push:
    paths:
      - "stickfight/**"
      - ".github/workflows/stickfight.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stickfight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          for i in 1 2 3; do ./gradlew :stickfight:assembleDebug --no-daemon 2>&1 | tee build.log && break; echo "build try $i failed"; [ $i = 3 ] && exit 1; sleep 20; done
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 200000 build.log > stickfight-build-tail.log || true
          gh release delete stickfight-build-log --yes --cleanup-tag || true
          gh release create stickfight-build-log stickfight-build-tail.log --target "$GITHUB_SHA" --title "stickfight build log" --notes "last failed stickfight build" --latest=false --prerelease
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp stickfight/build/outputs/apk/debug/stickfight-debug.apk stickfight.apk
          gh release delete stickfight --yes --cleanup-tag || true
          gh release create stickfight "stickfight.apk#暗影格斗场.apk" --target "$GITHUB_SHA" --title "暗影格斗场 下载" --notes "点中文名称即可下载安装。由 GitHub Actions 自动编译。" --latest=false
