name: Build AI video APK

# AI成片：先在真实网络上测一下免费的 Edge 配音能不能用，再编译 APK，
# 发布到固定的 "video" 下载链接（不用等合并到 main）。
on:
  push:
    paths:
      - "video/**"
      - ".github/workflows/video.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Show how the current edge-tts library connects (debug)
        continue-on-error: true
        run: |
          pip install -q edge-tts
          python - <<'PY' > edge-ref.log 2>&1
          import edge_tts, inspect, edge_tts.constants as c, edge_tts.drm as d
          print("version", getattr(edge_tts, "__version__", "?"))
          print(inspect.getsource(c))
          print(inspect.getsource(d))
          import edge_tts.communicate as m
          src = inspect.getsource(m)
          i = src.find("ws_connect"); print(src[max(0, i-1500):i+600])
          PY
          cat edge-ref.log
          edge-tts --voice zh-CN-XiaoxiaoNeural --text "测试" --write-media py.mp3 && ls -la py.mp3
      - name: Unit tests + live free-voice test
        id: voice
        continue-on-error: true
        env:
          EDGE_TTS_LIVE: "1"
          EDGE_TTS_OUT: ${{ github.workspace }}/voice-test
        run: |
          set -o pipefail
          ./gradlew :video:testDebugUnitTest --no-daemon 2>&1 | tee test.log
          ls -la voice-test
      - name: Build APK
        run: |
          set -o pipefail
          for i in 1 2 3; do ./gradlew :video:assembleDebug --no-daemon 2>&1 | tee build.log && break; echo "build try $i failed"; [ $i = 3 ] && exit 1; sleep 20; done
      - name: Publish logs on failure
        if: failure() || steps.voice.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "voice test: ${{ steps.voice.outcome }}"; cat edge-ref.log 2>/dev/null; echo "----- test -----"; tail -c 120000 test.log 2>/dev/null; echo; echo "----- build -----"; tail -c 120000 build.log 2>/dev/null; } > video-build-tail.log
          gh release delete video-build-log --yes --cleanup-tag || true
          gh release create video-build-log video-build-tail.log --target "$GITHUB_SHA" --title "video build log" --notes "last failed video build or voice test" --latest=false --prerelease
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp video/build/outputs/apk/debug/video-debug.apk video.apk
          extra=""
          if [ -f voice-test/zh-CN-XiaoxiaoNeural.mp3 ]; then cp voice-test/zh-CN-XiaoxiaoNeural.mp3 voice-sample.mp3; extra="voice-sample.mp3#免费配音试听（晓晓）.mp3"; fi
          gh release delete video --yes --cleanup-tag || true
          gh release create video "video.apk#AI成片（免费生成知识短视频）.apk" $extra --target "$GITHUB_SHA" --title "AI成片 下载" \
            --notes "点中文名称即可下载安装。免费配音云端实测：${{ steps.voice.outcome }}。由 GitHub Actions 自动编译。" --latest=false
