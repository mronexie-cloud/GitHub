name: Music player emulator test

on:
  push:
    paths:
      - "music/**"
      - "tests/music-emulator.sh"
      - "tests/make-music.py"
      - ".github/workflows/music-e2e.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Make test songs
        run: pip install imageio-ffmpeg mutagen && python tests/make-music.py
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :music:assembleDebug --no-daemon
      - name: Run in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tests/music-emulator.sh
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p music-e2e && cd music-e2e && zip -q ../music-e2e.zip * || true
          cd ..
          gh release delete music-e2e --yes --cleanup-tag || true
          gh release create music-e2e music-e2e.zip --title "音乐盒模拟器测试" --notes "emulator run" --latest=false --prerelease
