name: Travel guide preview APK

# 东南亚旅游攻略：分支上的改动先编译一个试用版，发布到固定的 "travel-preview" 下载链接，
# 合并到 main 之前就能安装试用（正式版仍由 Build APK 在 main 上发布）。
on:
  push:
    branches-ignore:
      - main
    paths:
      - "travel/**"
      - ".github/workflows/travel-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: travel-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          for i in 1 2 3; do ./gradlew :travel:assembleDebug --no-daemon && break; echo "build try $i failed"; [ $i = 3 ] && exit 1; sleep 20; done
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp travel/build/outputs/apk/debug/travel-debug.apk travel.apk
          gh release delete travel-preview --yes --cleanup-tag || true
          gh release create travel-preview "travel.apk#东南亚旅游攻略（试用版）.apk" --target "$GITHUB_SHA" --title "东南亚旅游攻略 试用版（${GITHUB_REF_NAME}）" --notes "分支 ${GITHUB_REF_NAME} 的试用版。点中文名称即可下载安装。" --latest=false --prerelease
