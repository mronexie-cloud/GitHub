<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>耳机翻译</title>
<style>
:root{
  --bg:#F2F2F7;--card:#fff;--text:#000;--sub:#6E6E73;--sep:rgba(60,60,67,.14);--fill:#E9E9EE;
  --blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--indigo:#5856D6;
  --r:22px;
  --font:-apple-system,"SF Pro Text","SF Pro Display","PingFang SC","Noto Sans SC","Noto Sans CJK SC",system-ui,Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.page{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 120px;display:none;-webkit-overflow-scrolling:touch}
.page.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.large{font-size:34px;font-weight:700;letter-spacing:-.6px;margin:14px 4px 4px}
.subtitle{color:var(--sub);font-size:15px;margin:0 4px 14px}
.group-h{font-size:13px;color:var(--sub);text-transform:uppercase;margin:24px 18px 7px;letter-spacing:.2px}
.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.foot{font-size:13px;color:var(--sub);margin:7px 18px 0;line-height:1.45}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 16px;position:relative;width:100%;text-align:left;font-size:17px}
.row+.row::before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--sep)}
.row.noicon+.row.noicon::before,.row.noicon+.row::before{left:16px}
.row .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.row .ic svg{width:19px;height:19px}
.row .lbl{flex:1;min-width:0}
.row .lbl small{display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.35}
.row .val{color:var(--sub);font-size:16px;white-space:nowrap}
.row .chev{color:#C4C4C7;font-size:20px;margin-left:2px}
.row:active{background:#E5E5EA}
.row.static:active{background:none}
.row.danger{color:var(--red)}
.row.link{color:var(--blue)}
.badge{display:inline-block;font-size:11px;font-weight:600;background:var(--blue);color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}

/* iOS switch */
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:#E9E9EA;border-radius:31px;transition:.25s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:.25s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::after{transform:translateX(20px)}

/* hero */
.hero{background:var(--card);border-radius:28px;padding:22px 18px 18px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% -20% auto;height:300px;background:radial-gradient(closest-side,rgba(0,122,255,.10),transparent);pointer-events:none}
.hero svg.buds{width:230px;height:170px;display:block;margin:0 auto;filter:drop-shadow(0 18px 22px rgba(0,0,0,.12))}
.hero .name{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.3px}
.hero .state{font-size:14px;color:var(--sub);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.dot.off{background:#C7C7CC}
.batt{display:flex;justify-content:center;gap:26px;margin-top:16px}
.batt .b{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.ring{width:54px;height:54px;position:relative}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--text)}
.hero .btn{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:25px;background:var(--blue);color:#fff;font-size:17px;font-weight:600}
.btn.gray{background:var(--fill);color:var(--blue)}
.btn.wide{width:100%}
.btn:active{opacity:.75;transform:scale(.98)}

/* noise control */
.anc{display:flex;justify-content:space-around;padding:18px 8px 14px}
.anc button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--text)}
.anc .c{width:62px;height:62px;border-radius:50%;background:var(--fill);display:grid;place-items:center;transition:.2s}
.anc .c svg{width:30px;height:30px}
.anc button:active .c{background:var(--blue);color:#fff}

/* slider */
.vol{display:flex;align-items:center;gap:12px;padding:14px 16px}
.vol svg{width:20px;height:20px;color:var(--sub);flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:linear-gradient(var(--blue),var(--blue)) 0/var(--p,50%) 100% no-repeat,#E3E3E8;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06)}

/* tab bar (floating glass) */
.tabbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:32px;background:rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:0 8px 30px rgba(0,0,0,.12),inset 0 0 0 .5px rgba(255,255,255,.7);z-index:20}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;width:96px;height:54px;justify-content:center;border-radius:27px;font-size:11px;font-weight:600;color:#8E8E93;transition:.2s}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--blue);background:rgba(0,122,255,.11)}

/* translate page */
.tbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 0}
.tbar .large{margin:14px 4px 10px}
.round{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.round svg{width:21px;height:21px}
.tbtns{display:flex;gap:8px}
.langs{background:var(--card);border-radius:var(--r);position:relative}
.lrow{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.lrow+.lrow{border-top:.5px solid var(--sep)}
.lrow .who{font-size:13px;color:var(--sub);width:50px}
.lrow .ln{flex:1;font-size:19px;font-weight:600}
.lrow .ln small{font-size:13px;color:var(--sub);font-weight:400;margin-left:6px}
.swap{position:absolute;right:56px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--blue);transition:transform .35s}
.swap svg{width:20px;height:20px}
.swap.spin{transform:translateY(-50%) rotate(180deg)}

.feed{margin-top:16px;display:flex;flex-direction:column;gap:10px;padding-bottom:210px}
.empty{text-align:center;color:var(--sub);padding:34px 20px 0;font-size:15px;line-height:1.6}
.empty svg{width:64px;height:64px;color:#C7C7CC;margin-bottom:10px}
.msg{max-width:88%;border-radius:20px;padding:12px 15px;background:var(--card);align-self:flex-start;position:relative;animation:pop .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff}
.msg .tr{font-size:19px;line-height:1.38;font-weight:500;word-break:break-word}
.msg .src{font-size:14px;line-height:1.35;color:var(--sub);margin-top:6px;word-break:break-word}
.msg.me .src{color:rgba(255,255,255,.75)}
.msg .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-bottom:5px}
.msg.me .meta{color:rgba(255,255,255,.8)}
.msg .play{margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(120,120,128,.14)}
.msg.me .play{background:rgba(255,255,255,.22)}
.msg .play svg{width:15px;height:15px}
.msg .fail{color:var(--red);font-size:15px}
.msg.me .fail{color:#FFE1DE}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.35;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:1}}

/* dock */
.dock{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:15;border-radius:30px;background:rgba(255,255,255,.78);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:0 10px 34px rgba(0,0,0,.13);padding:14px 16px 16px;display:none}
.dock.on{display:block}
.live{display:flex;align-items:center;gap:10px;min-height:28px}
.wave{display:flex;align-items:center;gap:3px;height:26px;flex:none}
.wave i{width:4px;border-radius:2px;background:var(--blue);height:5px;transition:height .09s}
.wave.me i{background:var(--indigo)}
.live .st{font-size:13px;color:var(--sub);font-weight:600;white-space:nowrap}
.live .pt{font-size:16px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctrls{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.cbtn{width:54px;height:54px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--text)}
.cbtn svg{width:24px;height:24px}
.cbtn.stop{color:var(--red)}
.talk{flex:1;margin:0 14px;height:58px;border-radius:29px;background:var(--indigo);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.talk svg{width:22px;height:22px}
.talk.active{background:var(--red);box-shadow:0 0 0 6px rgba(255,59,48,.18)}
.talk{cursor:default;font-size:15px;background:var(--fill);color:var(--sub);height:54px}
.msg.draft{opacity:.78}
.msg.draft .tr{font-weight:500}
.msg .cursor{display:inline-block;width:2px;height:1em;background:currentColor;margin-left:2px;vertical-align:-2px;animation:bl 1s infinite}
.startwrap{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:15}
.startwrap .btn{width:100%;height:58px;border-radius:29px;font-size:18px;box-shadow:0 10px 26px rgba(0,122,255,.35)}
.startwrap .hint{text-align:center;color:var(--sub);font-size:13px;margin-bottom:10px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;background:var(--bg);border-radius:30px 30px 0 0;z-index:41;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#C7C7CC;margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;flex:none}
.sheet .sh h3{font-size:17px;font-weight:600;flex:1;text-align:center}
.sheet .sh .x{width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--sub);display:grid;place-items:center;font-size:17px}
.sheet .sh .sp{width:32px}
.sheet .sb{overflow-y:auto;padding:6px 16px 26px}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:12px;padding:0 10px;height:38px;margin:4px 0 10px}
.search input{border:0;background:none;outline:none;font:inherit;font-size:16px;flex:1}
.check{color:var(--blue);font-weight:700}
.tag{font-size:11px;border-radius:5px;padding:1px 5px;background:var(--fill);color:var(--sub);margin-left:6px;vertical-align:2px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:4px 0}
.seg button{flex:1;height:30px;border-radius:8px;font-size:14px;font-weight:500}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.info{text-align:center;padding:10px 6px 4px}
.info .big{width:72px;height:72px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;color:#fff}
.info .big svg{width:40px;height:40px}
.info h2{font-size:22px;margin-bottom:8px}
.info p{color:var(--sub);font-size:15px;line-height:1.55;margin-bottom:16px;text-align:left}
.steps{counter-reset:s;text-align:left;margin:0 0 18px}
.steps li{list-style:none;counter-increment:s;position:relative;padding:0 0 12px 36px;font-size:15px;line-height:1.5}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}

/* face to face */
.f2f{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column}
.f2f.on{display:flex}
.half{flex:1;display:flex;flex-direction:column;padding:22px 22px;position:relative;color:#fff}
.half.top{transform:rotate(180deg);background:linear-gradient(160deg,#1C1C1E,#2C2C2E)}
.half.bot{background:linear-gradient(160deg,#0A84FF,#5E5CE6)}
.half .hl{font-size:13px;opacity:.7;font-weight:600;letter-spacing:.3px}
.half .ht{font-size:30px;line-height:1.3;font-weight:700;margin-top:12px;flex:1;overflow:auto;word-break:break-word}
.half .hs{font-size:15px;opacity:.6;margin-top:8px;max-height:3.2em;overflow:hidden}
.half .hb{display:flex;align-items:center;gap:10px;margin-top:14px}
.half .mic{height:48px;border-radius:24px;padding:0 20px;background:rgba(255,255,255,.18);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px}
.half .mic svg{width:20px;height:20px}
.half .mic.active{background:#FF453A}
.f2f .close{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.f2f .close svg{width:20px;height:20px}

.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:rgba(30,30,32,.92);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;z-index:60;transition:transform .35s cubic-bezier(.2,1.2,.4,1);max-width:88%;text-align:center;line-height:1.4}
.toast.on{transform:translate(-50%,0)}
.banner{background:#FFF4E5;color:#8A5300;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.45;margin-top:12px;display:flex;gap:10px;align-items:center}
.banner button{color:var(--blue);font-weight:600;white-space:nowrap}

.batt3{display:flex;justify-content:center;gap:12px;margin-top:16px}
.bi{flex:1;max-width:104px;background:var(--bg);border-radius:16px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bi .bl{font-size:12px;color:var(--sub)}
.bi .bv{font-size:17px;font-weight:700;display:flex;align-items:center;gap:3px}
.bi .bv svg{width:13px;height:13px;color:var(--green)}
.bbar{width:46px;height:8px;border-radius:4px;background:#E3E3E8;overflow:hidden}
.bbar i{display:block;height:100%;border-radius:4px}
.anc button.on .c{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(0,122,255,.3)}
.anc button.on{color:var(--blue);font-weight:600}
.anc button:disabled{opacity:.45}
.levels{display:flex;gap:6px;padding:0 14px 14px}
.levels button{flex:1;height:34px;border-radius:17px;background:var(--fill);font-size:14px;font-weight:500}
.levels button.on{background:rgba(0,122,255,.13);color:var(--blue);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tile:active{transform:scale(.98)}
.tile .ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;margin-bottom:6px}
.tile .ti svg{width:22px;height:22px}
.tile b{font-size:17px}
.tile small{font-size:12.5px;color:var(--sub);line-height:1.35}
</style>
</head>
<body>

<!-- ========== 耳机 ========== -->
<section class="page on" id="pg-buds">
  <div class="large">耳机</div>
  <div id="permBanner"></div>
  <div class="hero" id="hero" style="margin-top:12px"></div>
  <div id="ctlBanner"></div>

  <div class="group-h">噪声控制</div>
  <div class="group">
    <div class="anc">
      <button data-anc="anc"><span class="c"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/><circle cx="12" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>降噪</button>
      <button data-anc="off"><span class="c"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>关闭</button>
      <button data-anc="transparency"><span class="c"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/><g><circle cx="12" cy="1.6" r="1"/><circle cx="16.6" cy="3.4" r="1"/><circle cx="7.4" cy="3.4" r="1"/><circle cx="18.6" cy="7.6" r="1"/><circle cx="5.4" cy="7.6" r="1"/></g></svg></span>通透</button>
    </div>
    <div id="ancLevels"></div>
  </div>
  <div class="foot" id="ancFoot">直接切换耳机的降噪模式。</div>

  <div class="group-h">翻译</div>
  <div class="tiles">
    <button class="tile" id="goLive"><span class="ti" style="background:linear-gradient(135deg,#0A84FF,#5E5CE6)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h8M8 3v2M10 5c-.6 3.5-3 6-6 7.5M6 8.5c1.2 1.8 3 3.2 5 4"/><path d="M13 21l4-10 4 10M14.5 17.5h5"/></svg></span><b>同声传译</b><small>戴上耳机，双方随便说，自动翻译</small></button>
    <button class="tile" id="goF2F"><span class="ti" style="background:linear-gradient(135deg,#FF9F0A,#FF375F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M12 6v12"/><path d="M7 10.5h2M15 13.5h2"/></svg></span><b>面对面翻译</b><small>手机分上下两半，各看各的语言</small></button>
  </div>

  <div class="group-h">更多功能</div>
  <div class="group">
    <label class="row static" id="gameRow" style="display:none">
      <span class="ic" style="background:#FF2D55"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10a5 5 0 0 1 4.9 6l-.8 4a2.6 2.6 0 0 1-4.5 1.2L14.4 16H9.6l-2.2 2.2A2.6 2.6 0 0 1 2.9 17l-.8-4A5 5 0 0 1 7 7zm1 3v1.5H6.5v1.5H8v1.5h1.5V13H11v-1.5H9.5V10zm8 .5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg></span>
      <span class="lbl">游戏模式<small>降低声音延迟，打游戏声画同步</small></span>
      <span class="sw"><input type="checkbox" id="gameSw"><i></i></span>
    </label>
    <button class="row" id="findBtn">
      <span class="ic" style="background:var(--green)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7zm0 4a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg></span>

      cb('onAsr','ready','',tag);
      const next=()=>{const [who,txt]=script[said%4];const words=txt.split(/(?<=\s)|(?=[\u4e00-\u9fff])/);let i=0;

    buds(){return JSON.stringify(this._b)},_b:{status:'ok',model:'OnePlus Buds Ace 3',fw:'1.0.4.6',left:90,right:85,case:64,chL:false,chR:false,chCase:true,noise:'transparency',level:null,levels:['smart','mild','moderate','max'],game:false,finding:false},

    stopListen(){clearTimeout(lt)},finishListen(){},

    volume:()=>JSON.stringify({v:vol,max:15}),setVolume(v){vol=v},vibrate(){},openBluetooth(){},openAppSettings(){},openTtsSettings(){},openUrl(){},askPermissions(){},

/* ================= storage ================= */

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const buzz=ms=>{try{A.vibrate(ms)}catch(e){}};
const ICON_SPK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

/* ================= tabs ================= */
let tab='buds';

  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));renderDock()}

/* ================= earbuds page ================= */
let dev={perm:true,mic:true,bt:true,devices:[]};
const BUDS_SVG=`<svg class="buds" viewBox="0 0 230 170">
 <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#DADDE3"/></linearGradient>
 <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAFAFC"/><stop offset="1" stop-color="#E1E3E8"/></linearGradient></defs>
 <g transform="translate(46 18) rotate(6 22 26)"><ellipse cx="22" cy="26" rx="26" ry="24" fill="url(#g1)"/><ellipse cx="13" cy="24" rx="9" ry="8" fill="#C9CDD6"/><circle cx="12" cy="24" r="4" fill="#9AA0AC"/><rect x="28" y="30" width="17" height="98" rx="8.5" fill="url(#g2)"/><rect x="31" y="112" width="11" height="12" rx="5" fill="#D3D6DD"/></g>
 <g transform="translate(184 18) scale(-1 1) rotate(6 22 26)"><ellipse cx="22" cy="26" rx="26" ry="24" fill="url(#g1)"/><ellipse cx="13" cy="24" rx="9" ry="8" fill="#C9CDD6"/><circle cx="12" cy="24" r="4" fill="#9AA0AC"/><rect x="28" y="30" width="17" height="98" rx="8.5" fill="url(#g2)"/><rect x="31" y="112" width="11" height="12" rx="5" fill="#D3D6DD"/></g>
</svg>`;
let buds={status:'idle'};
const BOLT='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>';
function battItem(label,v,ch){
  const col=v<0?'#C7C7CC':v<=20?'var(--red)':v<=40?'var(--orange)':'var(--green)';
  return `<div class="bi"><span class="bl">${label}</span><span class="bv">${ch?BOLT:''}${v<0?'—':v+'%'}</span><span class="bbar"><i style="width:${v<0?0:v}%;background:${col}"></i></span></div>`}
function renderBuds(){
  const d=dev.devices[0];
  const pb=$('#permBanner');
  if(!dev.perm||!dev.mic){pb.innerHTML=`<div class="banner"><span style="flex:1">${!dev.perm?'需要“附近设备/蓝牙”权限才能控制耳机、读取电量。':'需要麦克风权限才能翻译。'}</span><button id="permFix">去允许</button></div>`;
    $('#permFix').onclick=()=>{A.askPermissions();setTimeout(()=>A.openAppSettings(),900)}}else pb.innerHTML='';
  const h=$('#hero');
  if(!d){h.innerHTML=`${BUDS_SVG.replace('class="buds"','class="buds" style="opacity:.45"')}<div class="name">${dev.bt?'未连接耳机':'蓝牙已关闭'}</div><div class="state"><span class="dot off"></span>打开耳机盒，在蓝牙里连接耳机</div><button class="btn gray" id="heroBt" style="margin-top:16px">打开蓝牙设置</button>`;
    $('#heroBt').onclick=()=>A.openBluetooth();renderCtl();return}
  const ok=buds.status==='ok'&&(buds.left>=0||buds.right>=0);
  const name=buds.model||d.name;
  const st=buds.status==='ok'?'已连接 · 可控制':buds.status==='connecting'?'已连接 · 正在连接控制…':'已连接';
  const batt=ok?`<div class="batt3">${battItem('左耳',buds.left,buds.chL)}${battItem('右耳',buds.right,buds.chR)}${battItem('充电盒',buds.case,buds.chCase)}</div>`

const LV={smart:'智能',mild:'轻度',moderate:'中度',max:'深度'};
function renderCtl(){

  $('#gameRow').style.display=can&&buds.game!==undefined?'flex':'none';

try{buds=JSON.parse(A.buds());if(buds.game===null)delete buds.game}catch(e){}

function setNoise(mode){
  if(buds.status!=='ok'){
    openSheet('噪声控制',`<div class="info"><div class="big" style="background:linear-gradient(135deg,#0A84FF,#5E5CE6)"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></div>
     <h2>暂时连不上耳机控制</h2><p>可能是手机自带的耳机页正在使用耳机的控制通道。可以先在系统耳机页切换，或者点「重试」。</p></div>

/* ================= translation ================= */
const nativeWait={};let nativeSeq=0;
window.__httpCb=(id,body)=>{const p=nativeWait[id];if(!p)return;delete nativeWait[id];body==null?p.rej(new Error('native http failed')):p.res(body)};
function nativeGet(url){return new Promise((res,rej)=>{const id='h'+(++nativeSeq);nativeWait[id]={res,rej};
  try{A.httpGet(id,url)}catch(e){delete nativeWait[id];rej(e);return}
  setTimeout(()=>{if(nativeWait[id]){delete nativeWait[id];rej(new Error('timeout'))}},15000)})}
async function getText(url){
  if(window.__demo)return nativeGet(url);
  try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),10000);const r=await fetch(url,{signal:ctl.signal});clearTimeout(to);
    if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}
  catch(e){return nativeGet(url)}
}
async function trGoogle(text,sl,tl){
  const u='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+encodeURIComponent(sl)+'&tl='+encodeURIComponent(tl)+'&dt=t&q='+encodeURIComponent(text);
  const d=JSON.parse(await getText(u));return(d[0]||[]).map(x=>x&&x[0]||'').join('');
}
async function trGoogleAlt(text,sl,tl){
  const u='https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl='+encodeURIComponent(sl)+'&tl='+encodeURIComponent(tl)+'&q='+encodeURIComponent(text);
  const d=JSON.parse(await getText(u));
  if(Array.isArray(d)){const f=d[0];if(Array.isArray(f)&&typeof f[0]==='string')return f[0];if(typeof f==='string')return f}
  if(d&&Array.isArray(d.sentences))return d.sentences.map(x=>x.trans||'').join('');
  throw new Error('unexpected');
}
async function trMyMemory(text,sl,tl){
  const m=c=>c==='yue'?'zh-HK':c;
  const d=JSON.parse(await getText('https://api.mymemory.translated.net/get?mt=1&q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(m(sl)+'|'+m(tl))));
  if(String(d.responseStatus)!=='200')throw new Error('mm');
  const mt=(d.matches||[]).find(x=>x&&(x['created-by']==='MT!'||/machine translation/i.test(x.reference||'')));
  if(!mt||!mt.translation||/MYMEMORY WARNING/i.test(mt.translation))throw new Error('mm');return mt.translation;
}
async function translate(text,sl,tl){
  let last;for(const f of[()=>trGoogle(text,sl,tl),()=>trGoogleAlt(text,sl,tl),()=>trMyMemory(text,sl,tl)]){
    try{const r=await f();if(r&&r.trim())return r.trim()}catch(e){last=e}}
  throw last||new Error('fail');
}

/* ================= live session (hands-free) ================= */
// Listens non-stop. Each sentence is recognized in both languages; the phone decides who spoke.
// While someone is still talking the text and its translation appear live; when they stop,
// the translation is read out (theirs into the earbuds, yours from the phone speaker).
const S={running:false,muted:false,tag:'',seq:0,errs:[],speakQ:[],speaking:null,draft:null,trBusy:false,trNext:null};
function now(){return Date.now()}
function renderStartHint(){
  const has=dev.devices&&dev.devices.length;
  $('#startHint').textContent=has?`不用按任何键：对方说${L(cfg.them).n}，你在耳机里听到翻译；你说${L(cfg.me).n}，手机读给对方`:'没检测到耳机：翻译会用手机喇叭读出来';
}
function renderDock(){
  const onTr=tab==='tr';
  $('#startWrap').style.display=onTr&&!S.running?'block':'none';
  $('#dock').classList.toggle('on',onTr&&S.running);
  const who=S.draft&&S.draft.who;
  $('#wave').classList.toggle('me',who==='me');
  $('#liveSt').textContent=!S.running?'':S.muted?'正在给对方朗读…':who==='me'?'你在说':who==='them'?'对方在说':'正在听';
  $('#talkTxt').textContent='免按键 · 自动识别双方';
}
function setLive(t){$('#livePt').textContent=t||''}
window.onAsrLevel=db=>{if(S.muted)db=-2;const v=Math.max(0,Math.min(1,(db+2)/11));document.querySelectorAll('#wave i').forEach((b,i)=>{const k=[.55,.85,1,.8,.6][i];b.style.height=(5+v*21*k*(0.75+Math.random()*.5))+'px'})};

function listen(){if(!S.running)return;S.muted=false;S.tag='c'+(++S.seq);A.listen(L(cfg.them).asr,L(cfg.me).asr,S.tag);renderDock()}
function mute(){S.muted=true;S.tag='';A.stopListen();setLive('');renderDock()}
function start(){
  if(!dev.mic){A.askPermissions();toast('请允许使用麦克风');return}
  S.running=true;S.errs=[];S.draft=null;A.session(true,cfg.duck);
  // like AirPods: switch the earbuds' noise mode for the conversation, put it back afterwards
  S.prevNoise=null;
  if(cfg.trNoise!=='keep'&&buds.status==='ok'&&buds.noise){S.prevNoise=buds.level||buds.noise;if(S.prevNoise!==cfg.trNoise&&buds.noise!==cfg.trNoise)A.budsNoise(cfg.trNoise);else S.prevNoise=null}
  if(cfg.earMic){const ok=A.earMic(true);if(!ok)toast('没找到耳机麦克风，改用手机麦克风')}
  buzz(25);listen();setLive('');
}
function stop(){
  S.running=false;S.muted=false;S.tag='';S.speakQ=[];S.speaking=null;S.draft=null;
  A.stopListen();A.stopSpeak();A.session(false,false);if(cfg.earMic)A.earMic(false);
  if(S.prevNoise&&buds.status==='ok'){A.budsNoise(S.prevNoise);S.prevNoise=null}
  setLive('');renderFeed();renderDock();buzz(15);
}
function restartListen(){if(S.running&&!S.muted){A.stopListen();setTimeout(listen,150)}}

const ERRNAME={'1':'网络超时','2':'网络错误','3':'麦克风被占用','9':'没有麦克风权限'};
window.onAsr=(type,text,tag)=>{
  if(!S.running)return;
  const m=/^(partial|final)_(them|me)$/.exec(type);
  if(m&&m[1]==='final'){finalText(m[2],text);return}   // a finished sentence always counts, even if we muted meanwhile
  if(tag!==S.tag)return;
  if(type==='begin'){setLive('…');return}
  if(type==='nothing'){if(S.draft){S.draft=null;renderFeed()}setLive('');renderDock();return}
  if(m){liveText(m[2],text);return}
  if(type==='error'){
    if(text==='9'){stop();toast('请允许使用麦克风');A.askPermissions();return}
    if(text==='3'){stop();toast('麦克风被别的 App 占用了，关掉它再试');return}
    const t=now();S.errs=S.errs.filter(x=>t-x<20000);S.errs.push(t);
    setLive('网络不稳定，继续在听…');
    if(S.errs.length>=6){stop();toast(`语音识别连不上（${ERRNAME[text]||'代码 '+text}），请检查网络后再试`,5000)}
  }
};

/* live text while someone is still talking */
function liveText(who,text){
  S.errs=[];
  if(!S.draft||S.draft.who!==who)S.draft={who,src:'',tr:''};
  S.draft.src=text;setLive(text);renderDraft();renderDock();liveTranslate();
}
async function liveTranslate(){
  const d=S.draft;if(!d)return;
  if(S.trBusy){S.trNext=true;return}
  S.trBusy=true;S.trNext=false;
  const who=d.who,src=d.src,from=who==='them'?cfg.them:cfg.me,to=who==='them'?cfg.me:cfg.them;
  try{const tr=await translate(src,from,to);if(S.draft&&S.draft.who===who&&S.draft.src.startsWith(src.slice(0,Math.min(4,src.length)))){S.draft.tr=tr;renderDraft()}}catch(e){}
  S.trBusy=false;if(S.trNext&&S.draft)liveTranslate();
}
function finalText(who,text){
  S.errs=[];
  const prev=S.draft&&S.draft.who===who?S.draft.tr:'';
  S.draft=null;setLive('');
  utterance(who,text,prev);
  // your words are read from the phone speaker: stop listening meanwhile, or we'd translate ourselves
  if(who==='me'&&cfg.spkMe)mute();
  else if(who==='them'&&cfg.spkThem&&!A.earbuds())mute();
  renderDock();
}

async function utterance(who,text,draftTr){
  const from=who==='them'?cfg.them:cfg.me,to=who==='them'?cfg.me:cfg.them;
  const e={id:'u'+now()+Math.random().toString(36).slice(2,6),who,src:text,tr:draftTr||'',from,to,st:'busy',t:now()};
  hist.push(e);renderFeed(true);
  try{e.tr=await translate(text,from,to);e.st='ok'}catch(err){e.st=e.tr?'ok':'fail'}
  saveHist();renderFeed();updateF2F();
  if(e.st!=='ok'||!S.running){if(S.muted&&!S.speaking)listen();return}
  if(who==='them'&&cfg.spkThem)enqueue({id:e.id,text:e.tr,lang:L(to).tts,route:'ear'});
  else if(who==='me'&&cfg.spkMe)enqueue({id:e.id,text:e.tr,lang:L(to).tts,route:'speaker'});
  else if(S.muted&&!S.speaking)listen();
}
function enqueue(item){S.speakQ.push(item);if(!S.speaking)nextSpeak()}
function nextSpeak(){
  const it=S.speakQ.shift();S.speaking=it||null;
  if(!it){if(S.muted&&S.running)setTimeout(()=>{if(S.muted&&!S.speaking)listen()},250);return}
  if(it.route==='speaker'&&!S.muted)mute();
  A.speak(it.id+'#'+now(),it.text,it.lang,it.route,cfg.rate);
}
window.onSpeak=(how,id)=>{
  const it=S.speaking;if(!it||!id.startsWith(it.id+'#'))return;S.speaking=null;
  if(how==='error')toast('朗读失败，可在“朗读语音”里安装语音包',3200);
  nextSpeak();
};
function replay(id){const e=hist.find(x=>x.id===id);if(!e||!e.tr)return;
  enqueue({id:e.id,text:e.tr,lang:L(e.to).tts,route:e.who==='me'?'speaker':'ear'})}
async function retry(id){const e=hist.find(x=>x.id===id);if(!e)return;e.st='busy';renderFeed();try{e.tr=await translate(e.src,e.from,e.to);e.st='ok'}catch(err){e.st='fail'}saveHist();renderFeed();updateF2F()}

function draftHTML(){const d=S.draft;if(!d)return'';
  return `<div class="msg draft ${d.who==='me'?'me':''}" id="draft"><div class="meta">${d.who==='me'?'我':'对方'} · 正在说…</div><div class="tr">${d.tr?esc(d.tr):'<div class="typing"><i></i><i></i><i></i></div>'}</div><div class="src">${esc(d.src)}<span class="cursor"></span></div></div>`}
function renderDraft(){const el=$('#draft');if(el&&S.draft&&el.classList.contains('me')===(S.draft.who==='me')){el.outerHTML=draftHTML();const p=$('#pg-tr');p.scrollTop=p.scrollHeight}else renderFeed(true)}
function renderFeed(scroll){
  const f=$('#feed');
  if(!hist.length&&!S.draft){f.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h8M8 3v2M10 5c-.6 3.5-3 6-6 7.5M6 8.5c1.2 1.8 3 3.2 5 4"/><path d="M13 21l4-10 4 10M14.5 17.5h5"/></svg><br>点下面的按钮开始。<br>你和对方直接轮流说话，<br>App 会自动听出谁在说，边说边翻译。</div>`;return}
  const p=$('#pg-tr'),atBottom=p.scrollHeight-p.scrollTop-p.clientHeight<140;
  f.innerHTML=hist.slice(-80).map(e=>{
    const who=e.who==='me'?'我':'对方';
    const body=e.st==='busy'?(e.tr?`<div class="tr">${esc(e.tr)}</div>`:`<div class="typing"><i></i><i></i><i></i></div>`):e.st==='fail'?`<div class="fail" data-retry="${e.id}">翻译失败 · 点此重试</div>`:`<div class="tr">${esc(e.tr)}</div>`;
    return `<div class="msg ${e.who==='me'?'me':''}"><div class="meta">${who} · ${esc(L(e.from).n)} → ${esc(L(e.to).n)}${e.st==='ok'?`<button class="play" data-play="${e.id}">${ICON_SPK}</button>`:''}</div>${body}<div class="src">${esc(e.src)}</div></div>`}).join('')+draftHTML();
  f.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>replay(b.dataset.play));
  f.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>retry(b.dataset.retry));
  if(scroll||atBottom)requestAnimationFrame(()=>p.scrollTop=p.scrollHeight);
}

/* ================= face to face ================= */
function updateF2F(){
  const t=L(cfg.them),m=L(cfg.me);
  const lastMe=[...hist].reverse().find(e=>e.who==='me'&&e.st==='ok'),lastThem=[...hist].reverse().find(e=>e.who==='them'&&e.st==='ok');
  $('#fTopL').textContent=t.o;
  $('#fTopT').textContent=lastMe?lastMe.tr:'👋';$('#fTopS').textContent=lastMe?lastMe.src:'';
  $('#fBotL').textContent=m.n;
  $('#fBotT').textContent=lastThem?lastThem.tr:'对方说的话会显示在这里';$('#fBotS').textContent=lastThem?lastThem.src:'';
}
function openF2F(){updateF2F();$('#f2f').classList.add('on');if(!S.running)start()}
$('#f2fBtn').onclick=openF2F;$('#f2fBtn2').onclick=openF2F;
$('#f2fClose').onclick=()=>$('#f2f').classList.remove('on');

$('#startBtn').onclick=start;$('#stopBtn').onclick=stop;

window.onAndroidBack=()=>{
  if($('#sheet').classList.contains('on')){closeSheet();return true}
  if($('#f2f').classList.contains('on')){$('#f2f').classList.remove('on');return true}
  if(tab!=='buds'&&!S.running){setTab('buds');return true}
  return false;
};

/* ================= init ================= */
try{dev=JSON.parse(A.devices())}catch(e){}
renderBuds();renderLangs();renderFeed();renderStartHint();checkAsr();renderDock();
if(location.hash==='#tr')setTab('tr');
</script>
