<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 编辑器</title>
<style>
/* VOICE: 安静、利落的实用工具
   IDEA: 摊在石墨色工作台上的一张纸，红笔随手批注
   PICTURE: 正在编辑的页面本身，占满主区域
   COLOUR and TYPE: 白纸、石墨台面、PDF 红点缀；系统中文黑体
   LAYOUT: 顶栏+工具条+选项行，页面居中；页面管理在桌面为侧栏、手机为底部抽屉 */
:root{color-scheme:light dark;--bg:light-dark(#f6f5f3,#17181b);--desk:light-dark(#d9d7d3,#0c0d0f);--panel:light-dark(#fff,#202125);--ink:light-dark(#1b1c1f,#ecebe8);--mute:light-dark(#66676c,#9d9ea4);--line:light-dark(#e3e1dd,#303238);--red:#e0322b;--red2:light-dark(#fdeceb,#3b1d1c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
svg{flex:none}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px}
.fname{flex:1;overflow:hidden;line-height:1.25}
.fname b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname span{font-size:13px;color:var(--mute)}
.btn{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.bar{display:flex;gap:4px;padding:6px 8px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.tool{flex:none;width:56px;height:54px;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;cursor:pointer;color:var(--mute)}
.tool svg{width:22px;height:22px}
.tool.on{background:var(--red2);color:var(--red);font-weight:600}
.tool:disabled{opacity:.35;cursor:default}
.sep{flex:none;width:1px;background:var(--line);margin:8px 4px}
.opts{display:flex;align-items:center;gap:10px 14px;padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--line);min-height:50px;flex-wrap:wrap}
.sws{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.2);cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--ink);outline-offset:2px}
.opts label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);white-space:nowrap}
input[type=range]{width:110px;accent-color:var(--red)}input[type=checkbox]{width:20px;height:20px;accent-color:var(--red);margin:0}
.hint{font-size:13px;color:var(--mute)}
main{flex:1;display:flex;overflow:hidden;position:relative}
#stagewrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
#stage{flex:1;overflow:auto;background:var(--desk);padding:16px}
#sheet{position:relative;margin:0 auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25),0 14px 34px rgba(0,0,0,.22)}
#pgc,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
#stage.drop{outline:3px dashed var(--red);outline-offset:-10px}
.nav{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
.nav .btn{min-height:40px;padding:0 10px}
.nav .grow{flex:1}
#pn,#zl{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px;min-width:54px;text-align:center}
#side{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;order:-1}
.sh{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.sh b{font-size:16px}.sh span{color:var(--mute);font-size:13px;flex:1}
.x{border:0;background:transparent;width:40px;height:40px;font-size:24px;cursor:pointer;display:none}
.pact{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px 10px 8px;border-bottom:1px solid var(--line)}
.pact button{border:0;background:transparent;border-radius:8px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mute);cursor:pointer}
.pact button:hover{background:var(--red2);color:var(--red)}
.pact svg{width:19px;height:19px}
#list{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start}
.th{border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--mute)}
.th canvas{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:3px}
.th.on canvas{outline:3px solid var(--red);outline-offset:1px}
.th.on{color:var(--red);font-weight:600}
.sf{display:grid;gap:6px;padding:10px;border-top:1px solid var(--line)}
.sf .btn{font-size:14px}
#scrim{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal[hidden]{display:none}
.card{background:var(--panel);border-radius:16px;padding:18px;width:min(460px,100%);display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.card h3{margin:0;font-size:18px}
.card textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}
#sp{width:100%;height:210px;background:#fff;border:1px dashed #b9b7b2;border-radius:10px;touch-action:none;display:block}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:30;color:#fff;font-size:16px}
#busy[hidden]{display:none}
#busy div{background:rgba(20,20,22,.9);padding:16px 22px;border-radius:12px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#1b1c1f;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){#toast,#side{transition:none!important}}
.only-m{display:none}
@media(max-width:900px){
 .only-m{display:inline-flex}
 #side{position:fixed;left:0;right:0;bottom:0;height:68vh;width:auto;border:0;border-radius:18px 18px 0 0;z-index:15;transform:translateY(105%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
 #side.open{transform:none}
 #scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:14}
 .x{display:block}
 #list{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
 .sf{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:600px){
 header{padding:8px 10px;gap:8px}
 header .btn{padding:0 11px}
 .hide-s{display:none}
 #stage{padding:10px}
}
</style></head><body>
<header>
 <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><path d="M8 3h13l7 7v19a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="#e0322b"/><path d="M21 3v5a2 2 0 0 0 2 2h5z" fill="#f59b96"/><path d="M11 24l2-6 8-8 3 3-8 8z" fill="#fff"/><path d="M11 27h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
 <div class="fname"><b id="fn">正在加载…</b><span id="fi">PDF 编辑器</span></div>
 <button class="btn" id="openBtn" aria-label="打开 PDF"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>打开</span></button>
 <button class="btn pri" id="expBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>导出</span></button>
</header>
<nav class="bar" id="tools" aria-label="工具"></nav>
<div class="opts" id="opts"></div>
<main>
 <div id="stagewrap">
  <div id="stage"><div id="sheet"><canvas id="pgc"></canvas><canvas id="ov"></canvas></div></div>
  <div class="nav">
   <button class="btn only-m" id="sideBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="9" rx="1"/><rect x="13" y="4" width="7" height="9" rx="1"/><path d="M4 18h16"/></svg>页面</button>
   <span class="grow"></span>
   <button class="btn" id="prev" aria-label="上一页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 6l-6 6 6 6"/></svg></button>
   <span id="pn">1 / 1</span>
   <button class="btn" id="next" aria-label="下一页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg></button>
   <span class="grow"></span>
   <button class="btn" id="zout" aria-label="缩小">−</button>
   <span id="zl" class="hide-s">100%</span>
   <button class="btn" id="zin" aria-label="放大">+</button>
  </div>
 </div>
 <aside id="side" aria-label="页面管理">
  <div class="sh"><b>页面</b><span id="pc"></span><button class="x" id="closeSide" aria-label="关闭">×</button></div>
  <div class="pact" id="pact"></div>
  <div id="list"></div>
  <div class="sf">
   <button class="btn" id="addBlank">＋ 空白页</button>
   <button class="btn" id="mergeBtn">合并 PDF</button>
   <button class="btn" id="imgPageBtn">图片转页</button>
  </div>
 </aside>
 <div id="scrim"></div>
</main>

<div class="modal" id="tm" hidden><div class="card" role="dialog" aria-label="添加文字">
 <h3 id="tmh">添加文字</h3>
 <textarea id="tt" rows="3" placeholder="输入要添加的文字，可换行"></textarea>
 <div class="row"><label>字号 <input type="range" id="tsz" min="4" max="72"></label><span id="tszv" class="hint"></span><button class="btn" id="tbold" aria-pressed="false"><b>B</b> 加粗</button></div>
 <div class="row sws" id="tcol"></div>
 <div class="row end"><button class="btn" data-close>取消</button><button class="btn pri" id="tok">确定</button></div>
</div></div>

<div class="modal" id="sm" hidden><div class="card" role="dialog" aria-label="手写签名">
 <h3>手写签名</h3>
 <canvas id="sp"></canvas>
 <div class="row"><div class="sws" id="scol"></div><span class="hint">在框内用手指或鼠标签名</span></div>
 <div class="row end"><button class="btn" id="sclear">清除</button><button class="btn" data-close>取消</button><button class="btn pri" id="sok">使用签名</button></div>
</div></div>

<div id="busy" hidden><div id="busyt">处理中…</div></div>
<div id="toast" role="status"></div>
<input type="file" id="fPdf" accept="application/pdf,.pdf" hidden>
<input type="file" id="fMerge" accept="application/pdf,.pdf" hidden multiple>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fImgPage" accept="image/*" hidden multiple>

<script src="lib/pdf.min.js"></script>
<script src="lib/pdf.worker.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/fontkit.umd.min.js"></script>
<script>
{
const $=s=>document.querySelector(s);
const FONT='-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei","Hiragino Sans GB",sans-serif';
const I=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON={
 pan:'<path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v7c0 4.5-2.5 8-7 8-3 0-4.5-1.5-6-4l-1.5-3a1.5 1.5 0 0 1 2.6-1.5L8 14"/>',
 sel:'<path d="M5 3l13 7.5-5.5 1.5L10 18z"/><path d="M13 13l5 5"/>',
 edit:'<path d="M3 6V4h11v2M8.5 4v13M6 17h5"/><path d="M13 20l.6-2.6L19.5 11.5l2 2-5.9 5.9z"/>',
 pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',
 hl:'<path d="M9 14l-3 3v2h4l2-2"/><path d="M9 14l7-7 3 3-7 7z"/><path d="M14 21h6"/>',
 text:'<path d="M5 7V4h14v3M12 4v16M9 20h6"/>',
 rect:'<rect x="4" y="6" width="16" height="12" rx="1"/>',
 wo:'<path d="M5 20h14"/><path d="M7 15l7-10 5 4-7 8H8z"/>',
 img:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',
 sign:'<path d="M3 16c3-7 5-10 6.5-10 2.5 0-1.5 10 1 10 1.5 0 2.5-3.5 4-3.5s1 2.5 2.5 2.5c1 0 1.5-.5 2-1"/><path d="M3 20h18"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
 redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
 rot:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
 up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
 dn:'<path d="M12 5v14M6 13l6 6 6-6"/>',
 dup:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
 del:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/>'
};
const TOOLS=[['pan','浏览'],['edit','改原文'],['sel','选择'],['pen','画笔'],['hl','荧光笔'],['text','文字'],['rect','方框'],['wo','涂白'],['img','图片'],['sign','签名']];
const COLORS=['#1b1c1f','#e0322b','#1f5fd6','#178a4a','#8a3fd1'];
const HLC=['#ffd400','#7ee07e','#ff8fc8','#7cc8ff'];
const st={docs:[],pages:[],cur:0,zoom:1,tool:'pan',color:'#e0322b',hlc:'#ffd400',size:{pen:3,hl:16,rect:3,text:16},bold:false,sel:null,name:'',purge:true,lines:[]};
const undo=[],redo=[];
let uidN=0;const uid=()=>'p'+(++uidN);
const pgc=$('#pgc'),ov=$('#ov'),oc=ov.getContext('2d'),sheet=$('#sheet'),stage=$('#stage');
const TW=170;

/* ---------- 通用 ---------- */
let tt=0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}
function busy(m){$('#busy').hidden=!m;if(m)$('#busyt').textContent=m}
const cp=()=>st.pages[st.cur];
function dims(p){const R=((p.base+p.rot)%360+360)%360;return R%180?{W:p.h,H:p.w,R}:{W:p.w,H:p.h,R}}
const cloneA=a=>({...a,pts:a.pts&&a.pts.map(q=>q.slice())});
const cloneP=(p,nid)=>({...p,id:nid?uid():p.id,anns:p.anns.map(cloneA)});
const clonePages=()=>st.pages.map(p=>cloneP(p));
function snap(){undo.push(clonePages());if(undo.length>60)undo.shift();redo.length=0;updUndo()}
function updUndo(){$('#t-undo').disabled=!undo.length;$('#t-redo').disabled=!redo.length}
function restore(from,to){if(!from.length)return;to.push(clonePages());st.pages=from.pop();st.sel=null;st.cur=Math.min(st.cur,st.pages.length-1);refresh();updUndo()}
const fileBytes=f=>f.arrayBuffer().then(b=>new Uint8Array(b));
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
async function fileToCanvas(f,max=2200){const u=URL.createObjectURL(f);try{const i=await loadImg(u);const k=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c}finally{URL.revokeObjectURL(u)}}

/* ---------- 载入 PDF ---------- */
async function loadPdf(bytes){
 const doc=await pdfjsLib.getDocument({data:bytes.slice(),isEvalSupported:false}).promise;
 const d=st.docs.push({bytes,doc})-1,out=[];
 for(let i=0;i<doc.numPages;i++){const pg=await doc.getPage(i+1);const[x1,y1,x2,y2]=pg.view;out.push({id:uid(),d,i,w:x2-x1,h:y2-y1,base:pg.rotate||0,rot:0,anns:[]})}
 return out;
}
function pdfErr(e){return e&&e.name==='PasswordException'?'这个 PDF 有密码保护，暂时无法打开':'无法读取这个文件，请确认是有效的 PDF'}
async function openFile(f){busy('正在打开…');try{await openBytes(await fileBytes(f),f.name)}catch(e){toast(pdfErr(e))}finally{busy()}}
async function openBytes(b,name){
 const pages=await loadPdf(b);st.docs=[st.docs[st.docs.length-1]];pages.forEach(p=>p.d=0);cache.clear();lineCache.clear();
 st.pages=pages;st.cur=0;st.sel=null;st.name=name;st.sample=false;undo.length=0;redo.length=0;updUndo();refresh();setTool('pan');toast('已打开 '+name);
}
window.__openPending=async()=>{
 const B=window.AndroidBridge;if(!B)return;const b64=B.pendingB64();if(!b64)return;busy('正在打开…');
 try{const s=atob(b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);await openBytes(u,B.pendingName()||'文档.pdf')}catch(e){toast(pdfErr(e))}finally{busy()}
};
/* ---------- 渲染 ---------- */
const cache=new Map();
async function base(p,cssW){
 const{W,H,R}=dims(p),dpr=Math.min(devicePixelRatio||1,2.5),s=cssW/W;
 const key=[p.d,p.i,R,Math.round(cssW),dpr].join(':');
 if(p.d>=0&&cache.has(key))return cache.get(key);
 const c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*s*dpr));c.height=Math.max(1,Math.round(H*s*dpr));
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
 if(p.d>=0){const pg=await st.docs[p.d].doc.getPage(p.i+1);await pg.render({canvasContext:x,viewport:pg.getViewport({scale:s*dpr,rotation:R})}).promise;cache.set(key,c);if(cache.size>40)cache.delete(cache.keys().next().value)}
 return c;
}
function drawAnn(x,a,W,H){
 x.save();
 if(a.t==='pen'||a.t==='hl'){
  x.globalAlpha=a.t==='hl'?.4:1;x.strokeStyle=a.c;x.lineWidth=Math.max(.5,a.s*W);x.lineCap=a.t==='hl'?'square':'round';x.lineJoin='round';x.beginPath();
  a.pts.forEach(([u,v],k)=>k?x.lineTo(u*W,v*H):x.moveTo(u*W,v*H));if(a.pts.length===1)x.lineTo(a.pts[0][0]*W+.1,a.pts[0][1]*H);x.stroke();
 }else if(a.t==='rect'){x.strokeStyle=a.c;x.lineWidth=Math.max(.5,a.s*W);x.strokeRect(a.x*W,a.y*H,a.w*W,a.h*H)}
 else if(a.t==='wo'){x.fillStyle='#fff';x.fillRect(a.x*W,a.y*H,a.w*W,a.h*H)}
 else if(a.t==='text'){
  const fs=a.s*W,L=a.text.split('\n');x.font=`${a.b?'700 ':''}${fs}px ${FONT}`;x.fillStyle=a.c;x.textBaseline='top';let mw=0;
  L.forEach((l,k)=>{x.fillText(l,a.x*W,a.y*H+k*fs*1.3);mw=Math.max(mw,x.measureText(l).width)});a.w=mw/W;a.h=L.length*fs*1.3/H;
 }else if(a.t==='img'){x.drawImage(a.el,a.x*W,a.y*H,a.w*W,a.h*H)}
 else if(a.t==='te'){
  const fs=a.s*W,L=a.text?a.text.split('\n'):[],lh=fs*1.3;x.font=`${a.b?'700 ':''}${fs}px ${FONT}`;

function rotAnn(a,W,H){
 const f=W/H,R=(u,v)=>[1-v,u];
 if(a.pts){a.pts=a.pts.map(([u,v])=>R(u,v));a.s*=f;return}
 if(a.t==='rect'||a.t==='wo'){[a.x,a.y,a.w,a.h]=[1-(a.y+a.h),a.x,a.h,a.w];a.s*=f;return}
 if(a.t==='te'){[a.cx,a.cy,a.cw,a.ch]=[1-(a.cy+a.ch),a.cx,a.ch,a.cw];a.asc=a.s*.92;a.s*=f;a.lk='';return}
 const[cx,cy]=R(a.x+a.w/2,a.y+a.h/2),nw=a.w*f,nh=a.h/f;a.x=cx-nw/2;a.y=cy-nh/2;a.w=nw;a.h=nh;if(a.t==='text')a.s*=f;
}

/* ---------- 导出 ---------- */
async function blobBuf(c){const b=await new Promise(r=>c.toBlob(r,'image/png'));return new Uint8Array(await b.arrayBuffer())}
async function exportPdf(){
 busy('正在生成 PDF…');
 try{
  const{PDFDocument,degrees}=PDFLib,out=await PDFDocument.create(),need=new Map(),emb={};
  st.pages.forEach(p=>{if(p.d>=0){if(!need.has(p.d))need.set(p.d,new Set());need.get(p.d).add(p.i)}});
  for(const[d,set]of need){const src=await PDFDocument.load(st.docs[d].bytes,{ignoreEncryption:true}),idx=[...set],e=await out.embedPdf(src,idx);idx.forEach((i,k)=>emb[d+':'+i]=e[k])}
  for(const p of st.pages){
   const R=((p.base+p.rot)%360+360)%360,e=p.d>=0?emb[p.d+':'+p.i]:null,w=e?e.width:p.w,h=e?e.height:p.h;
   const sw=R%180?h:w,sh=R%180?w:h,pg=out.addPage([sw,sh]);
   if(e&&st.purge&&p.anns.some(a=>a.t==='te')){
    const src=await st.docs[p.d].doc.getPage(p.i+1),v1=src.getViewport({scale:1,rotation:R}),S=Math.min(3,Math.sqrt(20e6/(v1.width*v1.height)));
    const c=document.createElement('canvas'),vp=src.getViewport({scale:S,rotation:R});c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await src.render({canvasContext:x,viewport:vp}).promise;
    p.anns.forEach(a=>drawAnn(x,a,c.width,c.height));
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.93));pg.drawImage(await out.embedJpg(new Uint8Array(await b.arrayBuffer())),{x:0,y:0,width:sw,height:sh});
    continue;
   }
   if(e){const T={0:[0,0,0],90:[0,w,-90],180:[w,h,180],270:[h,0,90]}[R];pg.drawPage(e,{x:T[0],y:T[1],rotate:degrees(T[2])})}
   if(p.anns.length){
    const S=Math.min(3,Math.sqrt(16e6/(sw*sh))),c=document.createElement('canvas');c.width=Math.round(sw*S);c.height=Math.round(sh*S);
    const x=c.getContext('2d');p.anns.forEach(a=>drawAnn(x,a,c.width,c.height));
    pg.drawImage(await out.embedPng(await blobBuf(c)),{x:0,y:0,width:sw,height:sh});
   }
  }
  const bytes=await out.save();busy();
  await saveFile(st.name.replace(/\.pdf$/i,'')+'-已编辑.pdf',new Blob([bytes],{type:'application/pdf'}));
 }catch(err){busy();toast('导出失败：'+(err&&err.message||err))}
}
async function saveFile(fn,blob){
 if(window.AndroidBridge){const u=new Uint8Array(await blob.arrayBuffer());let t='';for(let i=0;i<u.length;i+=32768)t+=String.fromCharCode.apply(null,u.subarray(i,i+32768));toast(window.AndroidBridge.saveFile(fn,btoa(t)));return}
 let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch{}
 if(dl){try{await dl.save({filename:fn,data:blob});toast('已保存 '+fn)}catch(err){const c=err&&err.code;toast(c==='declined'?'已取消保存':c==='rate_limited'?'请稍后再试':'保存失败，请在浏览器中打开本页再导出')}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('已下载 '+fn);
}
