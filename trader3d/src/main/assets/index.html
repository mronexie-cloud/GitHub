<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天才交易员 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe8ff;font:14px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#243}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.up{color:#e5352b}.down{color:#12a05c}.dim{color:#7a8794}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none;z-index:3}
.chip{background:rgba(40,48,60,.82);color:#fff;border-radius:8px;padding:4px 8px;font-weight:700;font-size:13px;line-height:1.2;box-shadow:0 2px 0 rgba(0,0,0,.25);pointer-events:auto}
.chip small{display:block;font-size:10px;font-weight:400;opacity:.8}
.chip.red{background:#d9382c}.chip.green{background:#1f9d57}.chip.gold{background:#e09a12}.chip.blue{background:#2f7fd6}
#bars{position:fixed;top:54px;left:8px;z-index:3;pointer-events:none;width:118px}
.mb{display:flex;align-items:center;gap:4px;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;margin-bottom:3px}
.mb i{flex:1;height:6px;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden;display:block}
.mb i b{display:block;height:100%;border-radius:4px}
#pnl{position:fixed;top:54px;right:8px;z-index:3;text-align:right;font-weight:800;font-size:15px;text-shadow:0 1px 0 #fff,0 0 6px #fff;pointer-events:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2}
.lab{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2px solid #243;border-radius:14px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:auto;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.lab.ring{background:#d9382c;color:#fff;border-color:#fff;animation:shake .4s infinite}
@keyframes shake{25%{margin-left:-3px}75%{margin-left:3px}}
#joy{position:fixed;left:26px;bottom:34px;width:120px;height:120px;border-radius:50%;background:rgba(40,48,60,.28);border:2px solid rgba(255,255,255,.6);z-index:2;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(40,48,60,.7);border:2px solid #fff}
#hand{position:fixed;right:26px;bottom:44px;width:92px;height:92px;border-radius:50%;border:3px solid #fff;background:rgba(70,60,45,.85);color:#fff;font-size:34px;z-index:4;display:none;line-height:1;padding:0}
#hand small{display:block;font-size:11px;font-weight:700;margin-top:2px}
#hand:active{transform:scale(.94)}
#side{position:fixed;right:8px;top:92px;z-index:3;display:flex;flex-direction:column;gap:6px}
.rb{width:40px;height:40px;border-radius:50%;border:2px solid #fff;background:rgba(40,48,60,.8);color:#fff;font-size:18px;padding:0}
#toast{position:fixed;left:50%;top:112px;transform:translateX(-50%);background:rgba(30,36,46,.92);color:#fff;padding:8px 14px;border-radius:12px;font-size:13px;z-index:8;max-width:86%;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#flash{position:fixed;inset:0;background:#d9382c;opacity:0;pointer-events:none;z-index:7;transition:opacity .5s}
#modal{position:fixed;inset:0;z-index:6;display:none;align-items:flex-end;justify-content:center;background:rgba(20,26,36,.45)}
.sheet{background:#fffdf6;border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:84vh;overflow:auto;padding:14px 14px 20px;border-top:4px solid #243;animation:up .2s}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.sheet h3{margin:0 0 6px;font-size:18px}.sheet p{margin:6px 0}
.btn{border:2px solid #243;background:#fff;border-radius:11px;padding:8px 10px;font-size:14px;font-weight:700;color:#243;box-shadow:0 3px 0 #243}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #243}.btn:disabled{opacity:.4}
.btn.pri{background:#ffc93c}.btn.long{background:#ffe1de;color:#d9382c;border-color:#d9382c;box-shadow:0 3px 0 #d9382c}.btn.short{background:#dcf5e7;color:#12a05c;border-color:#12a05c;box-shadow:0 3px 0 #12a05c}
.btn.sm{padding:5px 9px;font-size:12px}.btn.on{background:#243;color:#fff}
.choice{display:block;width:100%;text-align:left;margin-top:9px;padding:10px 12px}
.choice small{display:block;font-weight:400;color:#7a8794;font-size:12px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.as{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid #e6dfcc}
.as .nm{width:74px;font-weight:700}.as .pr{width:78px;text-align:right;font-variant-numeric:tabular-nums}
.sig{font-size:10px;padding:1px 5px;border-radius:5px;background:#f1ead6}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 9px}
.upg{border:2px solid #243;border-radius:12px;padding:8px 10px;margin-top:8px;display:flex;align-items:center;gap:8px;background:#fff}
.upg.own{background:#e9f8ee;border-color:#12a05c}
table.rep{width:100%;border-collapse:collapse}table.rep td{padding:4px 2px;border-bottom:1px solid #e6dfcc}table.rep td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.attr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.attr div{background:#f3ecd8;border-radius:8px;padding:6px;text-align:center}.attr b{display:block;font-size:17px}
.tag{display:inline-block;border:2px solid #243;border-radius:20px;padding:1px 8px;font-size:12px;font-weight:700;margin:2px 4px 2px 0;background:#ffc93c}
.big{font-size:46px;text-align:center}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="hud"></div><div id="bars"></div><div id="pnl"></div>
<div id="side"><button class="rb" onclick="openStatus()">👤</button><button class="rb" id="sndBtn" onclick="toggleSnd()">🔊</button><button class="rb" id="bgmBtn" onclick="toggleBgm()">🎵</button></div>
<div id="joy"><div id="knob"></div></div>
<button id="hand" onclick="interact()"></button>
<div id="toast"></div><div id="flash"></div>
<div id="modal"></div>
<script>
'use strict';
// ============ 工具 ============
const R=Math.random,ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function gauss(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function money(v){const s=v<0?'-':'';v=Math.abs(v);if(v>=1e8)return s+(v/1e8).toFixed(2)+'亿';if(v>=1e4)return s+(v/1e4).toFixed(v>=1e6?0:1)+'万';return s+Math.round(v)}
const pct=(v,d=1)=>(v>=0?'+':'')+(v*100).toFixed(d)+'%',cls=v=>v>0?'up':v<0?'down':'dim';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ============ 数据 ============
const SUR='王李张刘陈杨黄赵吴周徐孙马朱胡郭何林罗高郑梁谢宋唐许韩冯邓曹'.split('');
const MN='浩然 子轩 宇航 俊杰 志强 明哲 一鸣 天佑 博文 嘉豪'.split(' '),FN='梓涵 欣怡 诗琪 雨桐 思颖 佳怡 若曦 可馨 婉清 语嫣'.split(' ');
const CITIES=[['上海',1.4],['北京',1.4],['深圳',1.35],['杭州',1.15],['广州',1.15],['成都',.95],['武汉',.95],['重庆',.85],['西安',.85]];
const BGS={寒门:[5e4,3],工薪:[15e4,4],中产:[5e5,2.4],富二代:[3e6,.6]};
const TRAITS={数学天才:'研究更准',钢铁心态:'压力增长减少四成',赌徒血统:'杠杆上限+2，容易上头',天选之子:'运气好，常有意外之财',夜猫子:'每天精力+20',玻璃心:'压力增长多四成',身体倍儿棒:'健康下降减半',社交达人:'陪家人效果翻倍'};
const ASSETS={idx:{n:'沪深300',p:4000,sd:3,mu:{bull:1.5,range:0,bear:-1.5,crash:-7}},tech:{n:'科技股',p:100,sd:5,mu:{bull:2.5,range:0,bear:-2.5,crash:-10}},
 gold:{n:'黄金',p:600,sd:2,mu:{bull:.3,range:.2,bear:.6,crash:2.5}},oil:{n:'原油',p:80,sd:5,mu:{bull:1,range:0,bear:-1.5,crash:-8}},btc:{n:'比特币',p:60000,sd:9,mu:{bull:5,range:0,bear:-5,crash:-14}}};
const AK=Object.keys(ASSETS),REG={bull:'牛市',range:'震荡',bear:'熊市',crash:'股灾'};
const TRANS={bull:{bull:.7,range:.2,bear:.08,crash:.02},range:{bull:.25,range:.5,bear:.2,crash:.05},bear:{bull:.12,range:.33,bear:.45,crash:.1},crash:{bull:.15,range:.3,bear:.45,crash:.1}};
const NEWS={bull:['央行意外降息，情绪升温','外资持续流入','经济数据超预期'],range:['市场缺乏方向','消息面清淡','多空分歧加大'],bear:['资金外流加剧','企业盈利下滑','避险情绪升温'],crash:['大型机构传出流动性危机','杠杆资金集中平仓','地缘冲突突然升级']};
const UPG=[
 {id:'chair',n:'人体工学椅',ic:'🪑',c:2e4,lv:1,d:'压力增长 -30%'},
 {id:'screen',n:'多屏工作站',ic:'🖥️',c:8e4,lv:2,d:'杠杆上限提到 5×'},
 {id:'coffee',n:'专业咖啡机',ic:'☕',c:5e4,lv:2,d:'咖啡精力+40，不再伤身'},
 {id:'term',n:'专业行情终端',ic:'📡',c:4e5,lv:4,d:'研究更准，杠杆上限 10×'},
 {id:'stop',n:'智能止损系统',ic:'🛡️',c:15e5,lv:6,d:'亏到本金80%自动平仓，不再爆仓'},
 {id:'asst',n:'聘请助理',ic:'🧑‍💼',c:3e6,lv:7,d:'每天收盘后自动研究2个品种，日开销+2万'},
 {id:'fund',n:'成立私募基金',ic:'🏦',c:1e7,lv:9,d:'管理5000万外部资金，赚管理费和业绩提成'}];
const TITLES=[[1e9,'交易传奇'],[1e8,'对冲基金大佬'],[1e7,'私募大佬'],[1e6,'职业交易员'],[0,'散户']];
// ============ 状态 ============
let G=null,M=null,draft=null;
function genChar(){const gender=R()<.5?'男':'女',city=pick(CITIES);const bl=Object.keys(BGS);let tw=bl.reduce((s,k)=>s+BGS[k][1],0),x=R()*tw,bg=bl[0];for(const k of bl){x-=BGS[k][1];if(x<0){bg=k;break}}
  const tk=Object.keys(TRAITS),tr=[];while(tr.length<2){const t=pick(tk);if(tr.includes(t)||(tr[0]==='钢铁心态'&&t==='玻璃心')||(tr[0]==='玻璃心'&&t==='钢铁心态'))continue;tr.push(t)}
  return{name:pick(SUR)+pick(gender==='男'?MN:FN),gender,city:city[0],mul:city[1],bg,cash:BGS[bg][0],age:ri(22,26),int:ri(35,85),luck:ri(30,80),body:ri(40,90),traits:tr}}
const hasT=t=>G.traits.includes(t),own=id=>!!G.up[id];
function newGame(c){G={...c,day:1,t:510,nextTick:516,energy:100,health:Math.round(55+c.body*.4),stress:15,family:60,comply:80,lvl:1,xp:0,up:{},pos:[],prices:{},open:{},hist:{},sig:{},trend:{},regime:pick(['bull','range','range','bear']),news:'',
  coffee:0,calls:0,ring:0,ringEv:null,flow:0,startNw:c.cash,flags:{},aum:0,peak:c.cash,view:'idx',life:[],over:null,closed:false,rent:1};
  AK.forEach(k=>{G.prices[k]=ASSETS[k].p*(.85+R()*.3);G.open[k]=G.prices[k];G.hist[k]=[G.prices[k]]});
  rollTrend(false);G.energy=maxEnergy();life(`${G.age}岁，在${G.city}租下一间小交易室，带着${money(G.cash)}开始全职交易`);buildWorld();save()}
function life(t){G.life.push(`第${G.day}天：${t}`)}
function posVal(p){return p.margin*(1+p.lev*p.dir*(G.prices[p.k]/p.entry-1))}
function posTotal(){return G.pos.reduce((s,p)=>s+Math.max(0,posVal(p)),0)}
function posPL(){return G.pos.reduce((s,p)=>s+Math.max(0,posVal(p))-p.margin,0)}
function nw(){return G.cash+posTotal()}
function levCap(){return (own('term')?10:own('screen')?5:3)+(hasT('赌徒血统')?2:0)}
function maxEnergy(){return 100+(hasT('夜猫子')?20:0)}
function acc(){return clamp(.63+(G.int-50)/250+(hasT('数学天才')?.05:0)+(own('term')?.08:0),.5,.85)}
function stressMul(){return (hasT('钢铁心态')?.6:hasT('玻璃心')?1.4:1)*(own('chair')?.7:1)}
function addStress(v){G.stress=clamp(G.stress+(v>0?v*stressMul():v),0,100)}
function pay(v){G.cash+=v;G.flow+=v}
function income(){return 1e4}function cost(){return Math.round(7e3*G.mul*G.rent+(own('asst')?2e4:0)+(own('fund')?5e4:0))}
function title(){const n=nw();return TITLES.find(t=>n>=t[0])[1]}
function marketOpen(){return G.t>=570&&G.t<900}
function rollTrend(next){if(next){const t=TRANS[G.regime];let x=R();for(const k in t){x-=t[k];if(x<0){G.nextReg=k;break}}}else G.nextReg=G.regime;
  AK.forEach(k=>G.trend[k]=(ASSETS[k].mu[G.nextReg]+ASSETS[k].sd*.8*gauss())/100);G.sig={};G.news=pick(NEWS[R()<.6?G.nextReg:pick(Object.keys(REG))]);
  if(own('asst')){research(true);research(true)}}
function research(silent){const left=AK.filter(k=>!G.sig[k]);if(!left.length)return null;const k=pick(left),p=acc(),truth=Math.sign(G.trend[k])||1;
  G.sig[k]={dir:R()<p?truth:-truth,conf:clamp(p+(R()-.5)*.06,.5,.95)};return k}
// ============ 时间 & 行情 ============
function addTime(m){if(!G||G.over)return;G.t+=m;let guard=0;while(G.nextTick<=G.t&&guard++<400&&!G.over){tick(G.nextTick);G.nextTick+=6}}
function tick(t){
  if(t===570){sfx('bell');toast('🔔 开盘了！'+REG[G.regime]+'行情')}
  if(t>=570&&t<900){AK.forEach(k=>{const A=ASSETS[k];G.prices[k]*=1+G.trend[k]/55+A.sd*.6/100/7.4*gauss();G.hist[k].push(G.prices[k]);if(G.hist[k].length>40)G.hist[k].shift()});
    if(G.day>2&&R()<.0008)swan();
    checkLiq();const ex=G.pos.reduce((s,p)=>s+p.margin*p.lev,0)/Math.max(nw(),1);if(ex>1)addStress(Math.min(ex,8)*.04);updDesk()}
  if(t===900&&!G.closed){G.closed=true;sfx('bell');G.regime0=G.regime;rollTrend(true);toast('🔔 收盘。可以研究明天的行情，或者去生活')}
  if(G.ring>0){G.ring--;if(G.ring%2===0)sfx('ring');if(!G.ring){G.ringEv=null;G.family=clamp(G.family-3,0,100);toast('📵 错过了一个电话')}}
  else if(t>=540&&t<1320&&G.calls<2&&R()<.008){const e=pickEvent();if(e){G.ring=15;G.ringEv=e.id;G.calls++;sfx('ring');toast('📞 电话响了！去桌边接电话')}}
  if(t>=1440&&!G.over){toast('😵 熬到半夜，倒头就睡');G.health=clamp(G.health-5,0,100);sleep(true)}
}
function swan(){const m={idx:-.09,tech:-.15,btc:-.22,oil:-.15,gold:.05};AK.forEach(k=>G.prices[k]*=1+m[k]);sfx('boom');flash();toast('⚠️ 黑天鹅！全球市场瞬间暴跌');addStress(10);life('遭遇黑天鹅')}
function checkLiq(){for(let i=G.pos.length-1;i>=0;i--){const p=G.pos[i],v=posVal(p);
  if(own('stop')&&p.lev>1&&v<=p.margin*.2&&v>0){closePos(p.id,true);toast('🛡️ 止损系统自动平掉了'+ASSETS[p.k].n);continue}
  if(v<=p.margin*.02){G.pos.splice(i,1);sfx('boom');flash();toast(`💥 ${ASSETS[p.k].n} 爆仓！亏掉 ${money(p.margin)}`);addStress(12);life(`${ASSETS[p.k].n}爆仓，亏掉${money(p.margin)}`);if(M&&M.type==='desk')renderModal()}}}
function openPos(k,dir,lev,amt){if(!marketOpen()){toast('休市中，9:30 开盘');return false}amt=Math.min(amt,G.cash);if(amt<100||lev>levCap())return false;
  const nt=amt*lev,fee=nt*(.0005+clamp(nt/3e10,0,.04));G.cash-=amt;G.pos.push({k,dir,lev,margin:amt-fee,entry:G.prices[k],id:Date.now()+R()});G.view=k;sfx('buy');save();return true}
function closePos(id,auto){const i=G.pos.findIndex(p=>p.id===id);if(i<0)return;if(!marketOpen()&&!auto){toast('休市中，明天开盘再平仓');return}
  const p=G.pos[i],v=Math.max(0,posVal(p)),nt=p.margin*p.lev*(G.prices[p.k]/p.entry),fee=Math.min(v,nt*(.0005+clamp(nt/3e10,0,.04)));G.cash+=v-fee;G.pos.splice(i,1);sfx(v-fee>p.margin?'coin':'sell');save()}
// ============ 生活动作 ============
function useEnergy(e){if(G.energy<e){toast('😩 精力不够了，喝杯咖啡或去睡觉');sfx('bad');return false}G.energy-=e;return true}
const ST={
 desk(){M={type:'desk',tab:'trade'};sfx('tap');renderModal()},
 board(){if(Object.keys(G.sig).length>=5)return toast('五个品种都研究过了');if(!useEnergy(20))return;addTime(30);addStress(1);const k=research();sfx('research');
   toast(`🔍 研究了${ASSETS[k].n}：${G.closed?'明天':'今天'}${G.sig[k].dir>0?'看涨📈':'看跌📉'}（把握${Math.round(G.sig[k].conf*100)}%）`)},
 tread(){if(!useEnergy(25))return;addTime(60);G.health=clamp(G.health+6,0,100);addStress(-8);sfx('gym');toast('🏃 跑了一小时，健康+6 压力-8')},
 coffee(){if(G.coffee>=3)return toast('今天已经喝了三杯，再喝心脏受不了');G.coffee++;const up=own('coffee');G.energy=Math.min(maxEnergy(),G.energy+(up?40:25));if(!up)G.health=clamp(G.health-2,0,100);addTime(10);sfx('coin');toast(up?'☕ 一杯好咖啡，精力+40':'☕ 速溶咖啡，精力+25 健康-2')},
 sofa(){if(!useEnergy(15))return;addTime(60);const g=hasT('社交达人')?20:10;G.family=clamp(G.family+g,0,100);addStress(-6);sfx('calm');toast(`🛋️ 陪家人聊了会儿天，家庭+${g}`)},
 bed(){const warn=marketOpen()&&G.pos.length;M={type:'confirm',title:'睡觉，结束今天？',desc:(warn?'⚠️ 还没收盘，你还有持仓，睡着后没人盯盘。':'')+(G.t<900?'现在睡会直接跳到收盘后。':'好好睡一觉，明天精力恢复。'),yes:'sleep()'};renderModal()},
 phone(){if(!G.ring)return toast('没有来电');const e=EV.find(x=>x.id===G.ringEv);G.ring=0;G.ringEv=null;showEvent(e)}
};
// ============ 事件 ============
const EV=[
 {id:'dad',w:g=>g.day>6?1:0,once:1,t:'父亲住院',d:'老家来电话，父亲突发心梗住进ICU，要尽快手术。',ch:[
  {t:'全力救治',cost:15e4,f(g){pay(-15e4);g.family+=15;life('花15万救治父亲');return '手术很成功。家庭+15'}},
  {t:'普通方案',cost:4e4,f(g){pay(-4e4);g.family+=3;addStress(8);return '你在医院和盘面之间来回奔波。'}},

      <div class="row"><button class="btn" style="flex:1" onclick="M.pick=null;renderModal()">返回</button><button class="btn pri" style="flex:2" ${amt<100?'disabled':''} onclick="if(openPos(M.pick.k,M.pick.dir,M.pick.lev,${amt})){M.pick=null}renderModal();renderHud()">下单</button></div>`}
    else{h+=AK.map(k=>{const c=G.prices[k]/G.open[k]-1,s=G.sig[k];return `<div class="as"><div class="nm" onclick="G.view='${k}'">${ASSETS[k].n}${s?`<br><span class="sig ${s.dir>0?'up':'down'}">研判${s.dir>0?'↑':'↓'}${Math.round(s.conf*100)}%</span>`:''}</div><div class="pr"><div id="pr_${k}">${fmtP(G.prices[k])}</div><div id="ch_${k}" class="${cls(c)}" style="font-size:12px">${pct(c)}</div></div><span class="sp"></span><button class="btn sm long" onclick="M.pick={k:'${k}',dir:1,lev:1,frac:.25};renderModal()">做多</button><button class="btn sm short" onclick="M.pick={k:'${k}',dir:-1,lev:1,frac:.25};renderModal()">做空</button></div>`}).join('');
     if(G.pos.length)h+=`<h3 style="margin-top:10px">持仓</h3>`+G.pos.map(p=>{const pl=posVal(p)-p.margin;return `<div class="as"><div style="flex:1"><b class="${p.dir>0?'up':'down'}">${p.dir>0?'多':'空'}</b> ${ASSETS[p.k].n} ×${p.lev}<div class="dim" style="font-size:11px">本金 ${money(p.margin)}</div></div><b id="pp_${String(p.id).replace('.','_')}" class="${cls(pl)}">${pl>=0?'+':''}${money(pl)} (${pct(pl/p.margin)})</b><button class="btn sm" onclick="closePos(${p.id});renderModal();renderHud()">平仓</button></div>`}).join('')}}
   else h+=UPG.map(u=>{const o=own(u.id),lock=G.lvl<u.lv;return `<div class="upg ${o?'own':''}"><div style="font-size:26px">${u.ic}</div><div style="flex:1"><b>${u.n}</b><div class="dim" style="font-size:12px">${u.d}</div></div>${o?'<b class="down">已拥有</b>':`<button class="btn sm pri" ${lock||G.cash<u.c?'disabled':''} onclick="buy('${u.id}')">${lock?'⭐'+u.lv+'级解锁':money(u.c)}</button>`}</div>`}).join('')}
  else if(M.type==='event'){const e=M.ev;h=`<h3>📞 ${e.t}</h3><p>${e.d}</p>`+e.ch.map((c,i)=>{const no=c.cost&&c.cost>G.cash;return `<button class="btn choice" ${no?'disabled':''} onclick="choose(${i})">${c.t}<small>${[c.cost?money(c.cost):'',c.s||'',no?'钱不够':''].filter(Boolean).join(' · ')}</small></button>`}).join('')}
  else if(M.type==='result')h=`<h3>${M.title}</h3><p>${esc(M.desc)}</p><button class="btn pri choice" style="text-align:center" onclick="ackResult()">好的</button>`
  else if(M.type==='confirm')h=`<h3>${M.title}</h3><p>${M.desc}</p><div class="row"><button class="btn" style="flex:1" onclick="closeM()">再等等</button><button class="btn pri" style="flex:2" onclick="${M.yes}">确定</button></div>`
  else if(M.type==='report'){h=`<h3>🌙 第 ${M.day} 天结束 · ${REG[M.reg]}</h3><table class="rep">${M.rows.map(r=>`<tr><td>${r[0]}</td><td class="${cls(r[1])}">${pct(r[1])}</td></tr>`).join('')}
   <tr><td><b>交易盈亏</b></td><td class="${cls(M.tradePL)}"><b>${M.tradePL>=0?'+':''}${money(M.tradePL)}（${pct(M.ret)}）</b></td></tr><tr><td>收入${M.fundFee?'（含基金费 '+money(M.fundFee)+'）':''}</td><td>+${money(M.inc)}</td></tr><tr><td>房租和生活费</td><td>-${money(M.c)}</td></tr><tr><td><b>总资产</b></td><td><b>${money(nw())}</b></td></tr></table>
   ${M.lvUp?`<p>⭐ <b>升到 ${G.lvl} 级！</b>去交易台的“升级”看看新设备。</p>`:''}${M.title?`<p>🏅 新称号：<b class="up">${M.title}</b></p>`:''}<button class="btn pri choice" style="text-align:center" onclick="ackReport()">${G.over?'继续':'起床，新的一天'}</button>`}
  else if(M.type==='status'){h=`<div class="row"><h3 style="margin:0">${G.name}</h3><span class="tag">${title()}</span><span class="sp"></span><button class="btn sm" onclick="closeM()">✕</button></div><p class="dim">${G.age}岁 · ${G.city} · ${G.bg}出身 · ⭐${G.lvl}级</p>${G.traits.map(t=>`<span class="tag">${t}</span>`).join('')}
   <table class="rep"><tr><td>总资产</td><td>${money(nw())}</td></tr><tr><td>现金</td><td>${money(G.cash)}</td></tr>${G.aum?`<tr><td>基金规模</td><td>${money(G.aum)}</td></tr>`:''}<tr><td>每天收入 / 开销</td><td>${money(income())} / ${money(cost())}</td></tr>
   <tr><td>健康 / 压力 / 家庭 / 合规</td><td>${G.health} / ${Math.round(G.stress)} / ${G.family} / ${G.comply}</td></tr><tr><td>研究准确率</td><td>${Math.round(acc()*100)}%</td></tr></table>
   <div class="dim" style="font-size:12px;max-height:120px;overflow:auto;margin-top:8px">${G.life.slice().reverse().map(l=>`<div>${esc(l)}</div>`).join('')}</div>
   <div class="row" style="margin-top:10px"><button class="btn sm" onclick="M={type:'confirm',title:'金盆洗手？',desc:'现在退休，按当前身家结算人生结局。',yes:'retire()'};renderModal()">🏁 退休结算</button><span class="sp"></span><button class="btn sm" onclick="M={type:'confirm',title:'重开一局？',desc:'当前进度会丢失。',yes:'restart()'};renderModal()">↻ 重开</button></div>`}
  else if(M.type==='end'){const e=M.e;h=`<div class="big">${e[0]}</div><h3 style="text-align:center;font-size:24px">${e[1]}</h3><p style="text-align:center">${e[2]}</p>
   <table class="rep"><tr><td>${G.name}</td><td>${G.age}岁 · 第${G.day}天 · ⭐${G.lvl}级</td></tr><tr><td>最终资产</td><td><b>${money(nw())}</b></td></tr><tr><td>巅峰资产</td><td>${money(G.peak)}</td></tr></table>
   <div class="dim" style="font-size:12px;max-height:140px;overflow:auto;margin-top:8px">${G.life.map(l=>`<div>${esc(l)}</div>`).join('')}</div><button class="btn pri choice" style="text-align:center" onclick="restart()">再活一次 ↻</button>`}
  el.innerHTML=`<div class="sheet">${h}</div>`}
function closeM(){M=null;sfx('tap');renderModal()}
function openStatus(){if(!G||(M&&M.type!=='desk'))return;M={type:'status'};renderModal()}
function buy(id){const u=UPG.find(x=>x.id===id);if(G.cash<u.c||G.lvl<u.lv||own(id))return;pay(-u.c);G.up[id]=1;if(id==='fund'){G.aum=5e7;life('成立私募基金')}else life('购入'+u.n);sfx('level');toast('✅ 已购买：'+u.n);buildWorld();save();renderModal();renderHud()}
function start(){newGame(draft);draft=null;M=null;cam.x=0;cam.z=2.2;cam.yaw=0;sfx('level');renderModal();renderHud();toast(`☀️ 第1天 8:30 · 📰 ${G.news}。先去白板研究，9:30 开盘`)}
function restart(){try{localStorage.removeItem('trader3d_v1')}catch(e){}G=null;draft=genChar();M={type:'start'};buildWorld();renderModal();$('hud').innerHTML=$('bars').innerHTML=$('pnl').innerHTML=''}
// ============ 主循环 ============
let last=0,hudT=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(G&&!G.over){if(!M)move(dt);if(!M||M.type==='desk'){addTime(dt*3);hudT+=dt;if(hudT>.5){hudT=0;renderHud()}}}
  draw();if(G)updLabels();requestAnimationFrame(frame)}
initGL();resize();addEventListener('resize',resize);
$('sndBtn').textContent=SND.on?'🔊':'🔇';$('bgmBtn').style.opacity=SND.bgm?1:.4;
try{const s=localStorage.getItem('trader3d_v1');if(s){const g=JSON.parse(s);if(g&&g.prices&&g.up)G=g}}catch(e){}
if(G){buildWorld();renderHud()}else{draft=genChar();M={type:'start'};buildWorld();renderModal()}
requestAnimationFrame(frame);
</script>
</body>
</html>
