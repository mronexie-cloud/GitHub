<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>音乐盒</title>
<style>
:root{
  --bg:#FAF7F4;--panel:#FFFFFF;--soft:#F1ECE6;--line:#E7E0D8;--ink:#221D18;--sub:#7D736A;--faint:#ADA39A;
  --acc:#D9503C;--acc2:#B23A52;--accInk:#fff;--shadow:0 10px 30px rgba(60,35,20,.12);
}
:root[data-theme="dark"]{
  --bg:#16130F;--panel:#201C17;--soft:#2A251F;--line:#342D26;--ink:#F2ECE6;--sub:#A69B90;--faint:#6F665D;
  --acc:#F07A5F;--acc2:#E06A86;--accInk:#1A120D;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{width:22px;height:22px;fill:currentColor;flex:none;display:block}
.app{display:flex;flex-direction:column;height:100%}
header{padding:14px 16px 6px;display:flex;align-items:center;gap:6px}
header h1{font-size:24px;font-weight:800;letter-spacing:.5px;margin:0;flex:1}
.ib{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--soft)}
.search{margin:4px 16px 6px;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:0 12px;height:40px}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;color:var(--ink);min-width:0}
.search svg{width:18px;height:18px;color:var(--sub)}
.tabs{display:flex;gap:22px;padding:4px 18px 0;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 0 10px;color:var(--sub);font-weight:600;position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:3px;border-radius:2px;background:var(--acc)}
main{flex:1;overflow-y:auto;padding-bottom:96px}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px 6px 16px}
.playall{display:flex;align-items:center;gap:9px;font-weight:700;text-align:left;white-space:nowrap;min-width:0}
.playall span{display:flex;flex-direction:column;line-height:1.2}
.playall i{width:30px;height:30px;border-radius:15px;background:var(--acc);color:var(--accInk);display:grid;place-items:center}
.playall i svg{width:18px;height:18px}
.playall small{color:var(--sub);font-weight:500;font-size:12px}
.bar .sp{flex:1}
.chip{height:32px;padding:0 11px;border-radius:16px;background:var(--soft);color:var(--sub);font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
.chip svg{width:16px;height:16px}
.row{display:flex;align-items:center;gap:12px;padding:7px 4px 7px 16px;content-visibility:auto;contain-intrinsic-size:auto 60px}
.row:active{background:var(--soft)}
.cv{width:46px;height:46px;border-radius:9px;overflow:hidden;position:relative;flex:none;background:var(--soft)}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:18px;background:linear-gradient(135deg,hsl(calc(var(--h) + 18),70%,64%),hsl(var(--h),52%,44%))}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{display:block;color:var(--sub);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.playing .tx b{color:var(--acc)}
.eq{display:none;align-items:flex-end;gap:2px;height:14px;margin-right:4px}
.row.playing .eq{display:flex}
.eq i{width:3px;background:var(--acc);border-radius:1px;height:40%;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.more{width:40px;height:44px;display:grid;place-items:center;color:var(--faint)}
.tag{font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:4px;padding:0 3px;margin-right:4px;vertical-align:1px}
.group{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px}
.group:active{background:var(--soft)}
.gi{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;background:var(--soft);color:var(--acc);flex:none}
.gi.fav{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.sect{padding:16px 16px 4px;color:var(--sub);font-size:12.5px;font-weight:600;letter-spacing:.5px}
.empty{padding:60px 32px;text-align:center;color:var(--sub)}
.empty h3{color:var(--ink);margin:14px 0 6px;font-size:17px}
.empty .big{width:72px;height:72px;margin:0 auto;border-radius:20px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#fff}
.empty .big svg{width:36px;height:36px}
.btn{height:42px;padding:0 20px;border-radius:21px;background:var(--acc);color:var(--accInk);font-weight:700;margin-top:18px}
.btn.ghost{background:var(--soft);color:var(--ink)}
/* sub page */
.page{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.page .top{display:flex;align-items:center;gap:4px;padding:10px 6px}
.page .top h2{flex:1;font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page main{padding-bottom:96px}
/* mini player */
.mini{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;padding:8px 8px 8px 8px;overflow:hidden}
.mini .cv{width:44px;height:44px;border-radius:10px}
.mini .tx b{font-size:14.5px}
.mini .pg{position:absolute;left:0;bottom:0;height:2.5px;background:var(--acc);width:0}
.mini .pp{width:42px;height:42px;border-radius:21px;display:grid;place-items:center}
.mini .pp svg{width:28px;height:28px}
/* full player */
.player{position:fixed;inset:0;z-index:40;color:#fff;background:#2a1d17;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.player.open{transform:none}
.player .bgimg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.3);opacity:.75;transform:scale(1.1)}
.player .bgshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,8,.35),rgba(20,12,8,.7) 60%,rgba(20,12,8,.88))}
.player>*:not(.bgimg):not(.bgshade){position:relative}
.ptop{display:flex;align-items:center;padding:12px 8px 0}
.ptop .ib{color:#fff}
.ptop .ib:active{background:rgba(255,255,255,.12)}
.ptop .mid{flex:1;text-align:center;font-size:13px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 32px}
.bigcv{width:min(78vw,46vh);aspect-ratio:1;max-width:100%;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 24px 50px rgba(0,0,0,.45);background:rgba(255,255,255,.08)}
.bigcv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bigcv .ph{font-size:64px}
.lyline{margin-top:22px;min-height:44px;text-align:center;font-size:15px;opacity:.9;max-width:100%}
.lyline small{display:block;opacity:.65;font-size:12.5px;margin-top:2px}
.lyrics{flex:1;min-height:0;width:100%;overflow-y:auto;text-align:center;padding:16vh 6px;mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.lyrics p{margin:0;padding:9px 4px;font-size:16.5px;opacity:.45;transition:opacity .25s,transform .25s;line-height:1.45}
.lyrics p small{display:block;font-size:13px;margin-top:2px}
.lyrics p.cur{opacity:1;transform:scale(1.06);font-weight:700}
.lyrics.plain p{opacity:.85}
.lyrics .gap{height:14px;padding:0}
.lymsg{opacity:.7;padding:20px;text-align:center;line-height:1.7}
.lytools{display:flex;justify-content:center;gap:8px;padding:8px 0 2px;flex-wrap:wrap}
.lytools button{font-size:12.5px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.12)}
.lysrc{font-size:11.5px;opacity:.55;text-align:center}
.meta{display:flex;align-items:center;gap:8px;padding:0 24px}
.meta .tx b{font-size:20px;font-weight:800}
.meta .tx small{color:rgba(255,255,255,.7);font-size:14px}
.meta .ib{color:#fff}
.heart.on{color:#FF6B6B}
.seek{padding:14px 24px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p,0%),rgba(255,255,255,.25) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:7px;background:#fff;margin-top:-5px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.times{display:flex;justify-content:space-between;font-size:11.5px;opacity:.65;font-variant-numeric:tabular-nums;margin-top:2px}
.ctrls{display:flex;align-items:center;justify-content:space-between;padding:12px 22px 6px}
.ctrls .ib{color:#fff;width:48px;height:48px;border-radius:24px}
.ctrls .ib svg{width:26px;height:26px}
.ctrls .ib.dim{opacity:.85}
.ctrls .big{width:72px;height:72px;border-radius:36px;background:#fff;color:#2a1d17;display:grid;place-items:center}
.ctrls .big svg{width:36px;height:36px}
.pbot{display:flex;justify-content:space-around;padding:4px 30px calc(18px + env(safe-area-inset-bottom))}
.pbot button{display:flex;align-items:center;gap:6px;font-size:12.5px;opacity:.8;padding:8px 10px;border-radius:16px}
.pbot button.on{opacity:1;color:#FFD3C4}
.pbot svg{width:19px;height:19px}
/* sheets & dialogs */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--panel);color:var(--ink);border-radius:18px 18px 0 0;max-height:78vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.show{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px}
.sheet h3{margin:6px 18px 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.sheet h3 span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet h3 small{font-weight:500;color:var(--sub);font-size:13px}
.sheet .body{overflow-y:auto;padding-bottom:10px}
.item{display:flex;align-items:center;gap:14px;padding:13px 20px;width:100%;text-align:left}
.item:active{background:var(--soft)}
.item svg{color:var(--sub)}
.item.danger{color:#D9483B}
.item.danger svg{color:#D9483B}
.item .r{margin-left:auto;color:var(--sub);font-size:13px}
.qrow{display:flex;align-items:center;gap:10px;padding:9px 6px 9px 18px}
.qrow .tx b{font-size:14.5px}
.qrow.cur .tx b{color:var(--acc)}
.opt{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}
.opt button{height:34px;padding:0 14px;border-radius:17px;background:var(--soft);font-size:13.5px}
.opt button.on{background:var(--acc);color:var(--accInk);font-weight:700}
.note{font-size:12.5px;color:var(--sub);padding:6px 20px 14px;line-height:1.6}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;margin-left:auto;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(18px)}
.dlg{position:fixed;left:24px;right:24px;top:30%;z-index:52;background:var(--panel);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.dlg h4{margin:0 0 12px;font-size:16px}
.dlg input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:var(--bg);color:var(--ink);outline:0}
.dlg input:focus{border-color:var(--acc)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.dlg .acts button{height:38px;padding:0 16px;border-radius:19px;font-weight:600}
.dlg .acts .ok{background:var(--acc);color:var(--accInk)}
.dlg p{margin:0;color:var(--sub);font-size:14px;line-height:1.6;word-break:break-all}
.tip{margin:10px 12px 4px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:13px;color:var(--sub);line-height:1.55}
.tip b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.tip .acts{display:flex;gap:8px;margin-top:8px}
.tip .acts button{height:32px;padding:0 14px;border-radius:16px;font-weight:600;font-size:13px}
.tip .acts .ok{background:var(--acc);color:var(--accInk)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,22,16,.92);color:#fff;padding:9px 16px;border-radius:18px;font-size:13.5px;z-index:60;max-width:86vw;text-align:center}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1 id="ttl">音乐盒</h1>
    <button class="ib" id="bSearch" aria-label="search"><svg viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.2 4.2-1.4 1.4-4.2-4.2A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg></button>
    <button class="ib" id="bSet" aria-label="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10v2H4V7zm12-2h2v2h2v2h-2v2h-2V5zM4 15h4v2H4v-2zm6-2h2v2h8v2h-8v2h-2v-6z"/></svg></button>
  </header>
  <div class="search" id="searchBox" hidden>
    <svg viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 0 1 5.2 10.4l4.2 4.2-1.4 1.4-4.2-4.2A6.5 6.5 0 1 1 10.5 4zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
    <input id="q" type="search" autocomplete="off">
    <button class="ib" id="qx" style="width:28px;height:28px"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4L12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg></button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="songs" class="on"></button>
    <button data-tab="lists"></button>
    <button data-tab="folders"></button>
  </nav>
  <main id="main"></main>
</div>

<div class="mini" id="mini" hidden>
  <div class="cv" id="miniCv"></div>
  <div class="tx"><b id="miniT"></b><small id="miniA"></small></div>
  <button class="pp" id="miniPP"></button>
  <button class="pp" id="miniNext"><svg viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M6 6.5v11l8.5-5.5L6 6.5zM16 6h2v12h-2z"/></svg></button>
  <div class="pg" id="miniPg"></div>
</div>

<section class="player" id="player" aria-hidden="true">
  <div class="bgimg" id="pBg"></div><div class="bgshade"></div>
  <div class="ptop">
    <button class="ib" id="pClose"><svg viewBox="0 0 24 24"><path d="M5.4 8.6 12 15.2l6.6-6.6L20 10l-8 8-8-8z"/></svg></button>
    <div class="mid" id="pFrom"></div>
    <button class="ib" id="pMore"><svg viewBox="0 0 24 24"><path d="M12 5.5a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6zm0 4.7a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6zm0 4.7a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6z"/></svg></button>
  </div>
  <div class="stage" id="stage">
    <div id="coverView" style="display:flex;flex-direction:column;align-items:center;width:100%">
      <div class="bigcv" id="pCv"></div>
      <div class="lyline" id="lyLine"></div>
    </div>
    <div id="lyView" hidden style="display:flex;flex-direction:column;width:100%;flex:1;min-height:0">
      <div class="lyrics" id="lyBox"></div>
      <div class="lysrc" id="lySrc"></div>
      <div class="lytools" id="lyTools"></div>
    </div>
  </div>
  <div class="meta">
    <div class="tx"><b id="pT"></b><small id="pA"></small></div>
    <button class="ib heart" id="pFav"></button>
  </div>
  <div class="seek">
    <input type="range" id="pSeek" min="0" max="1000" value="0">
    <div class="times"><span id="pPos">0:00</span><span id="pDur">0:00</span></div>
  </div>
  <div class="ctrls">
    <button class="ib dim" id="pMode"></button>
    <button class="ib" id="pPrev"><svg viewBox="0 0 24 24"><path d="M18 6.5v11L9.5 12 18 6.5zM6 6h2v12H6z"/></svg></button>
    <button class="big" id="pPP"></button>
    <button class="ib" id="pNext"><svg viewBox="0 0 24 24"><path d="M6 6.5v11l8.5-5.5L6 6.5zM16 6h2v12h-2z"/></svg></button>
    <button class="ib dim" id="pQueue"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3V6zm0 5h13v2H3v-2zm0 5h9v2H3v-2zm14-1V9l5 4-5 3z"/></svg></button>
  </div>
  <div class="pbot">
    <button id="pLyBtn"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4V5zm0 4h10v2H4V9zm0 4h16v2H4v-2zm0 4h10v2H4v-2z"/></svg><span></span></button>
    <button id="pSleep"><svg viewBox="0 0 24 24"><path d="M12.6 3.1A9 9 0 1 0 21 13.9 7 7 0 0 1 12.6 3.1z"/></svg><span></span></button>
  </div>
</section>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden><div class="grab"></div><h3 id="shH"></h3><div class="body" id="shB"></div></div>
<div class="dlg" id="dlg" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const A = window.A || null;
const $ = id => document.getElementById(id);
const ZH = !/^en/i.test(navigator.language || 'zh');
const T = {
  songs:['歌曲','Songs'], lists:['歌单','Playlists'], folders:['文件夹','Folders'],
  search:['搜索歌名、歌手、专辑','Search songs, artists, albums'],
  playAll:['全部播放','Play all'], nSongs:['{n} 首','{n} songs'], shuffle:['随机','Shuffle'],
  byTitle:['按名称','By title'], byArtist:['按歌手','By artist'], byAdded:['最近添加','Recently added'],
  unknown:['未知歌手','Unknown artist'], fav:['我喜欢','Favorites'], newList:['新建歌单','New playlist'],
  myLists:['我的歌单','My playlists'], listName:['歌单名称','Playlist name'], ok:['确定','OK'], cancel:['取消','Cancel'],
  playNext:['下一首播放','Play next'], enqueue:['加入播放队列','Add to queue'], addTo:['加入歌单…','Add to playlist…'],
  like:['收藏到我喜欢','Add to favorites'], unlike:['从我喜欢移除','Remove from favorites'], info:['文件信息','File info'],
  removeFromList:['从歌单移除','Remove from playlist'], rename:['重命名','Rename'], del:['删除歌单','Delete playlist'],
  delAsk:['删除歌单「{n}」？歌曲文件不会被删除。','Delete playlist "{n}"? Song files are kept.'],
  added:['已加入「{n}」','Added to "{n}"'], already:['已在「{n}」里','Already in "{n}"'], queued:['已加入播放队列','Added to queue'], nextUp:['将在下一首播放','Plays next'],
  queue:['播放队列','Queue'], clear:['清空','Clear'], nowPlaying:['正在播放','Now playing'],

// used by the automatic emulator test
function runDemo() {

  closeDlg();

  const show = () => setTimeout(() => { openPlayer(); toggleLyrics(true); }, 800);
  if (d === 'play') { S.tab = 'songs'; render(); playList(S.view, 0, t('allSongs')); show(); }
  else if (d.startsWith('song:')) {

window.onPerm = ok => { render(); if (ok) scan(); };

function sorted(list) {
  const a = list.slice();
  if (S.sort === 'artist') a.sort((x, y) => coll.compare(x.artist || '~', y.artist || '~') || coll.compare(x.title, y.title));
  else if (S.sort === 'added') a.sort((x, y) => y.added - x.added);
  else a.sort((x, y) => coll.compare(x.title, y.title));
  return a;
}
function matches(s, q) {
  return !q || (s.title + '\n' + s.artist + '\n' + s.album + '\n' + s.name).toLowerCase().includes(q);
}

/* ---------------- rendering ---------------- */
function cover(s, size) {
  const h = hue(s ? (s.album || s.title) : 'x');
  return `<span class="ph" style="--h:${h}">♪</span>` + (s && !String(s.id).startsWith('x:') ? `<img loading="lazy" src="https://local.art/${encodeURIComponent(s.id)}?s=${size}" onerror="this.remove()">` : '');
}
function sub(s) {
  return esc(s.artist || t('unknown')) + (s.album ? ' · ' + esc(s.album) : '');
}
function rowHtml(s, i) {
  return `<div class="row" data-id="${esc(s.id)}" data-i="${i}"><div class="cv">${cover(s, 112)}</div>
    <div class="tx"><b>${esc(s.title)}</b><small>${s.hidden ? `<span class="tag">${esc(t('hiddenTag'))}</span>` : ''}${sub(s)}</small></div>
    <div class="eq"><i></i><i></i><i></i></div><button class="more" data-more="${esc(s.id)}">${I.more}</button></div>`;
}
function songList(list, ctx) {

  return `<div class="bar"><button class="playall" data-playall="0"><i>${I.play}</i><span>${esc(t('playAll'))}<small>${esc(t('nSongs', list.length))} · ${fmt(total)}</small></span></button><span class="sp"></span>
    <button class="chip" data-shuffle="1">${I.shuf}${esc(t('shuffle'))}</button>
    ${ctx === 'songs' ? `<button class="chip" id="sortBtn">${esc(t({title:'byTitle', artist:'byArtist', added:'byAdded'}[S.sort]))}</button>` : ''}</div>
    <div class="list">${list.map(rowHtml).join('')}</div>`;
}
function emptyHtml(icon, title, desc, btn) {
  return `<div class="empty"><div class="big">${icon}</div><h3>${esc(title)}</h3><div>${esc(desc)}</div>${btn || ''}</div>`;
}

function render() {
  document.querySelectorAll('#tabs button').forEach(b => { b.textContent = t(b.dataset.tab); b.classList.toggle('on', b.dataset.tab === S.tab); });
  $('q').placeholder = t('search');

  if (A && !A.hasPerm()) {
    m.innerHTML = emptyHtml(I.note, t('permT'), t('permD'), `<button class="btn" id="permBtn">${esc(t('permB'))}</button>`);
    $('permBtn').onclick = () => A.askPerm();

  }
  const q = S.q.trim().toLowerCase();
  if (S.tab === 'songs' || q) {
    S.view = sorted(S.lib.filter(s => matches(s, q)));

      : q ? emptyHtml(I.note, t('noMatch'), '') : emptyHtml(I.note, t('emptyT'), t('emptyD'), `<button class="btn" id="rescanBtn">${esc(t('rescan'))}</button>`));
    if ($('deepOn')) { $('deepOn').onclick = () => A.askAllFiles(); $('deepNo').onclick = () => { store.set('deepTip', 1); render(); }; }

      : emptyHtml(I.folder, t('emptyT'), t('emptyD'));
  }

/* sub pages: a playlist or a folder */
function openPage(kind, key) {
  S.pages.push({kind, key});

}
function pageSongs(p) {
  if (p.kind === 'folder') return sorted(S.lib.filter(s => s.folder === p.key));
  const ids = p.key === 'fav' ? S.fav : (S.lists.find(l => l.id === p.key) || {ids: []}).ids;
  return ids.map(id => S.byId[id]).filter(Boolean);
}
function pageTitle(p) {
  if (p.kind === 'folder') return p.key.split('/').pop() || '/';
  if (p.key === 'fav') return t('fav');
  return (S.lists.find(l => l.id === p.key) || {}).name || '';
}
function renderPage() {
  document.querySelectorAll('.page').forEach(e => e.remove());
  const p = S.pages[S.pages.length - 1];
  if (!p) return;
  const list = pageSongs(p);
  const el = document.createElement('div');
  el.className = 'page';
  const editable = p.kind === 'list' && p.key !== 'fav';
  el.innerHTML = `<div class="top"><button class="ib" data-back="1">${I.back}</button><h2>${esc(pageTitle(p))}</h2>${editable ? `<button class="ib" data-pmenu="1">${I.more}</button>` : ''}</div>
    <main data-ctx="${p.kind}:${esc(p.key)}">${list.length ? songList(list, 'page') : emptyHtml(p.key === 'fav' ? I.heartF : I.list, t('nothing'), p.key === 'fav' ? t('favEmpty') : '')}</main>`;
  document.body.insertBefore(el, $('mini'));
  el.querySelector('[data-back]').onclick = () => { S.pages.pop(); renderPage(); };
  const pm = el.querySelector('[data-pmenu]');
  if (pm) pm.onclick = () => listMenu(p.key);
  el.querySelector('main').addEventListener('click', listClick);
  markPlaying();
}

function ctxList(main) {
  const ctx = main.dataset.ctx || 'songs';
  if (ctx === 'songs') return {list: S.view, name: S.q ? t('search') : t('allSongs'), ctx};
  const [kind, ...rest] = ctx.split(':');
  const p = {kind, key: rest.join(':')};
  return {list: pageSongs(p), name: pageTitle(p), ctx};
}
function listClick(e) {
  const main = e.currentTarget;
  const more = e.target.closest('[data-more]');
  const {list, name, ctx} = ctxList(main);
  if (more) { songMenu(more.dataset.more, ctx); return; }
  if (e.target.closest('[data-playall]')) { playList(list, 0, name); return; }
  if (e.target.closest('[data-shuffle]')) { playList(list, Math.floor(Math.random() * list.length), name, true); return; }
  const g = e.target.closest('[data-list]');
  if (g) { openPage('list', g.dataset.list); return; }
  const f = e.target.closest('[data-folder]');
  if (f) { openPage('folder', f.dataset.folder); return; }
  const r = e.target.closest('.row');
  if (r) {
    const id = r.dataset.id;
    if (id === S.st.id) { openPlayer(); return; }
    playList(list, +r.dataset.i, name);
  }
}
$('main').addEventListener('click', listClick);

function playList(list, index, name, shuffle) {
  if (!list.length || !A) return;
  S.from = name || '';
  A.play(JSON.stringify(list.map(s => s.id)), index, 0);
  if (shuffle) A.cmd('mode', '2');
}

function markPlaying() {

  if (id) document.querySelectorAll(`.row[data-id="${CSS.escape(id)}"]`).forEach(r => r.classList.add('playing'));
  document.body.classList.toggle('paused', !S.st.playing);
}

function loadLyrics(s, force) {

function parseLrc(text) {
  let offset = 0;
  const raw = [];
  for (const line of String(text).split(/\r?\n/)) {
    const off = line.match(/^\s*\[offset:\s*([+-]?\d+)\s*\]/i);
    if (off) { offset = +off[1]; continue; }
    const tags = [...line.matchAll(/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g)];
    if (!tags.length) continue;
    const txt = line.replace(/\[[^\]]*\]/g, '').replace(/<\d{1,3}:\d{1,2}(?:[.:]\d{1,3})?>/g, '').trim();
    for (const m of tags) raw.push({t: (+m[1]) * 60000 + (+m[2]) * 1000 + (m[3] ? +m[3].padEnd(3, '0') : 0) - offset, txt});
  }
  if (raw.length < 2) {
    const plain = String(text).split(/\r?\n/).map(l => l.replace(/^\s*\[[a-z]+:.*\]\s*$/i, '').trim());
    while (plain.length && !plain[0]) plain.shift();
    return {synced: false, lines: plain.map(txt => ({txt}))};
  }
  raw.sort((a, b) => a.t - b.t);
  const out = [];
  for (const l of raw) {
    const last = out[out.length - 1];
    if (last && Math.abs(last.t - l.t) < 10 && l.txt) { if (last.txt) last.sub = (last.sub ? last.sub + ' ' : '') + l.txt; else last.txt = l.txt; }
    else out.push({t: l.t, txt: l.txt});
  }
  return {synced: true, lines: out};
}

function setLyrics(id, r) {
  const box = $('lyBox');
  if (!r || r.src === 'none' || !r.text || !r.text.trim()) {
    S.lyLines = null;

    box.innerHTML = `<div class="lymsg">${esc(r && r.offline ? t('offlineLy') : t('noLyrics'))}</div>`;
    $('lySrc').textContent = '';
    $('lyLine').innerHTML = '';
    lyTools(r);
    return;
  }
  const p = parseLrc(r.text);
  S.lyLines = p;
  S.lyCur = -1;
  box.className = 'lyrics' + (p.synced ? '' : ' plain');
  box.innerHTML = p.lines.map((l, i) => l.txt || l.sub ? `<p data-i="${i}">${esc(l.txt)}${l.sub ? `<small>${esc(l.sub)}</small>` : ''}</p>` : '<p class="gap"></p>').join('');
  const src = T.lySrc[r.src];
  $('lySrc').textContent = src ? src[ZH ? 0 : 1] : '';
  lyTools(r);
  updateLyric(S.st.pos || 0, true);
}

function updateLyric(pos, force) {
  const p = S.lyLines;
  if (!p || !p.synced) { if (p && !p.synced) $('lyLine').innerHTML = ''; return; }
  let i = -1;
  const L = p.lines;
  for (let k = 0; k < L.length; k++) { if (L[k].t <= pos + 250) i = k; else break; }
  if (i === S.lyCur && !force) return;
  S.lyCur = i;
  const box = $('lyBox');
  box.querySelectorAll('p.cur').forEach(e => e.classList.remove('cur'));
  const cur = i >= 0 ? box.querySelector(`p[data-i="${i}"]`) : null;
  if (cur) cur.classList.add('cur');
  const l = i >= 0 ? L[i] : null;
  $('lyLine').innerHTML = l && l.txt ? esc(l.txt) + (l.sub ? `<small>${esc(l.sub)}</small>` : '') : '';
  if (cur && !$('lyView').hidden && Date.now() > S.lyHold) box.scrollTo({top: cur.offsetTop - box.clientHeight * 0.42 + cur.offsetHeight / 2, behavior: force ? 'auto' : 'smooth'});
}
