<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>0基础英语发音</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="0基础英语发音">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: cheerful, patient coach for a total beginner — short Chinese hints, big English words
   IDEA: a stamped exercise-book adventure map; each grammar chapter is one stop on a winding road
   PICTURE: the level map itself — big round stops on a dotted road, stars stamped under each
   COLOUR: ink blue field (from the chart's dark blue) + paper white + tomato accent for stars/hearts
   TYPE: Baloo 2 for English & numbers, system Chinese sans for 中文; LAYOUT: one centred phone column */
:root{color-scheme:light dark;
--bg:light-dark(#2342c8,#0f1a4d);--paper:light-dark(#ffffff,#18224f);--paper2:light-dark(#eef2ff,#222d63);
--ink:light-dark(#141a33,#eef1ff);--soft:light-dark(#5a6386,#aab3dc);--blue:light-dark(#2342c8,#8ea4ff);
--acc:#ff5a36;--gold:#ffc83d;--ok:#1fa463;--bad:#e5384f;--line:light-dark(#d9def0,#2f3a78)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.en,.num{font-family:"Baloo 2","PingFang SC",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.top{display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:14px}
.top h1{font:800 30px/1.05 "Baloo 2","PingFang SC",sans-serif;margin:0;flex:1}
.pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border-radius:99px;padding:6px 12px;font-weight:700;white-space:nowrap}
.back{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:22px;display:grid;place-items:center}
.card{background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.sub{color:#dfe5ff;margin:0 0 12px;font-size:15px}
/* map */
.map{position:relative;padding:6px 0 10px}
.stop{display:flex;align-items:center;gap:14px;width:78%;margin:0 0 6px;padding:10px;border-radius:20px;text-align:left;position:relative}
.stop:nth-child(even){margin-left:auto;flex-direction:row-reverse;text-align:right}
.dot{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font:800 30px "Baloo 2",sans-serif;color:#fff;box-shadow:inset 0 -7px 0 rgba(0,0,0,.2),0 5px 0 rgba(0,0,0,.25);border:4px solid #fff}
.stop.locked .dot{background:#8b93b8!important;color:#d9ddef}
.stop .t{color:#fff;font-weight:800;font-size:17px;line-height:1.25}
.stop .d{color:#cfd7ff;font-size:13px}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
.stars i{color:rgba(255,255,255,.3);font-style:normal}
.road{position:absolute;inset:0;pointer-events:none}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.tool{background:var(--paper);border-radius:18px;padding:14px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.18);min-height:44px}
.tool b{display:block;font-size:16px}.tool span{color:var(--soft);font-size:13px}
/* unit */
.hero{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.hero .dot{width:64px;height:64px;font-size:26px}
.hero h2{margin:0;color:#fff;font-size:24px;line-height:1.15}
.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:18px;font-weight:800;font-size:18px;box-shadow:0 5px 0 rgba(0,0,0,.22);margin-bottom:12px}
.b1{background:var(--gold);color:#3a2a00}.b2{background:#fff;color:#2342c8}.b3{background:var(--acc);color:#fff}
.b2.dk{background:var(--paper);color:var(--blue)}
/* learn */
.sec{margin:0 0 14px}
.sec h3{margin:0 0 8px;font-size:17px}
.note{background:var(--paper2);border-radius:14px;padding:10px 12px;font-size:14px;color:var(--soft);margin:8px 0}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .w{font:700 20px/1.2 "Baloo 2",sans-serif;color:var(--blue)}
.row .z{color:var(--soft);font-size:14px}
.row .ex{font-size:14px}
.say{flex:none;width:40px;height:40px;border-radius:12px;background:var(--paper2);display:grid;place-items:center;color:var(--blue)}
.say svg,.sp svg{width:20px;height:20px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--paper2);border-radius:14px;padding:8px 4px;text-align:center;min-height:44px}
.tile .w{font:800 24px/1.1 "Baloo 2",sans-serif;color:var(--blue)}
.tile .z{font-size:12px;color:var(--soft)}
.tile.v .w{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--soft);font-weight:600}
td.e{font:700 16px "Baloo 2",sans-serif;color:var(--blue);cursor:pointer}
.scroll{overflow-x:auto}
.tag{display:inline-block;background:var(--paper2);border-radius:8px;padding:2px 8px;margin:2px;font:600 15px "Baloo 2",sans-serif;color:var(--blue);cursor:pointer}
/* game */
.bar{flex:1;height:14px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.hearts{color:#ff8a9a;font-weight:800;white-space:nowrap}
.q{min-height:150px}
.qk{color:var(--soft);font-size:14px;margin-bottom:6px}
.qp{font-size:22px;font-weight:800;line-height:1.35;margin-bottom:6px}
.qp .en{font-size:26px}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--acc);text-align:center;color:var(--acc)}
.qz{color:var(--soft);font-size:15px}
.sp{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--blue);color:#fff;vertical-align:middle;margin-right:8px}
.sp.huge{width:96px;height:96px;border-radius:28px;margin:6px auto 10px;display:grid}.sp.huge svg{width:44px;height:44px}
.opts{display:grid;gap:10px;margin-top:14px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{min-height:54px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--paper);padding:8px 12px;font:700 18px "Baloo 2","PingFang SC",sans-serif;text-align:center}
.opt.sel{border-color:var(--blue);background:var(--paper2)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--paper));color:var(--ok)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--paper));color:var(--bad)}
.opt.done{opacity:.3;pointer-events:none}
.opt:disabled{cursor:default}
.mcol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.mcol>div{display:grid;gap:10px}
.ans{min-height:60px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-top:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.chip{min-height:46px;padding:6px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--paper);font:700 18px "Baloo 2",sans-serif}
.chip.used{visibility:hidden}
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(110%);transition:transform .25s;visibility:hidden}
.fb.show{transform:none;visibility:visible}
.fb .in{max-width:560px;margin:0 auto}
.fb.good{background:#d8f7e6;color:#0d6b3d}.fb.wrong{background:#ffe0e4;color:#a01a2d}
.fb h4{margin:0 0 4px;font-size:20px}.fb p{margin:0 0 10px;font-size:15px}
.fb .big{margin:0}
.fb.good .big{background:var(--ok);color:#fff}.fb.wrong .big{background:var(--bad);color:#fff}
.check{position:sticky;bottom:12px;margin-top:16px}
.end{text-align:center;padding:26px 18px}
.end .s{font-size:52px;color:var(--gold);letter-spacing:6px}.end .s i{color:var(--line);font-style:normal}
.end h2{margin:6px 0;font-size:28px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-150%);background:#141a33;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;transition:transform .25s;z-index:9;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.empty{text-align:center;color:var(--soft);padding:24px 8px}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}.fb,.toast,.bar i{transition:none}}
@media(max-width:380px){.dot{width:64px;height:64px;font-size:26px}.stop{width:88%}.qp{font-size:20px}.opt{font-size:16px}}
</style>
</head>

const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if(S.days.includes(k)){n++;d.setDate(d.getDate()-1)}else{if(n===0&&k===today()){d.setDate(d.getDate()-1);continue}break}}return n}

/* 发音：用手机/浏览器自带的英语朗读 */
let voice=null,warned=false;
function loadVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{loadVoice();speechSynthesis.onvoiceschanged=loadVoice}catch(e){}
const nativeTTS=()=>!!(window.Android&&typeof Android.speak==="function");
function say(text){
 try{
  if(nativeTTS()){if(Android.canSpeak&&!Android.canSpeak()&&!warned){warned=true;toast("手机没有英语朗读引擎：请到 设置 → 文字转语音 安装英语语音")}Android.speak(text);return}
  if(!("speechSynthesis" in window))throw 0;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.85;if(voice)u.voice=voice;
  speechSynthesis.speak(u);
  if(!voice&&!warned){setTimeout(()=>{loadVoice();if(!voice&&!warned){warned=true;toast("没听到声音？请把手机音量调大，或用 Chrome 浏览器打开")}},1500)}
 }catch(e){if(!warned){warned=true;toast("这里不支持发音，请用 Chrome / Safari 浏览器打开")}}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b){e.stopPropagation();say(b.dataset.say)}});
const sb=t=>`<button class="say" data-say="${esc(t)}" aria-label="朗读 ${esc(t)}">${SPK}</button>`;

 }
 if(id==="sen"){
  for(const [, ,e,z] of pick(PAT,4))Q.push({k:"build",p:"把单词排成正确的句子",z,a:e,words:shuf(e.replace(/[.!?]$/,"").split(" "))});

 }
 if(id==="tense"){

 }
 if(id==="be"){
  for(const [s,z,a] of pick(BE_Q,4))Q.push({k:"choice",p:blank(s),z,say:s.replace("___",a),o:/^[A-Z]/.test(a)?["Am","Is","Are"]:["am","is","are"],a});
  for(const [s,z,a] of pick(PREP_Q,4))Q.push({k:"choice",p:blank(s),z,say:s.replace("___",a),o:a==="to"||a==="past"?["at","to","past","in"]:["in","on","at"],a});
  for(const [s,z,a,o] of pick(BARE_Q,2))Q.push({k:"choice",p:blank(s),z,say:s.replace("___",a),o:shuf(o),a,two:true});
 }
 if(id==="plural"){
  const plo=(w,a)=>shuf([a,...[...new Set([w+"s",w+"es",w.replace(/y$/,"ies"),w.replace(/fe?$/,"ves"),w,w+"ies"])].filter(x=>x!==a).slice(0,3)]);
  for(const [w,a,z] of pick(PL,6))Q.push({k:"choice",p:`<span class="en">${w}</span>`,z:`${z} —— 复数形式是？`,say:a,o:plo(w,a),a});

  for(const [s,z,a,o] of pick(CMP_Q,3))Q.push({k:"choice",p:blank(s),z,say:s.replace("___",a),o:shuf(o),a,two:true});
 }
 return shuf(Q).slice(0,10);

function bindGame(){

 if(q.k==="listen")setTimeout(()=>say(q.say),300);
 if(q.k==="listen"||q.k==="choice"){
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
   const v=b.dataset.o;const ok=q.cat?q.all.some(x=>x[0]===v&&x[1]===q.cat):v===q.a;
   const right=q.cat?[...document.querySelectorAll("[data-o]")].find(x=>q.all.some(y=>y[0]===x.dataset.o&&y[1]===q.cat)):[...document.querySelectorAll("[data-o]")].find(x=>x.dataset.o===q.a);
   document.querySelectorAll("[data-o]").forEach(x=>x.disabled=true);
   b.classList.add(ok?"ok":"no");if(!ok&&right)right.classList.add("ok");
   if(q.say&&q.k==="choice")say(q.say);
   const ans=q.cat?right.dataset.o:q.a;
   answer(ok,ok?(q.ex||""):`正确答案：${ans}${q.show?"（"+q.show+"）":""}${q.ex?"。"+q.ex:""}`);
  });
 }
 if(q.k==="match"){
  let selL=null,left=q.pairs.length,err=0;
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-l]").forEach(x=>x.classList.remove("sel"));selL=b;b.classList.add("sel");if(/[a-z]/i.test(b.dataset.l))say(b.dataset.l)});
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
   if(!selL){toast("先点左边的一个");return}
   const ok=q.pairs.some(p=>p[0]===selL.dataset.l&&p[1]===b.dataset.r);
   if(ok){selL.classList.remove("sel");selL.classList.add("done");b.classList.add("done");selL=null;if(--left===0)answer(err===0,err?`配对时错了 ${err} 次`:"全部配对正确！")}
   else{err++;b.classList.add("no");setTimeout(()=>b.classList.remove("no"),400);if(err===1){G.miss++;}}
  });
 }
 if(q.k==="build"){
  const ans=$("#ans");let seq=[];
  const paint=()=>{ans.innerHTML=seq.map(j=>`<button class="chip" data-x="${j}">${esc(q.words[j])}</button>`).join("");
   document.querySelectorAll("[data-w]").forEach(b=>b.classList.toggle("used",seq.includes(+b.dataset.w)));
   ans.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{seq=seq.filter(x=>x!==+b.dataset.x);paint()})};
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{seq.push(+b.dataset.w);say(q.words[+b.dataset.w]);paint()});
  $("#chk").onclick=()=>{if(seq.length<q.words.length){toast("把所有单词都用上");return}
   const got=seq.map(j=>q.words[j]).join(" ").toLowerCase(),want=q.a.replace(/[.!?]$/,"").toLowerCase();
   $("#chk").disabled=true;say(q.a);answer(got===want,got===want?q.a:`正确句子：${q.a}`)};
 }
}
function answer(ok,msg){
 const q=G.qs[G.i];
 if(!ok){G.hearts--;G.miss++;G.wrongs.push(q);addWrong(q)}else if(G.review)removeWrong(q);
 const fb=$("#fb");fb.className="fb show "+(ok?"good":"wrong");
 $("#fbh").textContent=ok?["太棒了！","答对了！","真厉害！","完全正确！"][Math.random()*4|0]:"差一点～";
 $("#fbp").textContent=msg||"";
 $("#fbn").textContent=G.hearts<=0?"看结果":"继续";
 $("#fbn").onclick=()=>{fb.className="fb";if(G.hearts<=0||G.i+1>=G.qs.length)finish();else{G.i++;render()}};
}
const qid=q=>q.k+"|"+(q.p||"")+"|"+(q.a||q.cat||"")+"|"+(q.say||"");
function addWrong(q){if(q.k==="match")return;const id=qid(q);if(!S.wrong.some(w=>qid(w)===id)){S.wrong.push(q);if(S.wrong.length>80)S.wrong.shift();save()}}
function removeWrong(q){const id=qid(q);S.wrong=S.wrong.filter(w=>qid(w)!==id);save()}
function finish(){
 const pass=G.hearts>0;let st=0;
 if(pass){st=G.miss===0?3:G.miss<=2?2:1;if(G.unit){S.stars[G.unit]=Math.max(S.stars[G.unit]||0,st)}
  if(!S.days.includes(today()))S.days.push(today());if(S.days.length>400)S.days=S.days.slice(-400);save()}
 G.done={pass,st};go("end");
}
function endPage(){
 const {pass,st}=G.done;const ui=UNITS.findIndex(u=>u.id===G.unit);const next=ui>=0&&ui<UNITS.length-1&&pass?ui+1:-1;
 return `<div style="height:30px"></div><div class="card end pop">
 <div class="s">${pass?stars(st):"💔"}</div>
 <h2>${pass?(G.review?"复习完成！":st===3?"满分通关！":"通关成功！"):"爱心用完了"}</h2>
 <p style="color:var(--soft)">${pass?`答错 ${G.miss} 次${G.wrongs.length?"，错题已放进错题本":""}`:"别灰心，先回去看看「学习」，再来挑战"}</p>
 ${G.wrongs.length?`<div style="text-align:left;margin:12px 0">${G.wrongs.filter(q=>q.k!=="match").slice(0,5).map(q=>`<div class="row"><div><div class="ex">${q.p.replace(/<[^>]+>/g,"").replace("?","___")}</div><div class="z">答案：${esc(q.a||q.cat)}</div></div></div>`).join("")}</div>`:""}
 ${next>0?`<button class="big b1" id="nextU">下一关：${UNITS[next].t} →</button>`:""}
 <button class="big b3" id="again">${pass?"再玩一次":"再试一次"}</button>
 <button class="big b2 dk" id="home">回到地图</button></div>`;
}
function wrongPage(){
 return `<div class="top"><button class="back" id="back" aria-label="返回">‹</button><h1 style="font-size:22px">📕 错题本</h1></div>
 <div class="card">${S.wrong.length?`<p style="margin-top:0">共 ${S.wrong.length} 道错题。复习时答对就会自动移出错题本。</p>
 <button class="big b3" id="review">开始复习</button>
 ${S.wrong.slice().reverse().slice(0,30).map(q=>`<div class="row"><div><div class="ex">${q.p.replace(/<[^>]+>/g,"").replace("?","___")}</div><div class="z">${q.z?esc(q.z.replace(/<[^>]+>/g,""))+" · ":""}答案：${esc(q.a||q.cat)}</div></div></div>`).join("")}`
 :`<div class="empty">还没有错题，继续加油！</div>`}</div>`;
}

/* ---------- 渲染 ---------- */
function render(){
 roadObs.disconnect();
 const a=$("#app");
 if(view==="home")a.innerHTML=home();
 else if(view==="unit")a.innerHTML=unitPage(cur);
 else if(view==="learn")a.innerHTML=learnPage(cur);
 else if(view==="all")a.innerHTML=allTenses();
 else if(view==="game")a.innerHTML=gamePage();
 else if(view==="end")a.innerHTML=endPage();
 else if(view==="wrong")a.innerHTML=wrongPage();
 const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
 if(view==="home"){
  document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(!unlocked(i)){toast("先在上一关拿到至少 1 颗星 ⭐");return}go("unit",i)});
  on("goWrong",()=>go("wrong"));on("goAll",()=>go("all","home"));
  drawRoad();roadObs.observe($("#map"));
 }
 if(view==="unit"){on("back",()=>go("home"));on("learn",()=>go("learn",cur));on("play",()=>start(gen(UNITS[cur].id),UNITS[cur].id))}
 if(view==="learn"){on("back",()=>go("unit",cur));on("play",()=>start(gen(UNITS[cur].id),UNITS[cur].id));on("goAll2",()=>go("all",cur))}
 if(view==="all")on("back",()=>cur==="home"?go("home"):go("learn",cur));
 if(view==="wrong"){on("back",()=>go("home"));on("review",()=>{start(shuf(S.wrong).slice(0,10),null);G.review=true;G.hearts=99})}
 if(view==="game"){if(G.review)$(".hearts").textContent="复习";on("quit",()=>{$("#fb").className="fb";go("home")});bindGame()}
 if(view==="end"){on("home",()=>go("home"));
  on("again",()=>{if(G.review){go("wrong")}else{const u=UNITS.findIndex(x=>x.id===G.unit);start(gen(G.unit),G.unit)}});
  on("nextU",()=>go("unit",UNITS.findIndex(u=>u.id===G.unit)+1))}
}
render();
/* 安卓返回键：先退回上一层页面 */
window.onAndroidBack=()=>{if(view==="home")return false;$("#fb").className="fb";
 if(view==="learn")go("unit",cur);else if(view==="all")cur==="home"?go("home"):go("learn",cur);else go("home");return true};
}
</script>
