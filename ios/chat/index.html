<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="译聊">
<meta name="theme-color" content="#EEF1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101514" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>译聊</title>
<style>
/* Layout: lobby = single column form; chat = full-height column — header / scrolling message list / composer. */
:root{
  --bg:#eef1ee; --surface:#ffffff; --ink:#18201d; --muted:#66706b; --line:#d9dfdb;
  --accent:#0e7c6b; --accent-ink:#ffffff; --mine:#0e7c6b; --mine-ink:#ffffff; --bubble:#ffffff;
  --tr-bg:#e3f1ec; --tr-ink:#0a5c4f; --warn:#b4532a; --shadow:0 1px 2px rgba(20,40,30,.08);
  --body:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101514; --surface:#18201e; --ink:#e6ece9; --muted:#95a19b; --line:#29332f;
  --accent:#2fb39d; --accent-ink:#06231d; --mine:#1d8a78; --mine-ink:#f2fffb; --bubble:#1c2523;
  --tr-bg:#15332d; --tr-ink:#8fe3d3; --warn:#e98a62; --shadow:none; color-scheme:dark}}
[hidden]{display:none!important}
:root{--scale:1}
html{font-size:calc(16px * var(--scale))}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:.94rem;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* lobby */
#lobby{min-height:100%;padding:max(28px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.lob{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:15px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:1.5rem;letter-spacing:-.04em;flex:none}
.brand h1{margin:0;font-size:1.7rem;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.82rem;color:var(--muted);font-weight:600}
.field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:.85rem;color:var(--ink)}
.primary{padding:13px;border-radius:11px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.02rem}
.primary:disabled{opacity:.5}
.err{color:var(--warn);font-size:.86rem;margin:0;min-height:1.2em}
.notes{color:var(--muted);font-size:.8rem;line-height:1.65;display:flex;flex-direction:column;gap:6px}
.notes b{color:var(--ink)}

/* chat */
#chat{height:100%;display:flex;flex-direction:column}
.head{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.iconbtn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.htitle{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:0;text-align:start}
.htitle b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.htitle span{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:#2fbf71}.dot.bad{background:var(--warn)}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:2px;
  padding:12px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.7;padding:20px}
.day{align-self:center;font-size:.74rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:2px 10px;border-radius:999px;margin:10px 0 6px}
.sys{align-self:center;font-size:.76rem;color:var(--muted);margin:6px 0}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%;margin-top:8px}
.msg.cont{margin-top:2px}
.msg.cont .av{visibility:hidden}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.9rem}
.col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:min(78%,520px)}
.meta{font-size:.74rem;color:var(--muted);display:flex;gap:6px;align-items:baseline;padding:0 4px}
.meta .ln{font-size:.68rem;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.msg.cont .meta{display:none}
.bub{background:var(--bubble);border:1px solid var(--line);border-radius:16px;border-end-start-radius:5px;padding:8px 11px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.bub .tx{font-size:1rem}
.bub .orig{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);font-size:.84rem;color:var(--muted)}
.bub .tr{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:700;color:var(--tr-ink);background:var(--tr-bg);border-radius:4px;padding:1px 6px;margin-bottom:4px}
.bub .act{background:none;border:0;padding:0;margin-top:6px;font-size:.78rem;color:var(--accent);font-weight:600;display:block}
.bub .busy{font-size:.78rem;color:var(--muted);margin-top:5px}
.msg.me{flex-direction:row-reverse}
.msg.me .col{align-items:flex-end}
.msg.me .bub{background:var(--mine);color:var(--mine-ink);border-color:transparent;border-radius:16px;border-end-end-radius:5px}
.msg.me .meta{flex-direction:row-reverse}
.msg.me .av{display:none}
.msg.me .bub .orig{border-top-color:rgba(255,255,255,.35);color:inherit;opacity:.88}
.msg.me .bub .tr{background:rgba(255,255,255,.2);color:inherit;margin:0 4px 0 0;vertical-align:1px}
.msg.me .bub .act{color:inherit;text-decoration:underline}
.msg.me .bub .busy{color:inherit;opacity:.8}
.msg .time{font-size:.68rem;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums}
.compose{flex:none;display:flex;gap:8px;align-items:flex-end;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.compose textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:9px 14px;font-size:1rem;line-height:1.4;max-height:7.5em;min-height:40px}
.send{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4}
.send svg{width:20px;height:20px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:80%;overflow-y:auto;display:flex;flex-direction:column;gap:14px;
  padding:16px max(18px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet h2{margin:0;font-size:1.1rem}
.mem{display:flex;align-items:center;gap:10px;padding:6px 0}
.mem .av{width:36px;height:36px}
.mem b{display:block;font-size:.98rem}
.mem small{color:var(--muted);font-size:.8rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
[dir="rtl"] .switch[aria-checked="true"]::after{transform:translateX(-20px)}
[dir="rtl"] .send svg{transform:scaleX(-1)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-width:0;padding:9px 4px;border:0;background:var(--bg);color:var(--ink);font-weight:600;line-height:1.1}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[data-fs="auto"]{flex:2.2;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.flabel{font-size:.82rem;color:var(--muted);font-weight:600}
.ask{border:1px solid var(--warn);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ask p{margin:0;line-height:1.5}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.ghost{padding:12px;border-radius:11px;border:1px solid var(--line);background:none;font-weight:600}
.danger{color:var(--warn)}
.compose{position:relative}
.attach{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--accent);display:grid;place-items:center;flex:none;padding:0}
.attach svg{width:28px;height:28px}
.amenu{position:absolute;bottom:calc(100% + 6px);inset-inline-start:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;padding:6px;z-index:5;min-width:150px}
.amenu button{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;font-weight:600;border-radius:9px;text-align:start;color:var(--ink)}
.amenu button svg{width:22px;height:22px;color:var(--accent);flex:none}
.bub.mb{padding:4px;overflow:hidden}
.media{display:block;width:min(240px,62vw);max-width:100%;height:auto;max-height:340px;border-radius:12px;background:#000;object-fit:cover}
img.media{cursor:zoom-in}
.mph{position:relative;display:grid;place-items:center;width:min(240px,62vw);max-width:100%;max-height:340px;min-height:120px;border:0;border-radius:12px;background:#2a3330;overflow:hidden;padding:0;color:#fff}
.mph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(6px) brightness(.7);transform:scale(1.15)}
.mph span{position:relative;font-size:.85rem;font-weight:700;background:rgba(0,0,0,.5);padding:7px 13px;border-radius:999px}
.mprog{font-size:.76rem;padding:5px 8px 3px;opacity:.9}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:rgba(20,28,25,.9);color:#fff;padding:8px 14px;border-radius:999px;font-size:.86rem;z-index:40;pointer-events:none;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
</style>
</head>
<body>

<section id="lobby">
  <div class="lob">
    <div class="brand"><div class="logo">译</div><div><h1>译聊</h1><p id="t_sub"></p></div></div>
    <div class="form">
      <div class="field"><label for="nickIn" id="t_nick"></label><input id="nickIn" maxlength="16" autocomplete="off"></div>
      <div class="field"><label for="langSel" id="t_lang"></label><select id="langSel"></select></div>
      <div class="field"><label for="roomIn" id="t_room"></label><input id="roomIn" maxlength="40" autocomplete="off" enterkeyhint="go">
        <div class="chips" id="recent"></div></div>
      <p class="err" id="lobbyErr"></p>
      <button class="primary" id="joinBtn"></button>
    </div>
    <div class="notes" id="notes"></div>
  </div>
</section>

<section id="chat" hidden>
  <header class="head">
    <button class="htitle" id="titleBtn"><b id="roomLbl"></b><span><i class="dot" id="netDot"></i><span id="onlineLbl"></span></span></button>
    <button class="iconbtn" id="setBtn" aria-label="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="list" id="list"></div>
  <div class="compose">
    <button class="attach" id="attachBtn" aria-label="photo or video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v9M7.5 12h9"/></svg></button>
    <div class="amenu" id="attachMenu" hidden>
      <button id="pickImgBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5.5-5 4 3.5 2.5-2 4 3.5"/></svg><span id="t_photo"></span></button>
      <button id="pickVidBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3z"/></svg><span id="t_video"></span></button>
    </div>
    <input type="file" id="pickImg" accept="image/*" multiple hidden>
    <input type="file" id="pickVid" accept="video/*" hidden>
    <textarea id="textIn" dir="auto" rows="1" maxlength="1000" enterkeyhint="send"></textarea>
    <button class="send" id="sendBtn" aria-label="send" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.4-7.5c.8-.4.8-1.5 0-1.8L3.4 3.6c-.7-.3-1.4.3-1.3 1l1 6.1 9.4 1.3-9.4 1.3-1 6.1c-.1.7.6 1.3 1.3 1z"/></svg></button>
  </div>
</section>

<div class="scrim" id="memSheet" hidden><div class="sheet"><h2 id="memTitle"></h2><div id="memList"></div><button class="ghost" data-close id="t_close1"></button></div></div>
<div class="scrim" id="setSheet" hidden><div class="sheet">
  <h2 id="t_settings"></h2>
  <div class="field"><label for="langSel2" id="t_mylang"></label><select id="langSel2"></select></div>
  <div class="field"><span class="flabel" id="t_font"></span>
    <div class="seg" id="fontSeg" role="group" aria-labelledby="t_font">
      <button data-fs="auto" id="t_fontAuto"></button>
      <button data-fs="0.88" aria-label="88%"><span style="font-size:.8rem">A</span></button>
      <button data-fs="1" aria-label="100%"><span style="font-size:1rem">A</span></button>
      <button data-fs="1.18" aria-label="118%"><span style="font-size:1.2rem">A</span></button>
      <button data-fs="1.36" aria-label="136%"><span style="font-size:1.4rem">A</span></button>
      <button data-fs="1.6" aria-label="160%"><span style="font-size:1.6rem">A</span></button>
    </div></div>
  <div class="row"><span id="t_auto"></span><button class="switch" id="autoSw" role="switch" aria-checked="true" aria-labelledby="t_auto"></button></div>
  <p class="notes" id="t_trnote" style="margin:0"></p>
  <div class="row"><span id="t_sound"></span><button class="switch" id="soundSw" role="switch" aria-checked="true" aria-labelledby="t_sound"></button></div>
  <div id="battBox" class="field" hidden><button class="ghost" id="battBtn"></button><p class="notes" id="t_battTip" style="margin:0"></p></div>
  <button class="ghost danger" id="leaveBtn"></button>
  <div id="leaveAsk" class="ask" hidden><p id="t_leaveQ"></p><div class="row2"><button class="ghost danger" id="leaveYes"></button><button class="ghost" id="leaveNo"></button></div></div>
  <button class="ghost" data-close id="t_close2"></button>
</div></div>
<div class="toast" id="toast" hidden></div>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt=""></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const enc=new TextEncoder(),dec=new TextDecoder();
const rid=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b&31]).join('');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const myId=store.get('chat-id',null)||(()=>{const v=rid(14);store.set('chat-id',v);return v;})();

/* ================= LANGUAGES & UI TEXT ================= */
const LANGS=[['zh-CN','简体中文'],['zh-TW','繁體中文'],['en','English'],['ms','Bahasa Melayu'],['id','Bahasa Indonesia'],['ta','தமிழ்'],['th','ไทย'],['vi','Tiếng Việt'],['tl','Filipino'],['ja','日本語'],['ko','한국어'],['hi','हिन्दी'],['ne','नेपाली'],['ar','العربية'],['ru','Русский'],['es','Español'],['fr','Français'],['de','Deutsch'],['pt','Português']];
const LNAME=Object.fromEntries(LANGS);
function guessLang(){
  const n=(navigator.language||'en').toLowerCase();
  if(n.startsWith('zh'))return /tw|hk|mo|hant/.test(n)?'zh-TW':'zh-CN';
  const two=n.slice(0,2);if(two==='fi'&&n.startsWith('fil'))return 'tl';
  return LANGS.find(l=>l[0]===two)?two:'en';
}
const TXT={
  'zh-CN':{sub:'多人聊天，消息自动翻译成你的语言',nick:'昵称',nickPh:'别人看到的名字',lang:'我的语言',room:'房间名',roomPh:'例如：家人群、mygroup2026',join:'进入房间',
    needNick:'请先填写昵称',needRoom:'请填写房间名',online:'{n} 人在线',connecting:'连接中…',offline:'网络断开，正在重连',members:'在线成员（{n}）',you:'你',
    settings:'设置',mylang:'我的语言（消息会翻译成这种语言）',auto:'自动翻译别人的消息',leave:'离开房间',close:'关闭',typePh:'输入消息',

const nativeWait={};let nativeSeq=0;
window.__httpCb=(id,body)=>{const p=nativeWait[id];if(!p)return;delete nativeWait[id];body==null?p.rej(new Error('native http failed')):p.res(body);};
function nativeGet(url){
  return new Promise((res,rej)=>{const id='h'+(++nativeSeq);nativeWait[id]={res,rej};
    try{Android.httpGet(id,url);}catch(e){delete nativeWait[id];rej(e);return;}
    setTimeout(()=>{if(nativeWait[id]){delete nativeWait[id];rej(new Error('timeout'));}},15000);});
}
async function getText(url){
  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
    const r=await fetch(url,{signal:ctl.signal});clearTimeout(to);
    if(!r.ok)throw new Error('HTTP '+r.status);return await r.text();
  }catch(e){
    if(window.Android&&typeof Android.httpGet==='function')return nativeGet(url);
    throw e;
  }
}
async function trGoogle(text,tl){
  const u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl='+encodeURIComponent(tl)+'&dt=t&q='+encodeURIComponent(text);
  const d=JSON.parse(await getText(u));

}

async function trGoogleAlt(text,tl){
  const u='https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=auto&tl='+encodeURIComponent(tl)+'&q='+encodeURIComponent(text);
  const d=JSON.parse(await getText(u));
  if(Array.isArray(d)){const f=d[0];if(Array.isArray(f)&&typeof f[0]==='string')return{text:f[0],src:f[1]||''};if(typeof f==='string')return{text:f,src:''};}

async function trMyMemory(text,src,tl){
  if(!src)throw new Error('unknown source language');
  const u='https://api.mymemory.translated.net/get?mt=1&q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(src+'|'+tl);
  const d=JSON.parse(await getText(u));
  if(String(d.responseStatus)!=='200')throw new Error('mymemory '+d.responseStatus);
  const mt=(d.matches||[]).find(m=>m&&(m['created-by']==='MT!'||/machine translation/i.test(m.reference||'')));

const LANG_SCRIPT={'zh-CN':'han','zh-TW':'han',ja:'kana',ko:'hangul',ru:'cyr',ar:'arab',hi:'deva',ne:'deva',ta:'tamil',th:'thai'};
function scriptCounts(t){
  const c={han:0,kana:0,hangul:0,latin:0,cyr:0,arab:0,deva:0,tamil:0,thai:0};
  for(const ch of t){const k=ch.codePointAt(0);
    if((k>=0x4e00&&k<=0x9fff)||(k>=0x3400&&k<=0x4dbf))c.han++;
    else if(k>=0x3040&&k<=0x30ff)c.kana++;
    else if((k>=0xac00&&k<=0xd7af)||(k>=0x1100&&k<=0x11ff))c.hangul++;
    else if((k>=65&&k<=90)||(k>=97&&k<=122)||(k>=0xc0&&k<=0x24f)||(k>=0x1e00&&k<=0x1eff))c.latin++;
    else if(k>=0x400&&k<=0x4ff)c.cyr++;
    else if(k>=0x600&&k<=0x6ff)c.arab++;
    else if(k>=0x900&&k<=0x97f)c.deva++;
    else if(k>=0xb80&&k<=0xbff)c.tamil++;
    else if(k>=0xe00&&k<=0xe7f)c.thai++;}
  return c;
}
function looksLike(text,lang){
  const c=scriptCounts(text),total=Object.values(c).reduce((a,b)=>a+b,0);

  if(want==='kana')return c.kana>0&&(c.kana+c.han)/total>=.5;
  if(want==='han')return c.kana===0&&c.han/total>=.5;
  return c[want]/total>=.5;
}

const hex=buf=>Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('');

const normRoom=r=>r.trim().replace(/\s+/g,' ').toLowerCase();
async function roomKeys(room){

async function seal(obj){

    return new Promise((res,rej)=>{
      let done=false;const fin=(ok,e)=>{if(done)return;done=true;clearTimeout(to);ok?res():rej(e);};
      const to=setTimeout(()=>{fin(false,new Error('timeout'));try{this.ws&&this.ws.close();}catch(e){}},9000);
      this._open(()=>fin(true),e=>fin(false,e));
    });
  }
  _open(onUp,onFail){
    let ws;try{ws=new WebSocket(this.url,['mqtt']);}catch(e){onFail&&onFail(e);return;}

    ws.onopen=()=>{ws.send(mqPacket(0x10,[...mqStr('MQTT'),4,0x02,0,120,...mqStr('zch_'+rid(12))]));};

      const was=this.up;this.up=false;clearInterval(this.ping);

      if(was)try{this.onState&&this.onState();}catch(e){}

    };
  }
  _packet(head,body,onUp,onFail){

    }
  }
  _send(u8){try{if(this.ws&&this.ws.readyState===1)this.ws.send(u8);}catch(e){}}
  _sub(topic){const id=(this.pid++&0xffff)||1;this._send(mqPacket(0x82,[id>>8,id&255,...mqStr(topic),0]));}
  subscribe(topic){this.subs.add(topic);if(this.up)this._sub(topic);}

// Uses every broker at once and de-duplicates, so a room still works if one public server is down.
class Net{
  constructor(onMsg,onState){this.cs=BROKERS.map(u=>new Mqtt(u,onMsg,onState));}
  start(){return Promise.any(this.cs.map(c=>c.connect()));}
  get up(){return this.cs.some(c=>c.up);}
  subscribe(t){this.cs.forEach(c=>c.subscribe(t));}
  publish(t,o,r){this.cs.forEach(c=>c.publish(t,o,r));}
  close(){this.cs.forEach(c=>c.close());}
  kick(){this.cs.forEach(c=>{if(!c.up&&!c.ws&&!c.closed)c._open(null,null);});}
  async drain(){for(let k=0;k<400;k++){if(this.cs.every(c=>!c.ws||c.ws.bufferedAmount<768*1024))return;await sleep(25);}}

    const miss=[];if(st.parts)for(let i=0;i<st.n&&miss.length<400;i++)if(!st.parts[i])miss.push(i);

    const sc=Math.min(1,IMG_MAX/Math.max(w,h)),W=Math.round(w*sc),H=Math.round(h*sc);
    const c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(img,0,0,W,H);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
    return{blob:blob&&blob.size<file.size?blob:file,mime:blob&&blob.size<file.size?'image/jpeg':(file.type||'image/jpeg'),w:W,h:H,thumb};
  }finally{URL.revokeObjectURL(u);}
}
function prepVideo(file){
  return new Promise(res=>{
    const v=document.createElement('video'),u=URL.createObjectURL(file);let done=false;
    const fin=thumb=>{if(done)return;done=true;const o={w:v.videoWidth||0,h:v.videoHeight||0,dur:isFinite(v.duration)?v.duration:0,thumb:thumb||''};URL.revokeObjectURL(u);res(o);};
    v.muted=true;v.playsInline=true;v.preload='auto';
    v.onloadeddata=()=>{try{v.currentTime=Math.min(.1,(v.duration||1)/2);}catch(e){fin('');}};
    v.onseeked=()=>{let t='';try{if(v.videoWidth)t=thumbOf(v,v.videoWidth,v.videoHeight,120);}catch(e){}fin(t);};
    v.onerror=()=>fin('');setTimeout(()=>fin(''),6000);v.src=u;
  });
}
async function sendMedia(file,kind){
  if(!R||!file)return;const t=T();
  if(kind==='vid'&&file.size>MAX_VIDEO_MB*1048576){toast(fmt(t.tooBig,MAX_VIDEO_MB));return;}
  const sess=R;let blob=file,meta;
  try{
    if(kind==='img'){const r=await prepImage(file);blob=r.blob;meta={kind,mime:r.mime,w:r.w,h:r.h,dur:0,thumb:r.thumb};}
    else{const r=await prepVideo(file);meta={kind,mime:file.type||'video/mp4',w:r.w,h:r.h,dur:r.dur,thumb:r.thumb};}
  }catch(e){toast(t.mediaFail);return;}
  if(R!==sess)return;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},R.key,await blob.arrayBuffer()));
  if(R!==sess)return;
  const mid=rid(16),n=Math.ceil(ct.length/CHUNK);
  Object.assign(meta,{mid,iv:b64(iv),n,size:ct.length});
  await idbPut({mid,cipher:new Blob([ct]),n});
  const st=getMS(mid);st.url=URL.createObjectURL(blob);st.status='ok';st.sending=0;
  const m={id:rid(16),uid:myId,name:R.nick,lang:myLang,text:'',ts:Date.now(),media:meta};
  R.seen.add(m.id);R.pending.add(m.id);R.msgs.push(m);store.set('chat-h-'+R.topic,R.msgs.slice(-HIST_KEEP));
  render(true);
  R.net.publish(R.topic+'/m',await seal(m));
  await publishHist();
  let last=0;
  await sendChunks(mid,ct,null,f=>{const p=Math.round(f*100);if(p-last>=4||p===100){last=p;st.sending=p;patchMsg(m.id);}});
  st.sending=null;patchMsg(m.id);
  setTimeout(()=>{if(R===sess&&R.pending.has(m.id)){R.pending.delete(m.id);patchMsg(m.id);}},4000);
}

/* ================= RENDER ================= */
function show(id){$('lobby').hidden=id!=='lobby';$('chat').hidden=id!=='chat';closeSheets();}
function fmtTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtDay(ts){
  const d=new Date(ts),n=new Date(),y=new Date(Date.now()-864e5);
  if(d.toDateString()===n.toDateString())return T().today;
  if(d.toDateString()===y.toDateString())return T().yesterday;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function bubbleInner(m){
  const mine=m.uid===myId,t=T();
  if(m.media)return mediaHTML(m);
  if(!needsTr(m))return `<div class="tx" dir="auto">${esc(m.text)}</div>`;
  const k=m.id+'|'+myLang,tr=TR[k];
  if(mine){ // my own words stay on top; the translation into my current language goes underneath
    if(tr&&tr.s==='ok')return `<div class="tx" dir="auto">${esc(m.text)}</div><div class="orig mytr" dir="auto"><span class="tr">${t.trans}</span> ${esc(tr.t)}</div>`;
    if(tr&&tr.s==='busy')return `<div class="tx" dir="auto">${esc(m.text)}</div><div class="busy">${t.translating}</div>`;
    if(tr&&tr.s==='fail')return `<div class="tx" dir="auto">${esc(m.text)}</div><button class="act fail" data-tr="${m.id}">${t.trFail}</button>`;
    if(tr&&tr.s==='same')return `<div class="tx" dir="auto">${esc(m.text)}</div>`;
    return `<div class="tx" dir="auto">${esc(m.text)}</div><button class="act" data-tr="${m.id}">${t.tapTr}</button>`;
  }
  if(tr&&tr.s==='ok')return `<span class="tr">${t.trans} · ${esc(LNAME[m.lang]||m.lang)}</span><div class="tx" dir="auto">${esc(tr.t)}</div><div class="orig" dir="auto">${esc(m.text)}</div>`;
  if(tr&&tr.s==='same')return `<div class="tx" dir="auto">${esc(m.text)}</div>`;
  if(tr&&tr.s==='busy')return `<div class="tx" dir="auto">${esc(m.text)}</div><div class="busy">${t.translating}</div>`;
  if(tr&&tr.s==='fail')return `<div class="tx" dir="auto">${esc(m.text)}</div><button class="act fail" data-tr="${m.id}">${t.trFail}</button>`;
  return `<div class="tx" dir="auto">${esc(m.text)}</div><button class="act" data-tr="${m.id}">${t.tapTr}</button>`;
}
function msgHTML(m,prev){
  const mine=m.uid===myId,cont=prev&&prev.uid===m.uid&&m.ts-prev.ts<180000&&new Date(prev.ts).toDateString()===new Date(m.ts).toDateString();
  const pend=R.pending.has(m.id);
  return `<div class="msg${mine?' me':''}${cont?' cont':''}" data-id="${m.id}">
    <div class="av" style="background:${colorFor(m.uid||m.name)}">${esc((m.name||'?').trim().charAt(0).toUpperCase())}</div>
    <div class="col"><div class="meta"><span>${esc(m.name)}</span>${m.lang&&!mine?`<span class="ln">${esc(LNAME[m.lang]||m.lang)}</span>`:''}</div>
    <div class="bub${m.media?' mb':''}">${bubbleInner(m)}</div><span class="time">${pend?T().sending+' · ':''}${fmtTime(m.ts)}</span></div></div>`;
}
const bubbleCache=new Map();
function render(forceBottom){
  if(!R)return;
  const L=$('list'),nearBottom=L.scrollHeight-L.scrollTop-L.clientHeight<120;
  if(!R.msgs.length){L.innerHTML=`<div class="empty">${esc(T().empty).replace(/\n/g,'<br>')}</div>`;return;}
  const ids=R.msgs.map(m=>m.id),old=R.rendered||[];
  const appendOnly=old.length&&ids.length>old.length&&old.every((id,i)=>ids[i]===id)&&L.querySelector('.msg');
  let h='',prev=null,lastDay='';
  const start=appendOnly?old.length:0;
  if(appendOnly){prev=R.msgs[start-1];lastDay=fmtDay(prev.ts);}
  for(let i=start;i<R.msgs.length;i++){const m=R.msgs[i],day=fmtDay(m.ts);if(day!==lastDay){h+=`<div class="day">${day}</div>`;lastDay=day;prev=null;}h+=msgHTML(m,prev);prev=m;}
  if(appendOnly)L.insertAdjacentHTML('beforeend',h);else{L.innerHTML=h;bubbleCache.clear();}
  R.rendered=ids;
  autoMedia();
  if(forceBottom||nearBottom)L.scrollTop=L.scrollHeight;
  autoTranslate();
}
function patchMsg(id){
  if(!R)return;const m=R.msgs.find(x=>x.id===id);const el=document.querySelector(`.msg[data-id="${id}"]`);if(!m||!el)return;
  const L=$('list'),nearBottom=L.scrollHeight-L.scrollTop-L.clientHeight<120;
  const html=bubbleInner(m);
  if(bubbleCache.get(id)!==html){el.querySelector('.bub').innerHTML=html;bubbleCache.set(id,html);}
  el.querySelector('.time').textContent=(R.pending.has(m.id)?T().sending+' · ':'')+fmtTime(m.ts);
  if(nearBottom)L.scrollTop=L.scrollHeight;
}
function autoTranslate(){
  if(!R||!store.get('chat-auto',true))return;
  const need=R.msgs.filter(needsTr);
  need.slice(-40).reverse().forEach(m=>{const k=m.id+'|'+myLang;if(!TR[k])queueTranslate(m,false);});
}
function updateHeader(){
  if(!R)return;
  const up=R.net&&R.net.up,n=1+[...R.members.values()].filter(m=>Date.now()-m.seen<55000).length;
  $('netDot').className='dot '+(up?'ok':'bad');
  $('onlineLbl').textContent=!R.net?T().connecting:up?fmt(T().online,n):T().offline;
}
function renderMembers(){
  if(!R||$('memSheet').hidden)return;
  const list=[{name:R.nick,lang:myLang,me:true,id:myId},...[...R.members.entries()].map(([id,m])=>({...m,id}))];
  $('memTitle').textContent=fmt(T().members,list.length);
  $('memList').innerHTML=list.map(m=>`<div class="mem"><div class="av" style="background:${colorFor(m.id)}">${esc((m.name||'?').charAt(0).toUpperCase())}</div><div><b>${esc(m.name)}${m.me?` <small>(${esc(T().you)})</small>`:''}</b><small>${esc(LNAME[m.lang]||m.lang||'')}</small></div></div>`).join('');
}
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200);}
const appHidden=()=>document.hidden||window.__appVisible===false;
// New message: system notification while the app is in the background, a short tone while it is open.
async function alertNew(m){
  const soundOn=store.get('chat-sound',true);
  if(appHidden()&&window.Android&&typeof Android.notify==='function'){
    let body=m.media?'['+(m.media.kind==='img'?T().photo:T().video)+']':m.text;
    if(needsTr(m)&&store.get('chat-auto',true)){
      queueTranslate(m,true);
      for(let i=0;i<25;i++){const tr=TR[m.id+'|'+myLang];if(tr&&tr.s!=='busy')break;await sleep(200);}
      const tr=TR[m.id+'|'+myLang];if(tr&&tr.s==='ok')body=tr.t;
    }
    try{Android.notify(m.name+(R?' · '+R.room:''),body,!soundOn);}catch(e){}
    return;
  }
  if(!soundOn)return;
  try{if(window.Android&&typeof Android.playTone==='function'){Android.playTone();Android.vibrate(30);return;}}catch(e){}
  ding();
}
let actx=null;
function ding(){
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}
  if(!actx)return;
  try{const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+.08);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.27);}catch(e){}
}
['pointerdown','touchend'].forEach(ev=>document.addEventListener(ev,()=>{try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}},{passive:true}));

/* ================= LOBBY ================= */
function fillLangs(sel){sel.innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');sel.value=myLang;}
function applyUIText(){
  const t=T();document.documentElement.lang=myLang;document.documentElement.dir=myLang==='ar'?'rtl':'ltr';
  $('t_sub').textContent=t.sub;$('t_nick').textContent=t.nick;$('nickIn').placeholder=t.nickPh;$('t_lang').textContent=t.lang;
  $('t_room').textContent=t.room;$('roomIn').placeholder=t.roomPh;$('joinBtn').textContent=t.join;
  $('notes').innerHTML=t.notes.map(n=>`<div>${n}</div>`).join('');
  $('t_settings').textContent=t.settings;$('t_mylang').textContent=t.mylang;$('t_auto').textContent=t.auto;$('t_trnote').textContent=t.trnote;
  $('leaveBtn').textContent=t.leave;$('t_photo').textContent=t.photo;$('t_video').textContent=t.video;$('leaveYes').textContent=t.leave;$('leaveNo').textContent=t.cancel;$('t_leaveQ').textContent=t.leaveQ;$('t_sound').textContent=t.sound;$('battBtn').textContent=t.battery;$('t_battTip').textContent=t.battTip;$('t_font').textContent=t.font;$('t_fontAuto').textContent=t.fontAuto;$('t_close1').textContent=t.close;$('t_close2').textContent=t.close;$('textIn').placeholder=t.typePh;
  renderRecent();
}
function renderRecent(){
  const rec=store.get('chat-recent',[]);
  $('recent').innerHTML=rec.length?rec.map(r=>`<button class="chip" data-room="${esc(r)}">${esc(r)}</button>`).join(''):'';
  $('recent').hidden=!rec.length;
}
function setLang(l){
  myLang=l;store.set('chat-lang',l);$('langSel').value=l;$('langSel2').value=l;applyUIText();
  if(R){render(false);updateHeader();presence('here');keepAlive(true);}
}
$('langSel').onchange=e=>setLang(e.target.value);
$('langSel2').onchange=e=>setLang(e.target.value);
$('recent').onclick=e=>{const b=e.target.closest('[data-room]');if(b)$('roomIn').value=b.dataset.room;};
async function join(){
  const t=T(),nick=$('nickIn').value.trim(),room=$('roomIn').value.trim();
  $('lobbyErr').textContent='';
  if(!nick){$('lobbyErr').textContent=t.needNick;return;}
  if(!room){$('lobbyErr').textContent=t.needRoom;return;}
  store.set('chat-nick',nick);
  const rec=store.get('chat-recent',[]).filter(r=>normRoom(r)!==normRoom(room));rec.unshift(room);store.set('chat-recent',rec.slice(0,6));
  store.set('chat-last',room);
  $('joinBtn').disabled=true;
  try{await enterRoom(room,nick);}catch(e){$('lobbyErr').textContent=String(e.message||e);show('lobby');}
  $('joinBtn').disabled=false;
}
$('joinBtn').onclick=join;
$('roomIn').addEventListener('keydown',e=>{if(e.key==='Enter')join();});

/* ================= CHAT EVENTS ================= */
const ta=$('textIn');
function grow(){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight+2,(parseFloat(getComputedStyle(ta).lineHeight)||22)*5+22)+'px';$('sendBtn').disabled=!ta.value.trim();}
ta.addEventListener('input',grow);
ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('sendBtn').click();}});
$('sendBtn').onclick=()=>{const v=ta.value;if(!v.trim())return;ta.value='';grow();sendText(v);ta.focus();};
$('attachBtn').onclick=e=>{e.stopPropagation();$('attachMenu').hidden=!$('attachMenu').hidden;};
document.addEventListener('click',e=>{if(!$('attachMenu').hidden&&!e.target.closest('#attachMenu'))$('attachMenu').hidden=true;});
$('pickImgBtn').onclick=()=>{$('attachMenu').hidden=true;$('pickImg').click();};
$('pickVidBtn').onclick=()=>{$('attachMenu').hidden=true;$('pickVid').click();};
$('pickImg').onchange=async e=>{const files=[...e.target.files];e.target.value='';for(const f of files.slice(0,9))await sendMedia(f,'img');};
$('pickVid').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)await sendMedia(f,'vid');};
// keep the newest message in view when a photo or video finishes loading
$('list').addEventListener('scroll',()=>{const L=$('list');if(R)R.atBottom=L.scrollHeight-L.scrollTop-L.clientHeight<160;},{passive:true});
['load','loadedmetadata'].forEach(ev=>$('list').addEventListener(ev,()=>{const L=$('list');if(R&&R.atBottom!==false)L.scrollTop=L.scrollHeight;},true));
$('viewer').onclick=()=>{$('viewer').hidden=true;$('viewerImg').src='';};
$('list').addEventListener('click',e=>{
  const v=e.target.closest('[data-view]');if(v){$('viewerImg').src=v.src;$('viewer').hidden=false;return;}
  const ld=e.target.closest('[data-load]');if(ld&&R){const m=findMediaMsg(ld.dataset.load);if(m){const st=getMS(m.media.mid);if(st.status!=='recv'&&st.status!=='want'){st.status='idle';st.asked=0;ensureMedia(m,true);}}return;}const b=e.target.closest('[data-tr]');if(!b||!R)return;const m=R.msgs.find(x=>x.id===b.dataset.tr);if(m){delete TR[m.id+'|'+myLang];queueTranslate(m,true);patchMsg(m.id);}});
function closeSheets(){$('memSheet').hidden=true;$('setSheet').hidden=true;$('leaveAsk').hidden=true;$('leaveBtn').hidden=false;}
document.querySelectorAll('.scrim').forEach(s=>s.addEventListener('click',e=>{if(e.target===s||e.target.closest('[data-close]'))closeSheets();}));
$('titleBtn').onclick=()=>{$('memSheet').hidden=false;renderMembers();};
$('setBtn').onclick=()=>{$('langSel2').value=myLang;$('autoSw').setAttribute('aria-checked',store.get('chat-auto',true));$('soundSw').setAttribute('aria-checked',store.get('chat-sound',true));
  let showBatt=false;try{showBatt=!!(window.Android&&typeof Android.batteryOk==='function'&&!Android.batteryOk());}catch(e){}$('battBox').hidden=!showBatt;
  $('setSheet').hidden=false;};
$('autoSw').onclick=()=>{const v=!store.get('chat-auto',true);store.set('chat-auto',v);$('autoSw').setAttribute('aria-checked',v);if(v)autoTranslate();};
function exitToLobby(){leaveRoom();store.set('chat-last','');show('lobby');renderRecent();}
$('leaveBtn').onclick=()=>{$('leaveAsk').hidden=false;$('leaveBtn').hidden=true;};
$('leaveNo').onclick=()=>{$('leaveAsk').hidden=true;$('leaveBtn').hidden=false;};
$('leaveYes').onclick=exitToLobby;
$('soundSw').onclick=()=>{const v=!store.get('chat-sound',true);store.set('chat-sound',v);$('soundSw').setAttribute('aria-checked',v);};
$('battBtn').onclick=()=>{try{Android.askBattery();}catch(e){}};
// Back on Android: close a sheet, otherwise send the app to the background and stay in the room.
window.onAndroidBack=()=>{if(!$('viewer').hidden){$('viewer').hidden=true;return true;}if(!$('attachMenu').hidden){$('attachMenu').hidden=true;return true;}if(!$('memSheet').hidden||!$('setSheet').hidden){closeSheets();return true;}if(!$('chat').hidden)return 'bg';return false;};
function onAppVisible(){if(R){R.net.kick();hello();const L=$('list');L.scrollTop=L.scrollHeight;}}
window.onAppVisible=onAppVisible;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)onAppVisible();});

/* ================= TEXT SIZE ================= */
function systemScale(){try{if(window.Android&&typeof Android.fontScale==='function'){const v=+Android.fontScale();if(v>0)return Math.max(.8,Math.min(2,v));}}catch(e){}return 1;}
function applyFont(){
  const v=String(store.get('chat-font','auto'));
  const sc=v==='auto'?systemScale():Math.max(.8,Math.min(2,+v||1));
  const L=$('list'),bottom=L&&L.scrollHeight-L.scrollTop-L.clientHeight<120;
  document.documentElement.style.setProperty('--scale',sc);
  document.querySelectorAll('#fontSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.fs===v));
  if(bottom&&L)L.scrollTop=L.scrollHeight;
  grow();
}
$('fontSeg').addEventListener('click',e=>{const b=e.target.closest('[data-fs]');if(!b)return;store.set('chat-font',b.dataset.fs);applyFont();});
applyFont();

/* ================= START ================= */
fillLangs($('langSel'));fillLangs($('langSel2'));
$('nickIn').value=store.get('chat-nick','');
applyUIText();
const last=store.get('chat-last','');
if(last&&$('nickIn').value){$('roomIn').value=last;join();}
