<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="订阅卡包">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>订阅卡包</title>
<style>
:root{--bg:#000;--card:#141416;--card2:#1c1c1f;--line:rgba(255,255,255,.08);--tx:#f5f5f7;--sub:#8e8e93;--sub2:#636366;--acc:#0a84ff;--blue:#3b8bff;--orange:#ff9f0a;--green:#30d158;--red:#ff453a;--tab:rgba(36,36,38,.86);--sheet:#111113;--field:#1f1f22;--chip:#2a2a2d;--hero1:#3a2a5c;--hero2:#1b1b2a;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
:root[data-theme=light]{--bg:#f2f2f6;--card:#fff;--card2:#f6f6f8;--line:rgba(0,0,0,.07);--tx:#111114;--sub:#8a8a8e;--sub2:#aeaeb2;--acc:#007aff;--blue:#2f7cf6;--tab:rgba(255,255,255,.88);--sheet:#f2f2f6;--field:#fff;--chip:#e9e9ee;--hero1:#d9c8f5;--hero2:#f4effc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.view{display:none;padding:calc(var(--sat) + 14px) 18px calc(var(--sab) + 112px);max-width:560px;margin:0 auto}
.view.on{display:block;animation:vin .28s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}
.top{display:flex;align-items:center;justify-content:space-between;min-height:52px}
.hi{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0}
.round{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--acc);font-size:26px;font-weight:300;box-shadow:inset 0 0 0 1px var(--line)}
.round svg{width:20px;height:20px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 10px}
.sec h3{margin:0;font-size:17px;font-weight:700}
.sec .r{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
.muted{color:var(--sub)}
.tip{background:var(--card);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--sub);display:flex;gap:10px;align-items:center;margin-top:10px;box-shadow:inset 0 0 0 1px var(--line)}
.tip b{color:var(--tx);font-weight:600}
.tip button{margin-left:auto;color:var(--acc);font-weight:600;white-space:nowrap}
/* ---------- stacked cards ---------- */
.stack{position:relative;margin-top:4px}
.sc{position:absolute;left:0;right:0;height:248px;border-radius:26px;color:#fff;overflow:hidden;transition:top .5s cubic-bezier(.22,.9,.24,1);box-shadow:0 -6px 22px rgba(0,0,0,.32);cursor:pointer}
.sc::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.22),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.08),transparent 40%);pointer-events:none}
.sc .hd{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px;height:62px}
.sc .nm{font-size:19px;font-weight:700;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.sc .cy{font-size:12px;opacity:.82;margin-top:2px}
.sc .bd{position:absolute;left:18px;right:18px;bottom:16px;top:74px;opacity:0;transition:opacity .35s}
.sc.front .bd{opacity:1}
.sc .lab{font-size:12px;opacity:.8}
.sc .amt{font-size:38px;font-weight:700;margin-top:2px;line-height:1.1}
.sc .nx{position:absolute;right:0;top:34px;text-align:right}
.sc .nx b{display:block;font-size:17px;margin-top:3px}
.sc .st{position:absolute;left:0;bottom:0}
.sc .st b{display:block;font-size:15px;margin-top:2px;font-weight:600}
.sc .paused{position:absolute;right:16px;top:20px;font-size:11px;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:10px}
.cut{position:absolute;right:0;bottom:0;background:var(--bg);border-top-left-radius:30px;padding:9px 0 0 9px;z-index:30}
.cut::before,.cut::after{content:"";position:absolute;width:30px;height:30px;background:transparent;pointer-events:none}
.cut::before{right:0;top:-30px;border-bottom-right-radius:26px;box-shadow:12px 12px 0 12px var(--bg)}
.cut::after{left:-30px;bottom:0;border-bottom-right-radius:26px;box-shadow:12px 12px 0 12px var(--bg)}
.cut button{height:48px;border-radius:24px;background:var(--card2);display:flex;align-items:center;gap:9px;padding:0 18px 0 6px;font-weight:600;font-size:14px;box-shadow:inset 0 0 0 1px var(--line)}
.cut i{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#111}
.cut i svg{width:18px;height:18px}
.empty{border:1.5px dashed var(--sub2);border-radius:26px;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--sub);text-align:center;padding:20px}
.empty b{color:var(--tx);font-size:17px}
.empty button{margin-top:6px;background:var(--acc);color:#fff;padding:10px 20px;border-radius:20px;font-weight:600}
/* icons */
.ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;flex-shrink:0;overflow:hidden;line-height:1}
.ico.w{background:#fff !important;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.ico.sm{width:38px;height:38px;border-radius:10px;font-size:17px}
.ico.lg{width:60px;height:60px;border-radius:15px;font-size:27px}
/* list */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.row .mid{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s .soon{color:var(--orange);font-weight:600}
.row .rt{text-align:right}
.row .rt b{font-size:16px;font-weight:700;display:block}
.row .rt small{font-size:11px;color:var(--sub)}
.row.off{opacity:.5}
.sortbtn{color:var(--sub);font-size:13px;display:flex;align-items:center;gap:3px}
.sortbtn svg{width:14px;height:14px}
/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 12px);width:min(calc(100% - 28px),520px);height:66px;border-radius:33px;background:var(--tab);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);display:flex;padding:5px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 1px var(--line)}
.tabbar button{flex:1;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--sub);transition:background .25s,color .25s}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{background:var(--chip);color:var(--tx)}
.tabbar button.on.green{background:rgba(48,209,88,.16)}
/* sheets */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:calc(100vh - var(--sat) - 26px);background:var(--sheet);border-radius:26px 26px 0 0;z-index:51;transform:translateY(105%);transition:transform .42s cubic-bezier(.22,.9,.24,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--sub2);margin:8px auto 0;opacity:.6;flex-shrink:0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 6px;flex-shrink:0;gap:8px}
.sheet .sh .ttl{font-weight:700;font-size:17px;flex:1;text-align:center}
.sheet .sh .ttl.left{text-align:left}
.pill{height:38px;padding:0 16px;border-radius:19px;background:var(--card2);color:var(--acc);font-weight:600;font-size:15px;box-shadow:inset 0 0 0 1px var(--line)}
.pill.solid{background:var(--acc);color:#fff;box-shadow:none}
.pill:disabled{opacity:.4}
.sheet .sb{overflow-y:auto;padding:8px 16px calc(var(--sab) + 26px);-webkit-overflow-scrolling:touch}
.big{border-radius:24px;color:#fff;padding:18px;position:relative;overflow:hidden;min-height:200px}
.big::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.25),transparent 55%);pointer-events:none}
.big .hd{display:flex;gap:14px;align-items:center;position:relative}
.big .nm{font-size:22px;font-weight:700}
.big .cy{font-size:13px;opacity:.85;margin-top:3px}
.big .lab{font-size:13px;opacity:.85;margin-top:22px;position:relative}
.big .amt{font-size:40px;font-weight:700;position:relative}
.big .ft{display:flex;align-items:center;justify-content:space-between;margin-top:16px;position:relative;font-size:14px}
.big .ft span{display:flex;align-items:center;gap:6px}
.big .ft em{font-style:normal;font-size:12px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:12px}
.group{background:var(--card);border-radius:18px;margin-top:14px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.group .it{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;border-bottom:1px solid var(--line);font-size:15px}
.group .it:last-child{border-bottom:none}
.group .it svg{width:21px;height:21px;color:var(--sub);flex-shrink:0}
.group .it .k{flex:1}
.group .it .v{color:var(--sub);text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group .it.btn{justify-content:center;font-weight:600;color:var(--acc);cursor:pointer}
.group .it.btn.red{color:var(--red)}
.group .it.tap{cursor:pointer}
.group .it .chev{color:var(--sub2);font-size:18px}
.glabel{font-size:13px;color:var(--sub);margin:18px 6px 6px}
/* forms */
.f{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:none}
.f label{width:74px;font-size:15px;flex-shrink:0}
.f input,.f select,.f textarea{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px;padding:14px 0;text-align:right}
.f input::placeholder,.f textarea::placeholder{color:var(--sub2)}
.f select{direction:rtl;-webkit-appearance:none;appearance:none}
.f select option{direction:ltr;background:var(--sheet);color:var(--tx)}
.f input[type=date]{text-align:right;min-height:20px}
.f .cur{color:var(--sub);font-weight:600}
.f.amtf input{font-size:28px;font-weight:700;text-align:left}
.f.amtf .cur{font-size:28px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--sub);transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.segwrap{padding:10px 12px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}
.chip{padding:7px 13px;border-radius:16px;background:var(--chip);font-size:13px;font-weight:500}
.chip.on{background:var(--acc);color:#fff}
.sws{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:14px 16px}
.sw{aspect-ratio:1;border-radius:50%;position:relative}
.sw.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 0 2.5px var(--tx)}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--chip);position:relative;transition:background .2s;flex-shrink:0}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
.search{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:12px;padding:0 12px;height:40px;margin:6px 0 4px;box-shadow:inset 0 0 0 1px var(--line)}
.search input{flex:1;background:none;border:0;outline:none;font-size:15px}
.search svg{width:17px;height:17px;color:var(--sub)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;padding:12px 2px}
.preset{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;text-align:center;line-height:1.2;color:var(--tx)}
.preset .ico{width:54px;height:54px;border-radius:14px;font-size:22px}
.pick{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:none}
.pick .mid{flex:1}
.pick .t{font-weight:600}
.pick .s{font-size:12px;color:var(--sub);margin-top:2px}
.ck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--sub2);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.ck.on{background:var(--acc);box-shadow:none}
/* flow */
.monthbar{display:flex;align-items:center;gap:6px}
.monthbar button{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--sub);box-shadow:inset 0 0 0 1px var(--line)}
.monthbar button svg{width:16px;height:16px}
.monthbar b{font-size:15px;min-width:92px;text-align:center}
.sumcard{background:var(--card);border-radius:22px;padding:18px;box-shadow:inset 0 0 0 1px var(--line);margin-top:10px}
.sumcard .lab{font-size:13px;color:var(--sub)}
.sumcard .amt{font-size:34px;font-weight:700;margin-top:4px}
.sumcard .mini{display:flex;gap:18px;margin-top:10px;font-size:12px;color:var(--sub)}
.sumcard .mini b{display:block;color:var(--tx);font-size:15px;margin-top:2px}
.day{margin-top:18px}
.day .dh{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin:0 4px 8px}
.catico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.fab{position:fixed;right:max(20px,calc(50% - 260px));bottom:calc(var(--sab) + 92px);width:56px;height:56px;border-radius:50%;background:var(--orange);color:#fff;display:none;place-items:center;box-shadow:0 8px 22px rgba(255,159,10,.45);z-index:39}
.fab svg{width:26px;height:26px}
.fab.on{display:grid}
/* bills */
.hero{border-radius:24px;padding:14px;background:linear-gradient(160deg,var(--hero1),var(--hero2) 75%);box-shadow:inset 0 0 0 1px var(--line);position:relative;overflow:hidden}
.hero .seg{background:rgba(0,0,0,.18)}
:root[data-theme=light] .hero .seg{background:rgba(255,255,255,.6)}
.hero .mrow{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 0}
.hero .mrow button{display:flex;align-items:center;gap:4px;font-weight:700;font-size:15px}
.hero .mrow button svg{width:14px;height:14px}
.hero .daily{color:var(--acc);font-size:13px;font-weight:600}
.hero .amt{font-size:40px;font-weight:800;margin:6px 4px 0}
.hero .hint{font-size:12px;color:var(--sub);margin:2px 4px 0}
.hero .split{display:flex;gap:40px;margin:14px 4px 4px;font-size:12px;color:var(--sub)}
.hero .split b{display:block;color:var(--tx);font-size:16px;margin-top:3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.panel{background:var(--card);border-radius:22px;padding:16px;margin-top:14px;box-shadow:inset 0 0 0 1px var(--line)}
.panel .ph{display:flex;align-items:center;justify-content:space-between}
.panel .ph h4{margin:0;font-size:17px}
.panel .ph .seg{width:120px}
.panel .range{font-size:12px;color:var(--sub);margin-top:4px}
.panel .avg{display:flex;gap:40px;margin-top:12px;font-size:12px;color:var(--sub)}
.panel .avg b{display:block;font-size:19px;margin-top:2px}
.chart{margin-top:8px;width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:11px;color:var(--sub);margin-top:6px}
.dist .dr{margin-top:12px}
.dist .dl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.dist .dl span{color:var(--sub)}
.dist .bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.dist .bar i{display:block;height:100%;border-radius:4px}
/* calendar */
.cal{background:var(--card);border-radius:22px;padding:14px 10px;box-shadow:inset 0 0 0 1px var(--line)}
.cal .ch{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px}
.cal .ch b{font-size:19px}
.cal .ch .monthbar b{min-width:auto}
.cal .wk,.cal .gd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .wk{font-size:12px;color:var(--sub);margin-bottom:6px}
.cal .gd button{height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;gap:3px;margin:2px}
.cal .gd button b{font-size:16px;font-weight:600}
.cal .gd button small{font-size:10px;color:var(--sub)}
.cal .gd button.has small{color:var(--tx);font-weight:600}
.cal .gd button.today{box-shadow:inset 0 0 0 1.5px var(--acc)}
.cal .gd button.sel{background:var(--acc);color:#fff}
.cal .gd button.sel small{color:rgba(255,255,255,.85)}
.cal .gd button.fut b{opacity:.75}
.dayd{margin-top:14px;background:var(--card);border-radius:22px;padding:16px;box-shadow:inset 0 0 0 1px var(--line)}
.dayd .t{display:flex;justify-content:space-between;font-weight:700;font-size:17px}
.dayd .sp{display:flex;gap:40px;margin:10px 0 4px;font-size:12px;color:var(--sub)}
.dayd .sp b{display:block;color:var(--tx);font-size:14px;margin-top:2px;font-weight:600}
.dayd .ln{display:flex;align-items:center;gap:12px;padding:12px 0 2px}
.dayd .ln .mid{flex:1}
.dayd .ln .mid div{font-weight:600}
.dayd .ln .mid small{color:var(--sub);font-size:12px}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-30px);background:rgba(40,40,44,.95);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:500;opacity:0;transition:all .3s;z-index:90;pointer-events:none;max-width:86%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.confirm{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;background:rgba(0,0,0,.4)}
.confirm.on{display:flex}
.confirm .box{width:280px;background:var(--sheet);border-radius:18px;overflow:hidden;text-align:center}
.confirm .box p{margin:0;padding:20px 18px;font-size:15px;line-height:1.5}
.confirm .box div{display:flex;border-top:1px solid var(--line)}
.confirm .box button{flex:1;height:48px;font-size:16px;color:var(--acc)}
.confirm .box button+button{border-left:1px solid var(--line);font-weight:600}
.confirm .box button.red{color:var(--red)}
.soonbar{display:flex;gap:10px;overflow-x:auto;margin:4px -18px 0;padding:6px 18px 2px;scrollbar-width:none}
.soonbar::-webkit-scrollbar{display:none}
.soonc{flex-shrink:0;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:9px 14px 9px 9px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.soonc .ico{width:32px;height:32px;border-radius:9px;font-size:14px}
.soonc div{font-size:12px;color:var(--sub)}
.soonc div b{display:block;color:var(--tx);font-size:14px}
.soonc div b em{font-style:normal;color:var(--orange)}
.small{font-size:12px;color:var(--sub);line-height:1.6;margin:8px 6px}
.shotbtn{width:100%;margin-top:10px;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line);text-align:left}

const today=()=>ds(new Date());
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const WK=['日','一','二','三','四','五','六'];
const cn=s=>{const d=pd(s);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'};
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'月'+d.getDate()+'日'};
const dot=s=>s.replace(/-/g,'.');

function load(){

/* ================= subscription math ================= */
function occ(x,k){
  const b=pd(x.start);
  if(x.cycle==='week'){const d=new Date(b);d.setDate(d.getDate()+7*k);return ds(d)}
  const m={month:1,quarter:3,half:6,year:12}[x.cycle]||1;
  const tm=b.getMonth()+m*k,y=b.getFullYear()+Math.floor(tm/12),mm=((tm%12)+12)%12;
  return ds(new Date(y,mm,Math.min(b.getDate(),dim(y,mm))));
}
const inGap=(x,d)=>(x.gaps||[]).some(g=>d>=g[0]&&(!g[1]||d<g[1]));
function charges(x,a,b){const out=[];for(let k=0;k<6000;k++){const d=occ(x,k);if(d>b)break;if(d>=a&&!inGap(x,d))out.push(d)}return out}
function nextDue(x,from=today()){if(!x.on)return null;for(let k=0;k<6000;k++){const d=occ(x,k);if(d>=from&&!inGap(x,d))return d;if(k>5000)break}return null}
function paidSoFar(x){return charges(x,x.start,today()).length}
const monthly=x=>(+x.price||0)*(CYCLES[x.cycle]||CYCLES.month).mul;
function dueText(d){if(!d)return '已暂停';const n=diffDays(today(),d);return n===0?'今天':n===1?'明天':n===2?'后天':n+' 天后'}
function subsMonth(y,m){const a=ds(new Date(y,m,1)),b=ds(new Date(y,m,dim(y,m)));const out=[];
  S.subs.forEach(x=>charges(x,a,b).forEach(d=>out.push({date:d,amount:+x.price||0,sub:x,kind:'sub'})));return out}
function recsMonth(y,m){const k=monthKey(y,m);return S.recs.filter(r=>r.date.startsWith(k)).map(r=>({date:r.date,amount:+r.amount||0,rec:r,kind:'rec'}))}

let front=null;
function mainSubs(){let ids=S.main.filter(id=>S.subs.some(x=>x.id===id));return ids.map(id=>S.subs.find(x=>x.id===id))}
function renderSubs(){
  $('#hi').textContent='Hi, '+(S.name||'你好')+'!';
  // upcoming strip
  const t=today(),soon=S.subs.filter(x=>x.on).map(x=>({x,d:nextDue(x)})).filter(o=>o.d&&diffDays(t,o.d)<=Math.max(3,o.x.remind>=0?o.x.remind:0)).sort((a,b)=>a.d<b.d?-1:1);
  $('#soon').innerHTML=soon.length?`<div class="soonbar">${soon.map(o=>`<div class="soonc" data-id="${o.x.id}">${icoHTML(o.x,'sm')}<div><b>${esc(o.x.name)} <em>${dueText(o.d)}</em></b>续费 ${money(o.x.price)}</div></div>`).join('')}</div>`:'';
  const ms=mainSubs();
  $('#mainCount').textContent=S.subs.length?`卡片数量 ${ms.length}/5`:'';
  renderStack(ms);
  // list
  const arr=S.subs.slice();
  const k=S.sort||'date',dir=S.asc?1:-1;
  arr.sort((a,b)=>{
    if(k==='date'){const da=nextDue(a)||'9999',db=nextDue(b)||'9999';return (da<db?-1:da>db?1:0)*dir}
    if(k==='price')return (monthly(a)-monthly(b))*dir;
    return a.name.localeCompare(b.name,'zh')*dir});
  $('#bSort').parentElement.style.display=arr.length?'':'none';
  $('#bSort').innerHTML={date:'续费日期',price:'月均金额',name:'名称'}[k]+' '+ICONS.sort;
  $('#allList').innerHTML=arr.length?arr.map(x=>{const d=nextDue(x),n=d?diffDays(t,d):null;
    return `<div class="row ${x.on?'':'off'}" data-id="${x.id}">${icoHTML(x,'sm')}<div class="mid"><div class="t">${esc(x.name)}</div>
    <div class="s">${d?`<span class="${n<=3?'soon':''}">${dueText(d)}</span> ${cn(d)} 续费`:'已暂停'}</div></div>
    <div class="rt"><b class="num">${money(x.price)}</b><small>${CYCLES[x.cycle].pay}</small></div></div>`}).join('')
    :'';
  const act=S.subs.filter(x=>x.on);
  $('#subSum').innerHTML=act.length?`${act.length} 个订阅启用中 · 平均每月 <b class="num">${money(act.reduce((s,x)=>s+monthly(x),0))}</b> · 每年约 <b class="num">${money(act.reduce((s,x)=>s+monthly(x),0)*12,0)}</b>`:'';
  if(S.demo&&S.subs.length)$('#subSum').innerHTML+=`<div class="tip" style="margin:14px -6px 0">现在显示的是<b>示例数据</b>，方便你先看看效果。<button id="clearDemo">清空，开始记录</button></div>`;
}
function renderStack(ms){
  const W=$('#stackWrap');
  if(!S.subs.length){W.innerHTML=`<div class="empty"><b>还没有订阅</b>把会员、网盘、AI 工具等自动续费都记下来，到期前提醒你<button id="emptyAdd">添加第一个订阅</button></div>`;return}
  if(!ms.length){W.innerHTML=`<div class="empty"><b>选几张主要卡片</b>最多 5 张，叠放在这里随手翻看<button id="emptyPick">选择卡片</button></div>`;return}
  if(!front||!ms.some(x=>x.id===front))front=ms[ms.length-1].id;
  const order=ms.filter(x=>x.id!==front).concat(ms.find(x=>x.id===front));
  const STEP=60,H=248,total=(order.length-1)*STEP+H;
  let st=W.querySelector('.stack');
  if(!st){W.innerHTML='<div class="stack"></div>';st=W.querySelector('.stack')}
  st.style.height=total+'px';
  const keep=new Set(order.map(x=>x.id));
  st.querySelectorAll('.sc').forEach(e=>{if(!keep.has(e.dataset.id))e.remove()});
  order.forEach((x,i)=>{
    let e=st.querySelector(`.sc[data-id="${x.id}"]`);
    const d=nextDue(x);
    const html=`<div class="hd">${icoHTML(x,'w')}<div><div class="nm">${esc(x.name)}</div><div class="cy">${CYCLES[x.cycle].n}</div></div></div>
      ${x.on?'':'<span class="paused">已暂停</span>'}
      <div class="bd"><div class="lab">待扣款</div><div class="amt num">${money(x.price)}</div>
      <div class="nx"><span class="lab">下次扣款</span><b>${d?md(d):'—'}</b></div>
      <div class="st"><span class="lab">订阅日期</span><b class="num">${dot(x.start)}</b></div></div>`;
    if(!e){e=document.createElement('div');e.className='sc';e.dataset.id=x.id;e.style.top=(i*STEP+40)+'px';st.appendChild(e);requestAnimationFrame(()=>e.style.top=i*STEP+'px')}
    else e.style.top=i*STEP+'px';
    e.innerHTML=html;e.style.background=grad(x.color,150);e.style.zIndex=i+1;e.classList.toggle('front',x.id===front);
  });
  let c=st.querySelector('.cut');
  if(!c){c=document.createElement('div');c.className='cut';c.innerHTML=`<button id="bPick"><i>${ICONS.cards}</i>选择卡片</button>`;st.appendChild(c)}
}

/* ================= 流水 ================= */
let fm=(()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()}})();
function monthNav(state,id,cb){
  const el=$(id);el.innerHTML=`<button data-d="-1">${ICONS.left}</button><b>${state.y}年${state.m+1}月</b><button data-d="1">${ICONS.right}</button>`;
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;haptic();let m=state.m+ +b.dataset.d,y=state.y;if(m<0){m=11;y--}if(m>11){m=0;y++}state.y=y;state.m=m;cb()};
}
function renderFlow(){
  monthNav(fm,'#flowMonth',renderFlow);
  const recs=S.recs.filter(r=>r.date.startsWith(monthKey(fm.y,fm.m))).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  const tot=recs.reduce((s,r)=>s+(+r.amount||0),0);
  const days=fm.y===new Date().getFullYear()&&fm.m===new Date().getMonth()?new Date().getDate():dim(fm.y,fm.m);
  const byCat={};recs.forEach(r=>byCat[r.cat]=(byCat[r.cat]||0)+(+r.amount||0));
  const topCat=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  $('#flowSum').innerHTML=`<div class="lab">${fm.m+1}月支出（不含订阅）</div><div class="amt num">${money(tot)}</div>
    <div class="mini"><span>笔数<b class="num">${recs.length}</b></span><span>日均<b class="num">${money(tot/Math.max(1,days))}</b></span><span>最多<b>${topCat?esc(topCat[0]):'—'}</b></span></div>`;
  if(!recs.length){$('#flowList').innerHTML=`<div class="empty" style="margin-top:18px;height:170px"><b>这个月还没有流水</b>点右下角的「＋」记一笔日常开销</div>`;return}
  const groups={};recs.forEach(r=>(groups[r.date]=groups[r.date]||[]).push(r));

/* Turns OCR lines of a bill / payment screenshot into expense items.
   lines: [{t, x, y, w, h}] in image pixels; todayStr: 'YYYY-MM-DD'.
   Returns {items:[{title, amount, date, dateSure, cat, raw}], income:n} */
function parseBill(lines, todayStr, imgH) {
  const CJK = '\\u4e00-\\u9fff';
  const norm = t => String(t || '')
    .replace(/[ 　]/g, ' ')
    .replace(new RegExp(`(?<=[${CJK}])\\s+(?=[${CJK}])`, 'g'), '')
    .replace(new RegExp(`(?<=[${CJK}])\\s+(?=[\\d（(])|(?<=\\d)\\s+(?=[${CJK}])`, 'g'), '')
    .replace(/(?<=\d)\s*([.．,，:：])\s*(?=\d)/g, '$1')
    .replace(/([+\-−－—–])\s+(?=[\d¥￥$R])/g, '$1')
    .replace(/([¥￥$])\s+(?=\d)/g, '$1')
    .replace(/\s+/g, ' ').trim();
  const pdx = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const p2 = n => String(n).padStart(2, '0');
  const fmt = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  const T = pdx(todayStr);
  const mkDay = (y, m, d) => {
    if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
    let yy = y || T.getFullYear();
    let dt = new Date(yy, m - 1, d);
    if (dt.getMonth() !== m - 1) return null;
    if (!y && dt - T > 2 * 864e5) dt = new Date(yy - 1, m - 1, d);
    return fmt(dt);
  };
  function parseDate(s) {
    let m;
    if ((m = s.match(/(20\d{2})\s*[年\-/.]\s*(\d{1,2})\s*[月\-/.]\s*(\d{1,2})/))) { const v = mkDay(+m[1], +m[2], +m[3]); if (v) return { d: v, k: 'day' }; }
    if ((m = s.match(/(?<!\d)(\d{1,2})\s*月\s*(\d{1,2})\s*日/))) { const v = mkDay(0, +m[1], +m[2]); if (v) return { d: v, k: 'day' }; }
    if (/今天/.test(s)) return { d: todayStr, k: 'day' };
    if (/昨天/.test(s)) { const d = new Date(T); d.setDate(d.getDate() - 1); return { d: fmt(d), k: 'day' }; }
    if (/前天/.test(s)) { const d = new Date(T); d.setDate(d.getDate() - 2); return { d: fmt(d), k: 'day' }; }
    const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    if ((m = s.match(/(?<!\d)(\d{1,2})\/(\d{1,2})\/(20\d{2})/))) { const v = mkDay(+m[3], +m[2], +m[1]) || mkDay(+m[3], +m[1], +m[2]); if (v) return { d: v, k: 'day' }; }
    if ((m = s.match(/(?<!\d)(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?(?:\s+(20\d{2}))?/i))) { const v = mkDay(m[3] ? +m[3] : 0, MON[m[2].toLowerCase()], +m[1]); if (v) return { d: v, k: 'day' }; }
    if ((m = s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?!\d)(?:,?\s+(20\d{2}))?/i))) { const v = mkDay(m[3] ? +m[3] : 0, MON[m[1].toLowerCase()], +m[2]); if (v) return { d: v, k: 'day' }; }
    if (/^today\b/i.test(s)) return { d: todayStr, k: 'day' };
    if (/^yesterday\b/i.test(s)) { const d = new Date(T); d.setDate(d.getDate() - 1); return { d: fmt(d), k: 'day' }; }
    if ((m = s.match(/(?<![\d.:])(\d{1,2})[-/](\d{1,2})(?![\d.]|\s*[-/]\d)/))) { const v = +m[1] > 12 ? mkDay(0, +m[2], +m[1]) : mkDay(0, +m[1], +m[2]); if (v) return { d: v, k: 'day' }; }
    if ((m = s.match(/(?<![\d.:])(\d{1,2})[.](\d{1,2})\s+\d{1,2}:\d{2}/))) { const v = mkDay(0, +m[1], +m[2]); if (v) return { d: v, k: 'day' }; }
    if ((m = s.match(/(20\d{2})\s*年\s*(\d{1,2})\s*月(?!\s*\d)/))) { if (+m[2] >= 1 && +m[2] <= 12) return { d: m[1] + '-' + p2(+m[2]) + '-01', k: 'month' }; }
    if (/^本月/.test(s)) return { d: fmt(new Date(T.getFullYear(), T.getMonth(), 1)), k: 'month' };
    return null;
  }
  const AMT = /(^|[^\d.,，:：/\-])([+\-−－—–])?\s*(¥|￥|RM|MYR|S\$|HK\$|US\$|\$|CNY)?\s*([+\-−－—–])?\s*(\d{1,3}(?:[,，]\d{3})+|\d+)(?:[.．](\d{2}))?\s*(元)?(?=$|\s|[)）])/g;
  function amounts(t) {
    const out = []; let m;
    AMT.lastIndex = 0;
    while ((m = AMT.exec(t))) {
      const sign = m[2] || m[4] || '', cur = m[3] || m[7] || '', dec = m[6];
      if (dec === undefined && !cur) continue;               // plain integers are not money
      const num = parseFloat(m[5].replace(/[,，]/g, '') + '.' + (dec || '0'));
      if (!(num >= 0) || num > 1e7) continue;
      out.push({ v: num, sign: /[+]/.test(sign) ? '+' : sign ? '-' : '', start: m.index + m[1].length, end: AMT.lastIndex });
    }
    return out;
  }
  const STATUS = /^(交易成功|支付成功|付款成功|已支付|已完成|成功|对方已收钱|已收钱|已存入零钱|待支付|账单详情|全部账单|账单|筛选|查找交易|收支统计|统计|支出|收入|本月|全部|更多|详情|设置支出预算|零钱|余额)$/;
  const SUMMARY = /支出|收入|合计|总计|共计|余额|预算|已支出|本月|累计|可用|额度|笔数|日均|月均|平均|最多|最高|统计|Total|Balance|Spent|Income/i;
  const REFUND = /退款|退还|已退|返现|收款|转入|红包-来自|来自|入账|收入/;
  const KV = /^(收款方|商户名称|商户|商家|商品|商品说明|对方|收款人|交易对象|Merchant|To)\s*[:：]?\s*(.+)$/i;
  const cleanTitle = t => t
    .replace(/^[A-Za-z]{1,3}\s*[|｜]\s*/, '')
    .replace(new RegExp(`^[^${CJK}A-Za-z0-9]+`), '')
    .replace(/^[A-Za-z]\s+(?=[\u4e00-\u9fff])/, '')
    .replace(/[|｜]+$/, '')
    .replace(/\s*(交易成功|支付成功|已支付|已完成)$/, '')
    .trim();
  const meaningful = t => new RegExp(`[${CJK}A-Za-z]{2,}|[${CJK}]`).test(t) && !STATUS.test(t);

  let L = lines.map((l, i) => ({ i, t: norm(l.t), x: +l.x || 0, y: +l.y || 0, w: +l.w || 0, h: Math.max(1, +l.h || 1) }))
    .filter(l => l.t && !(imgH && l.y + l.h < imgH * .045));
  L.forEach(l => { l.cy = l.y + l.h / 2; l.am = amounts(l.t); l.dt = parseDate(l.t); });
  L.sort((a, b) => a.cy - b.cy || a.x - b.x);
  const hs = L.map(l => l.h).sort((a, b) => a - b);
  const medH = hs.length ? hs[Math.floor(hs.length / 2)] : 30;

  // payment-success / detail page: one big amount + key/value rows
  const kvTitle = L.map(l => (l.t.match(KV) || [])[2]).find(Boolean);
  const isDetail = L.some(l => /支付成功|付款成功|交易成功|账单详情|交易详情|Payment Successful|Transaction Details/i.test(l.t)) && L.filter(l => l.am.length).length <= 3;
  if (isDetail) {
    const big = L.filter(l => l.am.length === 1 && l.t.length - (l.am[0].end - l.am[0].start) < 4).sort((a, b) => b.h - a.h)[0];
    if (big) {
      const a = big.am[0];
      const dl = L.find(l => /时间|日期|Time|Date/i.test(l.t) && l.dt) || L.find(l => l.dt && l.dt.k === 'day');
      const title = cleanTitle(kvTitle || (L.find(l => l !== big && meaningful(l.t) && !/成功|时间|日期|方式|单号|编号|状态/.test(l.t)) || {}).t || '');
      if (a.sign !== '+') return { items: [{ title: title || '支付', amount: a.v, date: dl ? dl.dt.d : todayStr, dateSure: !!dl, raw: big.t }], income: 0 };
      return { items: [], income: 1 };
    }
  }

  const items = []; let income = 0;
  let sectDay = null, sectMonth = null;
  const used = new Set();
  for (const l of L) {
    if (l.dt && SUMMARY.test(l.t) && l.am.length <= 2) {     // "今天  支出 ¥38.00" day headers
      if (l.dt.k === 'month') { sectMonth = l.dt.d; sectDay = null; } else sectDay = l.dt.d;
      continue;
    }
    if (!l.am.length) {
      // section headers like "11月20日 星期五" or "2026年11月"
      if (l.dt && !L.some(o => o !== l && o.am.length && Math.abs(o.cy - l.cy) < medH * .7)) {
        if (l.dt.k === 'month') { sectMonth = l.dt.d; sectDay = null; }
        else if (l.t.replace(/[\d\s年月日\-/.:：星期周一二三四五六日天今昨前]/g, '').length <= 2) sectDay = l.dt.d;
      }
      continue;
    }
    if (l.am.length > 1) continue;                            // "支出 ¥x 收入 ¥y" summaries
    const a = l.am[0];
    if (!(a.v > 0)) continue;
    const pre = cleanTitle(l.t.slice(0, a.start));
    const post = l.t.slice(a.end).trim();
    if (SUMMARY.test(pre) && !/[-−－—–]/.test(a.sign)) continue;
    if (/^(支出|收入|合计|总计|共计|余额)/.test(pre)) continue;
    const tol = Math.max(l.h, medH) * .75;
    // title: same row to the left, else just above
    let title = meaningful(pre) ? pre : '';
    let titleLine = null;
    if (!title) {
      const cands = L.filter(o => o !== l && !o.am.length && meaningful(o.t) && o.x < l.x && !used.has(o.i) &&
        !(o.dt && o.t.replace(/[\d\s年月日:\-/.]/g, '').length < 2));
      titleLine = cands.filter(o => Math.abs(o.cy - l.cy) < tol).sort((p, q) => p.x - q.x)[0] ||
        cands.filter(o => o.cy < l.cy && l.cy - o.cy < medH * 2.2).sort((p, q) => q.cy - p.cy)[0] || null;
      if (!titleLine) {
        const above = L.filter(o => o !== l && o.cy < l.cy - tol * .5 && l.cy - o.cy < medH * 2.6).sort((p, q) => q.cy - p.cy)[0];
        if (above && SUMMARY.test(above.t)) continue;
      }
      if (titleLine) {
        if (SUMMARY.test(titleLine.t) && a.sign !== '-') continue;   // big totals under "本月支出"
        title = cleanTitle(titleLine.t); used.add(titleLine.i);
      }
    }
    // date: on this item's rows, else the section header above
    const anchorY = titleLine ? Math.min(titleLine.cy, l.cy) : l.cy;
    const nextAmt = L.filter(o => o.am.length && o.cy > l.cy + tol).reduce((m, o) => Math.min(m, o.cy), Infinity);
    const dl = L.filter(o => o.dt && o.dt.k === 'day' && !o.am.length && o.cy >= anchorY - tol && o.cy - l.cy < medH * 3.2 && o.cy < nextAmt - tol && o.x < l.x + l.w &&
        !(o.x < (titleLine ? titleLine.x : l.x) - medH && o.t.replace(/[\d\s年月日\-/.:：星期周一二三四五六日天今昨前]/g, '').length <= 2))
      .sort((p, q) => Math.abs(p.cy - l.cy) - Math.abs(q.cy - l.cy))[0];
    let date = dl ? dl.dt.d : (l.dt && l.dt.k === 'day' ? l.dt.d : sectDay);
    let sure = !!date;
    if (!date) date = sectMonth || todayStr;
    const near = L.filter(o => o !== l && Math.abs(o.cy - l.cy) < medH * 3 && o.cy >= anchorY - tol).map(o => o.t).join(' ');
    if (a.sign === '+' || REFUND.test(title) || /已全额退款|退款成功|已退款/.test(near + post)) { income++; continue; }
    items.push({ title: title || '未命名', amount: a.v, date, dateSure: sure, raw: l.t });
  }
  return { items, income };
}

function imageToCanvas(im,forTess){

    ocrCb[id]=(lines,err)=>{clearTimeout(t);lines?res(lines):rej(new Error(err||'识别失败'))};Android.ocr(id,b64)})}
let tessWorker=null;
async function ocrWeb(c,onStage){
  if(!window.Tesseract){onStage('正在下载识别组件…');await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')}
  if(!tessWorker){onStage('正在下载中文识别模型（首次约 10MB）…');
    tessWorker=await Tesseract.createWorker('chi_sim+eng',1,{logger:m=>{if(m.status==='recognizing text')onStage('正在识别…',m.progress)}});
    await tessWorker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'})}
  const {data}=await tessWorker.recognize(c);
  return (data.lines||[]).map(l=>({t:l.text,x:l.bbox.x0,y:l.bbox.y0,w:l.bbox.x1-l.bbox.x0,h:l.bbox.y1-l.bbox.y0}))}

$('#shotIn').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';

  let cancelled=false;const all=[];let income=0,failed=0,lastErr='';

      const c=imageToCanvas(im,!hasMLKit());
      const lines=hasMLKit()?await ocrAndroid(c):await ocrWeb(c,stage);
      const r=parseBill(lines,today(),c.height);income+=r.income;r.items.forEach(it=>all.push({...it,img:i}));URL.revokeObjectURL(im.src)}
    catch(err){failed++;lastErr=err&&err.message||''}

    it.cat=guessCat(it.title);it.dup=S.recs.some(r=>r.date===it.date&&Math.abs((+r.amount||0)-it.amount)<.005);it.on=!it.dup;items.push(it)}
  items.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  openImportReview(items,{income,failed,lastErr,n:files.length});

function openImportReview(items,info){
  const cnt=()=>items.filter(i=>i.on).length;

    if(!items.length)return `<div class="empty" style="height:auto;padding:30px 20px;margin-top:10px"><b>没有识别到支出</b>${info.failed?`有 ${info.failed} 张没能识别${info.lastErr==='net'?'：识别组件下载失败，检查一下网络再试':''}。`:''}${info.income?`跳过了 ${info.income} 笔收入或退款。`:''}<br>支持微信、支付宝、银行 App 的账单列表和「支付成功」页，截图要完整清晰。</div>`;
    return `<p class="small" style="margin-top:2px">识别到 <b>${items.length}</b> 笔支出${info.income?`，已跳过 ${info.income} 笔收入/退款`:''}${info.failed?`，${info.failed} 张没能识别`:''}。识别可能有误，导入前核对一下金额和日期。</p>`+
    items.map((it,i)=>`<div class="imp ${it.on?'':'off'}" data-i="${i}"><span class="ck ${it.on?'on':''}" data-ck="${i}">${it.on?'✓':''}</span><div class="fl">
      <input data-f="title" value="${esc(it.title)}" maxlength="30" placeholder="说明"><input class="am num" data-f="amount" inputmode="decimal" value="${it.amount.toFixed(2)}">
      <input type="date" data-f="date" value="${it.date}"><select data-f="cat">${FLOWCATS.map(c=>`<option ${it.cat===c[0]?'selected':''}>${c[0]}</option>`).join('')}</select>
      ${it.dup||!it.dateSure?`<div class="tags">${it.dup?'<span class="dup">可能已记过</span>':''}${!it.dateSure?'<span>日期没认出来，核对一下</span>':''}</div>`:''}
    </div></div>`).join('')};
  openSheet(`<div class="sh"><button class="pill" id="rvX">取消</button><div class="ttl">识别结果</div><button class="pill solid" id="rvOk" ${cnt()?'':'disabled'}>导入 ${cnt()}</button></div><div class="sb" id="rvB">${body()}</div>`,inn=>{
    const ok=inn.querySelector('#rvOk');const upd=()=>{ok.textContent='导入 '+cnt();ok.disabled=!cnt()};
    inn.querySelector('#rvX').onclick=closeSheet;
    const B=inn.querySelector('#rvB');
    B.addEventListener('click',e=>{const c=e.target.closest('[data-ck]');if(!c)return;haptic();const it=items[+c.dataset.ck];it.on=!it.on;c.classList.toggle('on',it.on);c.textContent=it.on?'✓':'';c.closest('.imp').classList.toggle('off',!it.on);upd()});
    B.addEventListener('input',e=>{const f=e.target.dataset.f;if(!f)return;const box=e.target.closest('.imp'),it=items[+box.dataset.i];it[f]=e.target.value;
      if(f==='title'&&!it.catSet){const g=guessCat(it.title);if(g!=='其他'||it.cat!=='其他'){it.cat=g;box.querySelector('[data-f=cat]').value=g}}
      if(f==='cat')it.catSet=true});
    B.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;const it=items[+e.target.closest('.imp').dataset.i];it[f]=e.target.value;if(f==='cat')it.catSet=true});
    ok.onclick=()=>{const sel=items.filter(i=>i.on);let bad=0;const add=[];
      sel.forEach(it=>{const a=parseFloat(String(it.amount).replace(/[,，\s]/g,''));if(!(a>0)||!/^\d{4}-\d{2}-\d{2}$/.test(it.date)){bad++;return}
        add.push({id:uid(),date:it.date,amount:Math.round(a*100)/100,title:String(it.title||'').trim()||it.cat,cat:FCM[it.cat]?it.cat:'其他',note:'截图导入'})});
      if(bad){toast(bad+' 笔的金额或日期不对，改一下再导入');return}
      S.recs.push(...add);
      const months={};add.forEach(r=>months[r.date.slice(0,7)]=(months[r.date.slice(0,7)]||0)+1);
      const top=Object.entries(months).sort((a,b)=>b[1]-a[1])[0];if(top){const [y,m]=top[0].split('-').map(Number);fm={y,m:m-1}}
      save();closeSheet();render();haptic();toast('已导入 '+add.length+' 笔流水')};
  });
}

function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function shortMoney(v){return v>=10000?(v/10000).toFixed(v%10000?1:0)+'万':Math.round(v).toLocaleString('en-US')}
function renderChart(){
  const cols=[];const now=new Date();
  if(bscale==='month'){for(let i=5;i>=0;i--){const d=new Date(bm.y,bm.m-i,1);const y=d.getFullYear(),m=d.getMonth();
      cols.push({lab:(m+1)+'月',s:bf==='rec'?0:subsMonth(y,m).reduce((a,x)=>a+x.amount,0),r:bf==='sub'?0:recsMonth(y,m).reduce((a,x)=>a+x.amount,0),cur:y===bm.y&&m===bm.m})}}
  else{for(let i=4;i>=0;i--){const y=bm.y-i;let s=0,r=0;for(let m=0;m<12;m++){if(bf!=='rec')s+=subsMonth(y,m).reduce((a,x)=>a+x.amount,0);if(bf!=='sub')r+=recsMonth(y,m).reduce((a,x)=>a+x.amount,0)}cols.push({lab:String(y),s,r,cur:y===bm.y})}}
  const n=cols.length,ss=cols.reduce((a,c)=>a+c.s,0)/n,rr=cols.reduce((a,c)=>a+c.r,0)/n,avg=ss+rr;
  const mx=niceMax(Math.max(...cols.map(c=>c.s+c.r),avg)*1.05);
  const W=340,H=170,L=44,B=22,T=8,cw=(W-L-6)/n,bw=Math.min(26,cw*.46),y=v=>T+(H-T-B)*(1-v/mx);
  let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--sub)">${shortMoney(v)}</text>`}
  cols.forEach((c,i)=>{const x=L+cw*i+(cw-bw)/2;const hs=(H-T-B)*c.s/mx,hr=(H-T-B)*c.r/mx;const base=H-B;
    if(c.s>0)g+=`<rect x="${x}" y="${base-hs}" width="${bw}" height="${Math.max(hs,1.5)}" rx="${Math.min(4,hs/2)}" fill="var(--blue)"/>`;
    if(c.r>0)g+=`<rect x="${x}" y="${base-hs-hr-(c.s>0?1.5:0)}" width="${bw}" height="${Math.max(hr,1.5)}" rx="${Math.min(4,hr/2)}" fill="var(--orange)"/>`;
    if(!c.s&&!c.r)g+=`<rect x="${x}" y="${base-2}" width="${bw}" height="2" rx="1" fill="var(--chip)"/>`;
    g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="${c.cur?'var(--tx)':'var(--sub)'}" font-weight="${c.cur?700:400}">${c.lab}</text>`});
  g+=`<line x1="${L}" x2="${W-4}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--green)" stroke-width="1.4" stroke-dasharray="5 4"/>`;
  const first=cols[0].lab,last=cols[n-1].lab;
  const rangeTxt=bscale==='month'?(()=>{const a=new Date(bm.y,bm.m-5,1);return `${a.getFullYear()}年${a.getMonth()+1}月 – ${bm.y}年${bm.m+1}月`})():`${first}年 – ${last}年`;
  $('#billChart').innerHTML=`<div class="panel"><div class="ph"><h4>${bscale==='month'?'月度':'年度'}支出</h4><div class="seg" id="bS"><button data-s="month" class="${bscale==='month'?'on':''}">月度</button><button data-s="year" class="${bscale==='year'?'on':''}">年度</button></div></div>
   <div class="range">${rangeTxt}</div>
   <div class="avg"><span>订阅${bscale==='month'?'月':'年'}均<b class="num" style="color:var(--blue)">${money(ss)}</b></span><span>流水${bscale==='month'?'月':'年'}均<b class="num" style="color:var(--orange)">${money(rr)}</b></span></div>
   <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="支出柱状图">${g}</svg>
   <div class="legend"><span><i class="dot" style="background:var(--blue)"></i>订阅</span><span><i class="dot" style="background:var(--orange)"></i>流水</span><span><i class="dot" style="background:var(--green)"></i>平均</span></div>

  $('#bS').onclick=e=>{const b=e.target.closest('button');if(!b)return;haptic();bscale=b.dataset.s;renderChart()};

   ${ns==='web'?`<div class="it"><span class="k">通知</span><span class="v">安卓 App 支持</span></div>`:
     `<div class="it tap" id="sNotif"><span class="k">系统通知</span><span class="v" style="color:${ns==='on'?'var(--green)':'var(--orange)'}">${ns==='on'?'已开启':'点这里开启'}</span><span class="chev">›</span></div>`}
   <div class="f"><label>提醒时间</label><select id="sHour">${Array.from({length:24},(_,h)=>`<option value="${h}" ${+S.remindHour===h?'selected':''}>${pad(h)}:00</option>`).join('')}</select></div>
  </div>
  <p class="small">${ns==='web'?'苹果手机网页版不能发系统通知：打开 App 时，首页顶部会显示即将续费的订阅。':'每个订阅的「提前提醒」天数到了，会在这个时间发通知。'}</p>
  <div class="glabel">数据</div>
  <div class="group">
   <div class="it tap" id="sExport"><span class="k">导出备份</span><span class="chev">›</span></div>
   <div class="it tap" id="sImport"><span class="k">从备份恢复</span><span class="chev">›</span></div>
   <div class="it tap" id="sDemo"><span class="k">载入示例数据</span><span class="chev">›</span></div>
   <div class="it btn red" id="sClear">清空全部数据</div>
  </div>
  <p class="small">数据只保存在这台手机上，不会上传。换手机前先导出备份。<br>订阅卡包 · ${S.subs.length} 个订阅 · ${S.recs.length} 笔流水</p>`;
  $('#sName').oninput=e=>{S.name=e.target.value.trim();save()};
  $('#sCur').onchange=e=>{S.cur=e.target.value;save();toast('货币符号已改为 '+S.cur)};
  $('#sHour').onchange=e=>{S.remindHour=+e.target.value;save();toast('提醒时间 '+pad(S.remindHour)+':00')};
  $('#sTheme').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.theme=b.dataset.t;applyTheme();save();renderSet()};
  const n=$('#sNotif');if(n)n.onclick=()=>{try{Android.requestNotify()}catch(e){}};
  $('#sExport').onclick=exportData;
  $('#sImport').onclick=()=>$('#fileIn').click();
  $('#sDemo').onclick=async()=>{if(await ask('载入示例数据会替换现在的所有订阅和流水，确定？','载入',true)){S={...demo(),name:S.name,cur:S.cur,theme:S.theme,remindHour:S.remindHour};front=null;save();render();toast('已载入示例数据')}};
  $('#sClear').onclick=async()=>{if(await ask('清空所有订阅和流水？这一步无法撤销，建议先导出备份。','清空',true)){S.subs=[];S.recs=[];S.main=[];S.demo=false;front=null;save();render();toast('已清空')}};
}
function exportData(){
  const txt=JSON.stringify({app:'订阅卡包',v:1,at:new Date().toISOString(),data:S});
  if(window.Android&&Android.share){Android.share(txt);return}
  const name='订阅卡包备份-'+today()+'.json';
  try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'订阅卡包备份'}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('已导出备份文件');
}
$('#fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());const d=j.data||j;if(!Array.isArray(d.subs))throw 0;
    if(!await ask(`备份里有 ${d.subs.length} 个订阅、${(d.recs||[]).length} 笔流水，恢复后会替换现在的数据。`,'恢复',true))return;
    S=d;S.demo=false;load2();front=null;save();applyTheme();render();toast('已恢复')}catch(err){toast('这不是订阅卡包的备份文件')}};
function load2(){S.subs.forEach(x=>{x.gaps=x.gaps||[];if(x.on===undefined)x.on=true;if(!CYCLES[x.cycle])x.cycle='month'});S.recs=S.recs||[];S.main=(S.main||[]).filter(id=>S.subs.some(x=>x.id===id))}

/* ================= theme ================= */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):null;
function applyTheme(){const t=S.theme==='auto'?(mq&&mq.matches?'light':'dark'):(S.theme||'dark');document.documentElement.dataset.theme=t;
  const c=t==='light'?'#f2f2f6':'#000000';document.querySelector('meta[name=theme-color]').content=c;try{window.Android&&Android.setBars&&Android.setBars(t)}catch(e){}}
mq&&mq.addEventListener&&mq.addEventListener('change',()=>{if(S.theme==='auto')applyTheme()});

/* ================= reminders (Android) ================= */
function scheduleReminders(){
  if(!(window.Android&&Android.schedule))return;
  const now=Date.now(),t=today(),end=addDays(t,75),list=[];
  S.subs.forEach(x=>{if(!x.on||x.remind<0)return;charges(x,t,end).forEach(d=>{const at=pd(addDays(d,-x.remind));at.setHours(+S.remindHour||9,0,0,0);
    if(at.getTime()<=now)return;const w=x.remind===0?'今天':x.remind===1?'明天':x.remind+' 天后';
    list.push({key:x.id+'@'+d,at:at.getTime(),title:`${x.name} ${w}续费`,text:`${md(d)}扣款 ${money(x.price)}（${CYCLES[x.cycle].n}）${x.pay?' · '+x.pay:''}`})})});
  list.sort((a,b)=>a.at-b.at);
  try{Android.schedule(JSON.stringify(list.slice(0,60)))}catch(e){}
}

/* ================= back button / resume ================= */
window.onAndroidBack=()=>{if($('#confirm').classList.contains('on')){$('#cfNo').click();return true}if(sheetOpen()){closeSheet();return true}if(view!=='vSubs'){show('vSubs');return true}return false};
window.onAndroidResume=()=>{if(view==='vSet')renderSet();else if(!sheetOpen())render()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sheetOpen())render()});

/* ================= boot ================= */
load();applyTheme();render();scheduleReminders();
}
</script>
</body>
</html>
