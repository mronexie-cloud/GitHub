<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天才交易员模拟器</title>
<style>
:root{--bg:#0b0f14;--panel:#131a22;--line:#223040;--txt:#dce6f0;--dim:#7d8ea0;--up:#ff4d4f;--down:#18c27a;--gold:#f5b942;--blue:#4ea3ff;--warn:#ff9f43}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{padding-bottom:84px}
.wrap{max-width:520px;margin:0 auto;padding:10px 12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.dim{color:var(--dim)}.gold{color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
h1{font-size:20px;margin:6px 0 2px}h2{font-size:15px;margin:0 0 8px;color:var(--gold);letter-spacing:.5px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.btn{border:1px solid var(--line);background:#1b2633;color:var(--txt);border-radius:9px;padding:8px 10px;font-size:14px;cursor:pointer}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.35}
.btn.pri{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
.btn.long{background:rgba(255,77,79,.15);border-color:var(--up);color:var(--up)}
.btn.short{background:rgba(24,194,122,.15);border-color:var(--down);color:var(--down)}
.btn.sm{padding:5px 8px;font-size:12px}
.chip{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;border:1px solid var(--line);color:var(--dim);margin:2px 3px 2px 0}
.chip.g{color:var(--gold);border-color:#6b5320}.chip.r{color:var(--up);border-color:#6a2526}.chip.gr{color:var(--down);border-color:#145a3c}
.nw{font-size:28px;font-weight:800}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.bar .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.bar .tr{height:6px;background:#0a0e13;border-radius:4px;overflow:hidden}
.bar .fi{height:100%;border-radius:4px}
.asset{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.asset:first-of-type{border-top:0}
.asset .nm{width:70px}.asset .pr{width:84px;text-align:right}
.sig{font-size:11px;padding:1px 5px;border-radius:5px;margin-top:2px;display:inline-block}
.pos{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.act{padding:9px 2px;text-align:center;font-size:12px;line-height:1.25}
.act b{display:block;font-size:18px;margin-bottom:2px}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 12px 14px}
.foot .btn{width:100%;max-width:496px;display:block;margin:0 auto;padding:13px;font-size:16px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:86vh;overflow:auto;padding:16px 16px 22px;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h3{margin:0 0 8px;font-size:18px}
.modal p{margin:6px 0;color:#c4d0dc}
.choice{display:block;width:100%;text-align:left;margin-top:8px;padding:11px 12px}
.choice small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.opts .btn.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}
.log{font-size:12px;color:var(--dim);max-height:150px;overflow:auto}
.log div{padding:2px 0;border-bottom:1px solid #18222d}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep td{padding:4px 2px;border-bottom:1px solid #1c2733}
table.rep td:last-child{text-align:right}
.big{font-size:44px;text-align:center;margin:8px 0}
.title{text-align:center;font-size:24px;font-weight:800;color:var(--gold)}
.attr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.attr div{background:#0e141b;border-radius:8px;padding:6px;text-align:center}
.attr b{display:block;font-size:18px}
svg{display:block}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="foot"></div>
<div id="modal"></div>
<script>
'use strict';
// ===================== 基础工具 =====================
const R=()=>Math.random();
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function gauss(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function money(v){const s=v<0?'-':'';v=Math.abs(v);
  if(v>=1e8)return s+(v/1e8).toFixed(v>=1e10?0:2)+'亿';
  if(v>=1e4)return s+(v/1e4).toFixed(v>=1e6?0:1)+'万';
  return s+Math.round(v)+'元'}
function pct(v,d=1){return (v>=0?'+':'')+(v*100).toFixed(d)+'%'}
function cls(v){return v>0?'up':v<0?'down':'dim'}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ===================== 静态数据 =====================
const SUR='王李张刘陈杨黄赵吴周徐孙马朱胡郭何林罗高郑梁谢宋唐许韩冯邓曹彭曾萧田董潘袁蔡蒋余于杜叶程魏苏吕丁任沈姚卢钟姜崔谭陆范汪廖石金韦贾夏付方邹熊白孟秦邱侯江尹薛闫段雷龙黎史陶贺毛郝顾龚邵万覃武钱戴严欧莫孔向常汤康易乔赖文'.split('');
const MN='浩然 子轩 宇航 俊杰 志强 明哲 一鸣 天佑 博文 嘉豪 思远 晨阳 泽宇 浩宇 景行 修远 致远 子默 承泽 弘毅'.split(' ');
const FN='梓涵 欣怡 诗琪 雨桐 思颖 佳怡 若曦 可馨 婉清 语嫣 静怡 晓彤 一诺 书瑶 梦洁 慧敏 安然 沐晴 清韵 知夏'.split(' ');
const CITIES=[['上海',1.4,600],['北京',1.4,620],['深圳',1.35,580],['杭州',1.15,380],['广州',1.15,350],['成都',0.95,180],['武汉',0.95,170],['南京',1.05,300],['重庆',0.85,130],['西安',0.85,140]];
const JOBS=[['程序员',1.25,0],['银行柜员',0.8,0],['会计',0.9,0],['销售',1.0,0],['中学老师',0.85,0],['券商研究员',1.15,6],['公务员',0.9,0],['外卖骑手',0.7,0],['产品经理',1.1,0],['设计师',0.95,0]];
const BGS={寒门:{cash:2e4,sal:3e4,w:3},工薪:{cash:8e4,sal:3.8e4,w:4},中产:{cash:3e5,sal:4.5e4,w:2.4},富二代:{cash:3e6,sal:4e4,w:0.6}};
const TRAITS={
 数学天才:{d:'智力+15，研究更准',c:'g'},钢铁心态:{d:'压力和亏损打击减半',c:'g'},赌徒血统:{d:'胆识+15，杠杆上限+2，容易上头',c:'r'},
 天选之子:{d:'运气+20，常有意外之财',c:'g'},夜猫子:{d:'研究更准，但伤身',c:''},社交达人:{d:'魅力+15，应酬声望翻倍',c:'g'},
 玻璃心:{d:'压力和亏损打击×1.5',c:'r'},佛系:{d:'每季压力额外-4',c:'g'},工作狂:{d:'每季+1行动点，家庭下滑更快',c:''},
 恋爱脑:{d:'感情事件多，家庭收益×1.5',c:''},身体倍儿棒:{d:'体质+20，健康下降减半',c:'g'},过度自信:{d:'胆识+10，但信号把握度虚高',c:'r'}};
const CONFLICT=[['钢铁心态','玻璃心'],['佛系','赌徒血统'],['佛系','工作狂']];
const ASSETS={
 idx:{n:'沪深300',p:4000,mu:{bull:6,range:0,bear:-6,crash:-22},sd:{bull:7,range:5,bear:8,crash:10},beta:.7},
 tech:{n:'科技股',p:100,mu:{bull:10,range:0,bear:-11,crash:-32},sd:{bull:13,range:10,bear:14,crash:14},beta:.7},
 gold:{n:'黄金',p:600,mu:{bull:1,range:1,bear:3,crash:8},sd:{bull:5,range:4,bear:6,crash:8},beta:0},
 oil:{n:'原油',p:80,mu:{bull:4,range:0,bear:-5,crash:-25},sd:{bull:14,range:12,bear:15,crash:18},beta:.3},
 btc:{n:'比特币',p:60000,mu:{bull:18,range:0,bear:-18,crash:-40},sd:{bull:35,range:25,bear:30,crash:20},beta:.5}};
const AK=Object.keys(ASSETS);
const REG={bull:'牛市',range:'震荡市',bear:'熊市',crash:'股灾'};
const TRANS={bull:{bull:.68,range:.22,bear:.08,crash:.02},range:{bull:.25,range:.5,bear:.2,crash:.05},bear:{bull:.12,range:.33,bear:.45,crash:.1},crash:{bull:.15,range:.3,bear:.45,crash:.1}};
const NEWS={bull:['央行意外降息，市场情绪升温','外资持续流入，成交量放大','经济数据超预期，分析师集体上调目标价'],
 range:['市场缺乏方向，资金观望','政策面平稳，消息面清淡','多空分歧加大，指数原地踏步'],
 bear:['海外加息预期升温，资金外流','企业盈利下滑，多家公司下调指引','地产链风险发酵，避险情绪升温'],
 crash:['某大型机构传出流动性危机','杠杆资金集中平仓的传闻四起','地缘冲突突然升级，全球市场恐慌']};
const CAREERS={employed:'上班族散户',pro:'职业交易员',fund:'私募基金经理',hedge:'对冲基金大佬'};

// ===================== 角色生成 =====================
function hasT(t){return G.traits.includes(t)}
function genChar(){
  const gender=R()<.5?'男':'女';
  const name=pick(SUR)+pick(gender==='男'?MN:FN);
  const city=pick(CITIES);
  const bgList=Object.keys(BGS);let tw=bgList.reduce((s,k)=>s+BGS[k].w,0),x=R()*tw,bg=bgList[0];
  for(const k of bgList){x-=BGS[k].w;if(x<0){bg=k;break}}
  const job=pick(JOBS);
  const a={int:ri(30,80),mind:ri(30,80),nerve:ri(30,80),body:ri(30,80),charm:ri(30,80),luck:ri(30,80)};
  a.int=clamp(a.int+job[2],0,100);
  const keys=Object.keys(TRAITS);let tr=[];
  while(tr.length<2){const t=pick(keys);if(tr.includes(t))continue;if(tr.length&&CONFLICT.some(c=>c.includes(t)&&c.includes(tr[0])))continue;tr.push(t)}
  const add={数学天才:['int',15],赌徒血统:['nerve',15],天选之子:['luck',20],社交达人:['charm',15],身体倍儿棒:['body',20],过度自信:['nerve',10]};
  tr.forEach(t=>{if(add[t])a[add[t][0]]=clamp(a[add[t][0]]+add[t][1],0,100)});
  return {name,gender,city:city[0],cityMul:city[1],housePrice:city[2]*1e4,bg,job:job[0],salary:Math.round(BGS[bg].sal*job[1]),cash:BGS[bg].cash,attr:a,traits:tr,age:ri(22,26)};
}

// ===================== 游戏状态 =====================
let G=null;
function newGame(c){
  G={name:c.name,gender:c.gender,city:c.city,cityMul:c.cityMul,housePrice:c.housePrice,bg:c.bg,job:c.job,traits:c.traits,
    attr:{...c.attr},age:c.age,age0:c.age,baseSal:c.salary,q:1,year:2026,cash:c.cash,salary:c.salary,career:'employed',
    st:{health:Math.round(60+c.attr.body*.35),stress:20,mood:Math.round(40+c.attr.mind*.4),family:60,fame:5,comply:80},
    partner:'',partnerName:'',kids:0,house:0,mortgage:0,aum:0,
    prices:{},prev:{},regime:'range',pos:[],signals:{},news:'',ap:0,apUsed:0,apPenalty:0,
    flags:{},alcohol:0,promo:0,debtTurns:0,peakNw:0,lastRet:0,qStartNw:0,quarters:0,
    hist:[],life:[],log:[],queue:[],over:null,usedActs:{}};
  AK.forEach(k=>{G.prices[k]=ASSETS[k].p*(0.85+R()*.3);G.prev[k]=G.prices[k]});
  G.regime=pick(['bull','range','range','bear']);
  life(`${G.age}岁，${G.name}在${G.city}做${G.job}，揣着${money(G.cash)}踏入市场。`);
  startQuarter();
  G.hist.push(nw());
  save();
}
function life(t){G.life.push(`${G.year}年 ${G.age}岁：${t}`)}
function log(t){G.log.unshift(`Q${G.q} ${t}`);if(G.log.length>40)G.log.pop()}
function posValue(p){return p.margin*(1+p.lev*p.dir*(G.prices[p.k]/p.entry-1))}
function posTotal(){return G.pos.reduce((s,p)=>s+Math.max(0,posValue(p)),0)}
function nw(){return G.cash+posTotal()+G.house-G.mortgage}
function levCap(){let c=G.career==='employed'?3:G.career==='pro'?5:10;if(hasT('赌徒血统'))c+=2;return c}
function apMax(){return (G.career==='employed'?3:4)+(hasT('工作狂')?1:0)}
function livingCost(){return Math.round(1.1e4*G.cityMul+G.kids*9e3+(G.partner==='married'?4e3:0)+(G.career==='fund'?3e4:G.career==='hedge'?2e5:0))}

// 预先抽好下个季度的行情，研究信号才有意义
function startQuarter(){
  const t=TRANS[G.regime];let x=R(),nr='range';
  for(const k in t){x-=t[k];if(x<0){nr=k;break}}
  const z=gauss();const r={};
  AK.forEach(k=>{const A=ASSETS[k];r[k]=(A.mu[nr]+A.sd[nr]*(A.beta*z+Math.sqrt(1-A.beta*A.beta)*gauss()))/100;r[k]=Math.max(r[k],-.8)});
  G.next={regime:nr,r};
  const hint=R()<.55?nr:pick(Object.keys(REG));
  G.news=pick(NEWS[hint]);
  G.signals={};G.ap=apMax()-G.apPenalty;G.apPenalty=0;G.usedActs={};
  G.qStartNw=nw();
}
function accuracy(){let p=.545+(G.attr.int-50)/280+(hasT('夜猫子')?.03:0)+(hasT('数学天才')?.03:0);return clamp(p,.5,.78)}
function research(){
  const left=AK.filter(k=>!G.signals[k]);if(!left.length)return '五个品种都研究过了';
  const k=pick(left);const p=accuracy();const truth=Math.sign(G.next.r[k])||1;
  const dir=R()<p?truth:-truth;
  let conf=p+(hasT('过度自信')?.12:0)+(R()-.5)*.06;
  G.signals[k]={dir,conf:clamp(conf,.5,.97)};
  return `研究了${ASSETS[k].n}：判断下季度${dir>0?'看涨':'看跌'}（把握度${Math.round(G.signals[k].conf*100)}%）`;
}

// ===================== 行动 =====================
const ACTS=[
 {id:'res',ic:'🔍',n:'深度研究',ap:1,f(){G.st.stress+=1;return research()}},
 {id:'gym',ic:'🏃',n:'健身',ap:1,f(){G.st.health+=8;G.st.stress-=5;return '出了一身汗，健康+8'}},
 {id:'fam',ic:'🏠',n:'陪伴家人',ap:1,f(){const g=Math.round(12*(hasT('恋爱脑')?1.5:1));G.st.family+=g;G.st.stress-=6;return `陪家人吃了几顿饭，家庭+${g}`}},
 {id:'soc',ic:'🥂',n:'社交应酬',ap:1,f(){const g=Math.round((3+G.attr.charm/25)*(hasT('社交达人')?2:1));G.st.fame+=g;G.st.health-=3;G.cash-=8e3*G.cityMul;return `饭局上认识了几个圈内人，声望+${g}`}},
 {id:'learn',ic:'📚',n:'学习进修',ap:1,f(){G.cash-=1e4;G.attr.int=clamp(G.attr.int+2,0,100);G.attr.mind=clamp(G.attr.mind+1,0,100);return '上完一期课程，智力+2'}},
 {id:'med',ic:'🧘',n:'冥想复盘',ap:1,f(){G.st.mood+=8;G.st.stress-=10;return '静下心复盘，心态+8，压力-10'}},
 {id:'ot',ic:'💼',n:'加班',ap:1,need:()=>G.career==='employed',f(){const b=Math.round(G.salary*.3);G.cash+=b;G.st.stress+=8;G.st.health-=3;G.st.family-=4;G.promo++;return `加班拿到${money(b)}奖金，升职进度+1`}},
 {id:'vac',ic:'🏖️',n:'度假',ap:2,f(){const c=Math.round(3e4*G.cityMul);G.cash-=c;G.st.stress-=25;G.st.family+=10;G.st.health+=5;G.st.mood+=6;return `花${money(c)}出去玩了一趟，压力-25`}},
];
function doAct(id){
  const a=ACTS.find(x=>x.id===id);if(!a||G.ap<a.ap||G.over)return;
  if(a.need&&!a.need())return;
  G.ap-=a.ap;sfx({res:'research',gym:'gym',med:'calm',vac:'calm',ot:'coin'}[id]||'act');const t=a.f();normSt();log(t);toast(t);save();render();
}
function normSt(){for(const k in G.st)G.st[k]=clamp(Math.round(G.st[k]),0,100)}

// ===================== 交易 =====================
function openPos(k,dir,lev,amt){
  amt=Math.min(amt,G.cash);if(amt<100||lev>levCap())return false;
  const fee=amt*lev*feeRate(amt*lev);G.cash-=amt;
  G.pos.push({k,dir,lev,margin:amt-fee,entry:G.prices[k],id:Date.now()+R()});
  log(`${dir>0?'做多':'做空'}${ASSETS[k].n} ${money(amt)}×${lev}倍`);sfx('buy');save();return true;
}
function closePos(id){
  const i=G.pos.findIndex(p=>p.id===id);if(i<0)return;const p=G.pos[i];
  const v=Math.max(0,posValue(p));const nt=Math.abs(p.margin*p.lev)*(G.prices[p.k]/p.entry);const fee=Math.min(v,nt*feeRate(nt));
  G.cash+=Math.max(0,v-fee);G.pos.splice(i,1);
  const pl=v-fee-p.margin;sfx(pl>0?'coin':'sell');log(`平仓${ASSETS[p.k].n}，盈亏${money(pl)}`);save();
}
// 手续费+冲击成本：仓位越大，滑点越大
function feeRate(nt){return .001+clamp(nt/3e10,0,.04)}
// 外部冲击（黑天鹅等）
function shock(m){AK.forEach(k=>{if(m[k])G.prices[k]*=1+m[k]});const liq=checkLiq();return liq}
function checkLiq(intra){
  let lost=0,names=[];
  G.pos=G.pos.filter(p=>{
    let v=posValue(p);
    if(intra&&p.lev>1){const A=ASSETS[p.k];const adv=p.dir*(G.prices[p.k]/p.entry-1)-R()*A.sd[G.regime]/100*.6;if(1+p.lev*adv<=0)v=0}
    if(v<=p.margin*.02){lost+=p.margin;names.push(ASSETS[p.k].n);return false}return true});
  return {lost,names};
}

// ===================== 季度结算 =====================
function endQuarter(){
  if(G.over||G.queue.length)return;
  const startNw=G.qStartNw;const startPos=posTotal();
  // 1 行情
  G.prev={...G.prices};G.regime=G.next.regime;
  AK.forEach(k=>G.prices[k]*=1+G.next.r[k]);
  // 杠杆资金成本
  G.pos.forEach(p=>{p.margin-=p.margin*(p.lev-1)*.006});
  const liq=checkLiq(true);
  const tradePL=posTotal()-startPos-liq.lost;
  // 2 收入支出
  let inc=0,exp=livingCost();
  if(G.career==='employed')inc+=G.salary;
  if(G.mortgage>0){const pay=Math.min(G.mortgage,G.housePrice*.012);exp+=pay;G.mortgage-=pay*.6}
  let fundTxt='';
  const ret=startNw>1?tradePL/Math.max(startNw,1):0;
  G.lastRet=ret;
  if(G.career==='fund'||G.career==='hedge'){
    const fr=clamp(ret,-.9,3);
    const mfee=G.aum*.005,pfee=fr>0?G.aum*fr*.2:0;
    G.aum*=1+fr;inc+=mfee+pfee;
    if(fr>.05)G.aum*=1+G.st.fame/400;
    if(fr<-.1){G.flags.redeem=1}
    fundTxt=`基金规模 ${money(G.aum)}，管理费+业绩提成 ${money(mfee+pfee)}`;
  }
  G.cash+=inc-exp;
  if(G.cash<0){G.cash*=1.02;G.debtTurns++}else G.debtTurns=0;
  // 3 状态变化
  const sm=hasT('钢铁心态')?.5:hasT('玻璃心')?1.5:1;
  const n=Math.max(nw(),1);const expo=G.pos.reduce((s,p)=>s+p.margin*p.lev,0)/n;
  let dS=-6+Math.min(expo*3,12)+(ret<0?-ret*45:0)+(G.cash<0?8:0)+(G.career==='hedge'?4:G.career==='fund'?2:0);
  if(hasT('佛系'))dS-=4;
  G.st.stress+=dS>0?dS*sm:dS;
  G.st.mood+=ret>=0?Math.min(ret*30,10):ret*40*sm;
  G.st.mood+=(55-G.st.mood)*.06+(G.st.stress>70?-4:0);
  let hd=.35+(G.age>=40?.5:0)+(G.age>=50?.8:0)+(G.st.stress>70?2:G.st.stress>50?.6:G.st.stress<35?-.6:0)+(hasT('夜猫子')?1:0)+G.alcohol*.7;
  if(hasT('身体倍儿棒'))hd*=.5;hd*=1.2-G.attr.body/250;
  G.st.health-=hd;
  G.st.family-=(G.partner||G.kids?3:1.5)+(hasT('工作狂')?2:0)+(G.career==='hedge'?2:0);
  G.st.comply+=2;
  if(ret>.15)G.st.fame+=Math.min(ret*15,10)+(G.career!=='employed'?2:0);
  if(ret<-.25)G.st.fame-=4;
  normSt();
  // 4 时间推进
  G.quarters++;G.q++;if(G.q>4){G.q=1;G.year++;G.age++;if(G.career==='employed')G.salary=Math.round(G.salary*1.03)}
  const now=nw();G.hist.push(now);G.peakNw=Math.max(G.peakNw,now);
  // 5 报告
  const rows=AK.map(k=>[ASSETS[k].n,G.prices[k]/G.prev[k]-1]);
  G.queue.push({type:'report',title:`${G.year-(G.q===1?1:0)}年第${G.q===1?4:G.q-1}季度 · ${REG[G.regime]}`,rows,tradePL,ret,liq,inc,exp,fundTxt,now});
  if(liq.names.length)life(`${liq.names.join('、')}仓位爆仓，亏掉${money(liq.lost)}`);
  // 6 事件
  rollEvents();
  // 7 职业
  careerCheck();
  startQuarter();
  save();
}

    const tw=pool.reduce((s,x)=>s+x[1],0);if(!tw)break;let x=R()*tw;

function renderStart(){
  if(!draft)draft=genChar();const c=draft,a=c.attr;
  $('app').innerHTML=`<h1>📈 天才交易员模拟器</h1><div class="dim">从散户到传奇，从22岁到55岁。盈亏只是人生的一部分。</div>
  <div class="card" style="margin-top:12px"><div class="row"><div style="font-size:22px;font-weight:800">${c.name}</div><span class="chip">${c.gender}</span><span class="chip">${c.age}岁</span><span class="sp"></span><span class="chip g">${c.bg}</span></div>
  <div class="dim" style="margin:4px 0">${c.city} · ${c.job} · 季薪 ${money(c.salary)} · 启动资金 <b class="gold">${money(c.cash)}</b></div>
  <div class="attr">${[['智力',a.int],['心态',a.mind],['胆识',a.nerve],['体质',a.body],['魅力',a.charm],['运气',a.luck]].map(x=>`<div><b class="mono">${x[1]}</b><span class="dim">${x[0]}</span></div>`).join('')}</div>
  ${c.traits.map(t=>`<div style="margin-top:6px"><span class="chip ${TRAITS[t].c}">${t}</span><span class="dim" style="font-size:12px">${TRAITS[t].d}</span></div>`).join('')}</div>
  <div class="card dim" style="font-size:13px">玩法：每回合一个季度。用<b class="gold">行动点</b>研究市场、健身、陪家人；在<b class="gold">市场</b>里做多做空、加杠杆；点<b class="gold">结束本季</b>看盈亏和人生事件。健康归零、破产或坐牢都会提前结束。55岁退休结算。<br><span class="up">红涨</span> <span class="down">绿跌</span>。</div>
  <div class="row"><button class="btn" style="flex:1" onclick="draft=genChar();sfx('research');render()">🎲 重新投胎</button><button class="btn pri" style="flex:2" onclick="newGame(draft);draft=null;sfx('career');render()">开始人生</button></div>`;
  $('foot').innerHTML='';$('modal').innerHTML='';
}
function render(){
  if(!G){renderStart();return}
  if(G.end&&!G.queue.length){renderEnd();return}
  const n=nw(),dq=G.hist.length>1?G.hist[G.hist.length-1]-G.hist[G.hist.length-2]:0;const s=G.st;
  const sigHtml=k=>{const sg=G.signals[k];if(!sg)return '';return `<span class="sig ${sg.dir>0?'up':'down'}" style="background:${sg.dir>0?'rgba(255,77,79,.12)':'rgba(24,194,122,.12)'}">研判${sg.dir>0?'↑':'↓'} ${Math.round(sg.conf*100)}%</span>`};
  $('app').innerHTML=`
  <div class="row"><div><div style="font-weight:800;font-size:17px">${G.name} <span class="dim" style="font-size:13px;font-weight:400">${G.age}岁 · ${G.city}</span></div>
  <div class="dim" style="font-size:12px">${G.year}年第${G.q}季度 · ${CAREERS[G.career]}${G.flags.legend?' · <span class="gold">交易传奇</span>':''}</div></div><span class="sp"></span>
  <button class="btn sm" style="padding:4px 7px" onclick="toggleSfx()">${SND.sfx?'🔊':'🔇'}</button><button class="btn sm" style="padding:4px 7px;${SND.bgm?'':'opacity:.4'}${MY.audio?';border-color:var(--gold)':''}" onclick="musicMenu()">🎵</button><div style="text-align:right;margin-left:4px"><div class="dim" style="font-size:11px">距退休</div><div class="mono">${Math.max(0,(55-G.age)*4-(G.q-1))}季</div></div></div>
  <div class="card" style="margin-top:8px"><div class="dim" style="font-size:12px">总资产</div>
  <div class="row"><div class="nw mono ${n<0?'down':''}">${money(n)}</div><span class="sp"></span><div class="mono ${cls(dq)}" style="font-size:13px">上季 ${dq>=0?'+':''}${money(dq)}</div></div>
  <div class="dim mono" style="font-size:12px">现金 ${money(G.cash)} · 持仓 ${money(posTotal())}${G.house?` · 房产 ${money(G.house-G.mortgage)}`:''}${G.aum?` · 基金规模 ${money(G.aum)}`:''}</div>
  ${spark(G.hist)}
  <div class="bars" style="margin-top:8px">${bar('健康',s.health,'var(--down)')}${bar('压力',s.stress,'',1)}${bar('心态',s.mood,'var(--down)')}${bar('家庭',s.family,'var(--down)')}${bar('声望',s.fame,'var(--blue)',2)}${bar('合规',s.comply,'var(--down)')}</div>
  <div style="margin-top:6px">${G.traits.map(t=>`<span class="chip ${TRAITS[t].c}">${t}</span>`).join('')}${G.partner?`<span class="chip">${G.partner==='married'?'已婚':'恋爱中'} · ${G.partnerName}</span>`:''}${G.kids?`<span class="chip">孩子×${G.kids}</span>`:''}${G.alcohol>=2?'<span class="chip r">酗酒</span>':''}</div></div>

  <div class="card"><div class="row"><h2 style="margin:0">市场</h2><span class="chip ${G.regime==='bull'?'r':G.regime==='bear'||G.regime==='crash'?'gr':''}">${REG[G.regime]}</span><span class="sp"></span><span class="dim" style="font-size:12px">杠杆上限 ${levCap()}×</span></div>
  <div class="dim" style="font-size:12px;margin:6px 0 2px">📰 ${G.news}</div>
  ${AK.map(k=>{const ch=G.prices[k]/G.prev[k]-1;return `<div class="asset"><div class="nm"><div>${ASSETS[k].n}</div>${sigHtml(k)}</div><div class="pr mono"><div>${G.prices[k]>=1000?G.prices[k].toFixed(0):G.prices[k].toFixed(2)}</div><div class="${cls(ch)}" style="font-size:12px">${pct(ch)}</div></div><span class="sp"></span><button class="btn sm long" onclick="openTrade('${k}',1)">做多</button><button class="btn sm short" onclick="openTrade('${k}',-1)">做空</button></div>`}).join('')}
  ${G.pos.length?`<div style="margin-top:8px;font-weight:700">持仓</div>`+G.pos.map(p=>{const v=posValue(p),pl=v-p.margin,liqMove=-1/p.lev;return `<div class="pos"><div style="flex:1"><span class="${p.dir>0?'up':'down'}">${p.dir>0?'多':'空'}</span> ${ASSETS[p.k].n} ×${p.lev}<div class="dim mono" style="font-size:11px">本金${money(p.margin)} · 爆仓线${p.lev>1?pct(liqMove*p.dir,0):'无'}</div></div><div class="mono ${cls(pl)}" style="text-align:right">${money(pl)}<div style="font-size:11px">${pct(pl/p.margin)}</div></div><button class="btn sm" onclick="closePos(${p.id});render()">平仓</button></div>`}).join(''):''}</div>

  <div class="card"><div class="row"><h2 style="margin:0">本季行动</h2><span class="sp"></span><span class="gold mono">行动点 ${'●'.repeat(Math.max(0,G.ap))}${'○'.repeat(Math.max(0,apMax()-G.ap))}</span></div>
  <div class="acts" style="margin-top:8px">${ACTS.filter(a=>!a.need||a.need()).map(a=>`<button class="btn act" ${G.ap<a.ap?'disabled':''} onclick="doAct('${a.id}')"><b>${a.ic}</b>${a.n}${a.ap>1?`<br><span class="dim">${a.ap}点</span>`:''}</button>`).join('')}</div>
  ${G.career==='employed'?`<button class="btn" style="width:100%;margin-top:8px" onclick="askQuit()">辞职，全职交易</button>`:''}</div>

  <div class="card"><h2>日志</h2><div class="log">${G.log.map(l=>`<div>${esc(l)}</div>`).join('')||'<div>还没有记录</div>'}</div>
  <div class="row" style="margin-top:8px"><button class="btn sm" onclick="showLife()">人生轨迹</button><span class="sp"></span><button class="btn sm" onclick="if(confirmRestart())render()">重开一局</button></div></div>`;
  $('foot').innerHTML=`<div class="foot"><button class="btn pri" onclick="sfx('turn');endQuarter();render()">结束本季 ▶</button></div>`;
  renderModal();
}
let restartArm=0;
function confirmRestart(){if(Date.now()-restartArm<3000){G=null;try{localStorage.removeItem('trader_sim_v1')}catch(e){}return true}restartArm=Date.now();toast('再点一次确认重开');return false}
function askQuit(){G.queue.push({type:'quit',title:'辞职全职交易？',desc:`你将失去每季${money(G.salary)}的工资，但获得多1个行动点、5倍杠杆上限。建议至少攒够两年生活费（约${money(livingCost()*8)}）。`,choices:[{t:'辞职！',s:''},{t:'再想想',s:''}]});render()}
function showLife(){G.queue.push({type:'life'});render()}
function openTrade(k,dir){trade={k,dir,lev:1,frac:.25};renderModal()}
function renderModal(){
  const el=$('modal');
  if(MY.menu){
    el.innerHTML=`<div class="mask" onclick="if(event.target===this){MY.menu=false;renderModal()}"><div class="modal"><h3>🎵 背景音乐</h3>
    <p class="dim">当前：${MY.audio?'<span class="gold">'+esc(MY.name)+'</span>（你的文件，只保存在这台手机上，不会上传）':'内置音乐（跟着行情变调）'}</p>
    <button class="btn choice" onclick="toggleBgm();renderModal()">${SND.bgm?'⏸ 关闭背景音乐':'▶️ 打开背景音乐'}</button>
    <label class="btn choice" style="position:relative;overflow:hidden">📂 选择我的音乐<small>从手机里选一首 mp3 / m4a，循环播放</small><input type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg" onchange="onPickMusic(this)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px"></label>
    ${MY.audio?`<div style="margin-top:10px">音量</div><input type="range" min="0" max="1" step="0.05" value="${MY.vol}" style="width:100%" oninput="setMyVol(+this.value)">
    <button class="btn choice" onclick="clearMusic()">↩️ 恢复内置音乐</button>`:''}
    <button class="btn pri choice" style="text-align:center" onclick="MY.menu=false;renderModal()">好的</button></div></div>`;return}
  if(trade){const t=trade,amt=Math.max(0,G.cash)*t.frac;const caps=[1,2,3,5,10].filter(x=>x<=levCap());if(levCap()===7||levCap()===12)caps.push(levCap());
    el.innerHTML=`<div class="mask" onclick="if(event.target===this){trade=null;renderModal()}"><div class="modal"><h3><span class="${t.dir>0?'up':'down'}">${t.dir>0?'做多':'做空'}</span> ${ASSETS[t.k].n}</h3>
    <div class="dim">现价 <span class="mono">${G.prices[t.k].toFixed(2)}</span> · 可用现金 <span class="mono">${money(G.cash)}</span></div>
    ${G.signals[t.k]?`<p>你的研判：${G.signals[t.k].dir>0?'<span class="up">看涨</span>':'<span class="down">看跌</span>'}，把握度 ${Math.round(G.signals[t.k].conf*100)}%</p>`:'<p class="dim">还没研究过这个品种，下注全凭感觉。</p>'}
    <div style="margin-top:8px">投入</div><div class="opts">${[.1,.25,.5,1].map(f=>`<button class="btn sm ${t.frac===f?'on':''}" onclick="trade.frac=${f};renderModal()">${f*100}%</button>`).join('')}</div>
    <div>杠杆</div><div class="opts">${caps.map(l=>`<button class="btn sm ${t.lev===l?'on':''}" onclick="trade.lev=${l};renderModal()">${l}×</button>`).join('')}</div>
    <p class="mono">本金 ${money(amt)} · 名义仓位 ${money(amt*t.lev)}${t.lev>1?`<br><span class="warn" style="color:var(--warn)">价格反向波动 ${(100/t.lev).toFixed(0)}% 即爆仓，季内波动也算</span>`:''}</p>
    <div class="row"><button class="btn" style="flex:1" onclick="trade=null;renderModal()">取消</button><button class="btn pri" style="flex:2" ${amt<100?'disabled':''} onclick="if(openPos(trade.k,trade.dir,trade.lev,${amt})){trade=null;render()}">确认下单</button></div></div></div>`;return}
  const m=G&&G.queue[0];if(!m){el.innerHTML='';SND.lastModal=null;return}
  if(SND.lastModal!==m){SND.lastModal=m;modalSound(m)}
  let body='';
  if(m.type==='report'){
    body=`<h3>${m.title}</h3><table class="rep">${m.rows.map(r=>`<tr><td>${r[0]}</td><td class="mono ${cls(r[1])}">${pct(r[1])}</td></tr>`).join('')}</table>
    <table class="rep" style="margin-top:8px"><tr><td>交易盈亏</td><td class="mono ${cls(m.tradePL)}">${m.tradePL>=0?'+':''}${money(m.tradePL)}（${pct(m.ret)}）</td></tr>
    ${m.liq.names.length?`<tr><td class="up">💥 爆仓</td><td class="mono up">${m.liq.names.join('、')} -${money(m.liq.lost)}</td></tr>`:''}
    <tr><td>收入</td><td class="mono">${money(m.inc)}</td></tr><tr><td>生活开支</td><td class="mono">-${money(m.exp)}</td></tr>
    <tr><td><b>总资产</b></td><td class="mono"><b>${money(m.now)}</b></td></tr></table>${m.fundTxt?`<p class="dim">${m.fundTxt}</p>`:''}
    <button class="btn pri choice" style="text-align:center" onclick="ack()">继续</button>`}
  else if(m.type==='event'||m.type==='career'||m.type==='quit'){
    body=`<h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p>${m.choices.map((c,i)=>`<button class="btn choice" ${(c.cost>0&&c.cost>G.cash)?'disabled':''} onclick="${m.type==='quit'?`quit(${i})`:`choose(${i})`}">${esc(c.t)}${c.s||(c.cost>0&&c.cost>G.cash)?`<small>${esc(c.s||'')}${(c.cost>0&&c.cost>G.cash)?'（钱不够）':''}</small>`:''}</button>`).join('')}`}
  else if(m.type==='result'){body=`<h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p><button class="btn pri choice" style="text-align:center" onclick="ack()">好的</button>`}
  else if(m.type==='life'){body=`<h3>人生轨迹</h3><div class="log" style="max-height:60vh">${G.life.map(l=>`<div>${esc(l)}</div>`).join('')}</div><button class="btn pri choice" style="text-align:center" onclick="G.queue.shift();render()">关闭</button>`}
  el.innerHTML=`<div class="mask"><div class="modal">${body}</div></div>`;
}
function modalSound(m){
  if(m.type==='report'){if(m.liq.names.length)sfx('boom');else if(m.ret>.15)sfx('bigprofit');else if(m.tradePL>0)sfx('profit');else if(m.tradePL<0)sfx('loss');return}
  if(m.type==='career')return sfx('career');
  if(m.type==='event'){const alarm=['csrc','swan','exch','faint','divorce','tax','redeem','tilt','impulse'];return sfx(alarm.includes(m.id)?'alarm':'event')}
  if(m.type==='result'){const t=m.desc;return sfx(/亏|损失|爆仓|罚|失去|没中|不了了之|缩水|还不上|-\d/.test(t)?'bad':'good')}
}
function quit(i){G.queue.shift();if(i===0)toPro();save();render()}
function renderEnd(){
  const e=G.end,n=nw();
  if(!SND.endPlayed){SND.endPlayed=1;sfx(G.over==='jail'?'jail':e[3]==='r'?'sad':e[3]==='g'?'win':'good')}
  $('app').innerHTML=`<div class="card" style="margin-top:20px"><div class="big">${e[0]}</div><div class="title" style="color:${e[3]==='r'?'var(--up)':e[3]==='g'?'var(--gold)':'var(--txt)'}">${e[1]}</div>
  <p style="text-align:center;color:#c4d0dc">${e[2]}</p>
  <table class="rep"><tr><td>${G.name}</td><td>${G.age}岁 · ${CAREERS[G.career]}</td></tr><tr><td>最终资产</td><td class="mono gold">${money(n)}</td></tr><tr><td>巅峰资产</td><td class="mono">${money(G.peakNw)}</td></tr>
  <tr><td>出身</td><td>${G.bg} · ${G.city}</td></tr><tr><td>健康 / 家庭 / 声望</td><td class="mono">${G.st.health} / ${G.st.family} / ${G.st.fame}</td></tr></table>
  <div style="margin-top:10px" class="dim">资产曲线</div>${spark(G.hist,300,80)}</div>
  <div class="card"><h2>人生轨迹</h2><div class="log" style="max-height:260px">${G.life.map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>`;
  $('foot').innerHTML=`<div class="foot"><button class="btn pri" onclick="G=null;try{localStorage.removeItem('trader_sim_v1')}catch(e){};render()">再活一次 ↻</button></div>`;
  $('modal').innerHTML='';
}
G=load();
if(G&&(!G.st||!G.prices))G=null;
render();
</script>
</body>
</html>
