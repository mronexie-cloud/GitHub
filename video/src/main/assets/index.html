<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E0E12">
<title>AI成片</title>
<style>
/* AI成片：主题/文案 → 分镜 → 风格动画 + 免费配音 + 字幕 + zlc 水印 → 手机本地导出 MP4。 */
:root{--bg:#0E0E12;--card:#18181F;--card2:#20202A;--line:#2B2B36;--ink:#EDEDF2;--muted:#8C8C9C;
  --acc:#FFC83D;--acc-dk:#B88A12;--red:#FF5A4E;--green:#3DD68C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh}
.scr{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 100px);display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px;min-height:44px}
.top h1{margin:0;font-size:24px;flex:1;letter-spacing:1px}
.top h1 b{color:var(--acc)}
.top h2{margin:0;font-size:18px;flex:1}
.ib{border:0;background:var(--card2);width:40px;height:40px;border-radius:12px;font-size:19px;cursor:pointer;flex:none}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.card h3 .n{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#111;font-size:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--ink);color:#111}
input[type=text],input[type=password],textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:90px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 13px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--acc);background:rgba(255,200,61,.14);color:var(--acc);font-weight:700}
.btn{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px;background:var(--card2);cursor:pointer;width:100%}
.btn.pri{background:var(--acc);color:#141414}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.45}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.8;margin-top:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
.styles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sty{border:2px solid transparent;background:var(--card2);border-radius:14px;padding:6px;cursor:pointer;text-align:center}
.sty.on{border-color:var(--acc)}
.sty canvas{width:100%;aspect-ratio:9/16;border-radius:9px;display:block;background:#000}
.sty b{display:block;font-size:13px;margin-top:6px}
.sty small{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.warn{background:rgba(255,200,61,.1);border:1px solid rgba(255,200,61,.35);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55}
.err{background:rgba(255,90,78,.12);border:1px solid rgba(255,90,78,.4);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55;word-break:break-all}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.sticky>div{max-width:492px;margin:0 auto}
.range{display:flex;align-items:center;gap:10px}.range input{flex:1;accent-color:var(--acc)}
/* editor */
.pv{display:flex;gap:12px;align-items:flex-start}
.pv canvas{width:150px;aspect-ratio:9/16;border-radius:12px;background:#000;flex:none}
.pv .side{flex:1;display:flex;flex-direction:column;gap:8px}
.sc{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent}
.sc.on{border-color:var(--acc)}
.sc-h{display:flex;align-items:center;gap:6px}
.sc-h .no{font-weight:900;color:var(--acc);width:26px}
.sc-h select{flex:1;padding:7px 8px}
.sc-h .mini{border:0;background:var(--card2);border-radius:9px;width:34px;height:34px;cursor:pointer}
.sc label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.sc textarea{min-height:64px}
.add{border:1px dashed var(--line);background:none;border-radius:14px;padding:12px;color:var(--muted);cursor:pointer;font-weight:700}
/* render */
.big{font-size:56px;font-weight:900;text-align:center;color:var(--acc);margin:10px 0 0}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .2s}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.step.on{color:var(--ink);font-weight:700}.step.ok{color:var(--green)}
video{width:100%;max-height:62vh;border-radius:16px;background:#000}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:#2a2a35;color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
a{color:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<!-- mp4-muxer by Vanilagy, MIT licence (see THIRD_PARTY.txt) -->
<script src="mp4-muxer.min.js"></script>
<script>
"use strict";
// ============================================================
//  基本设置
// ============================================================
const W=1080,H=1920,FPS=30;
const VOICES=[
  {id:'zh-CN-YunxiNeural',name:'云希',desc:'男声 · 青年'},
  {id:'zh-CN-XiaoxiaoNeural',name:'晓晓',desc:'女声 · 温柔'},
  {id:'zh-CN-YunjianNeural',name:'云健',desc:'男声 · 解说'},
  {id:'zh-CN-XiaoyiNeural',name:'晓伊',desc:'女声 · 活泼'},
  {id:'zh-CN-YunyangNeural',name:'云扬',desc:'男声 · 新闻'},
  {id:'system',name:'手机语音',desc:'离线 · 备用'},
];
const KINDS={cover:'封面',point:'观点',number:'数字',list:'列表',compare:'对比',quote:'金句',end:'结尾'};
const GLM_URL='https://open.bigmodel.cn/api/paas/v4/chat/completions';

// ============================================================
//  存档（草稿、设置）
// ============================================================
const KEY='aivideo-v1';
const defState=()=>({set:{key:'',model:'glm-4-flash',quality:'1080',mark:'zlc'},
  p:{mode:'ai',topic:'',secs:60,title:'',script:'',style:'s02',voice:'zh-CN-YunxiNeural',rate:0,scenes:[]}});
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t),d=defState();return{set:Object.assign(d.set,o.set||{}),p:Object.assign(d.p,o.p||{})};}}catch(e){}return defState();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

// ============================================================
//  原生桥（安卓 App 里才有；浏览器里走降级）
// ============================================================
const hasNative=!!(window.Android&&Android.call);
const pending={};let seq=0;
window.__nativeCb=(id,ok,payload)=>{const p=pending[id];if(!p)return;delete pending[id];ok?p.res(payload):p.rej(new Error(payload));};
function nat(method,args){return new Promise((res,rej)=>{const id='n'+(++seq);pending[id]={res,rej};Android.call(id,method,JSON.stringify(args||{}));});}

// ============================================================
//  小工具
// ============================================================
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,s,d)=>clamp((t-s)/d);
const E={out:t=>1-Math.pow(1-t,3),inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,back:t=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}};
function toast(t){const o=$('.toast');if(o)o.remove();const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
const uid=()=>Math.random().toString(36).slice(2,9);
const plain=s=>String(s||'').replace(/\s+/g,'');
function fmtTime(s){s=Math.max(0,s);const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0');}

// ============================================================
//  文案 → 分镜
// ============================================================
function newScene(kind,o){return Object.assign({id:uid(),kind,heading:'',text:'',keyword:'',sub:'',number:'',unit:'',items:[]},o||{});}
const SYS=`你是一位擅长做知识类竖屏短视频的编剧，风格口语化、有钩子、信息密度高。
根据用户给的主题，输出一个 JSON 对象（只输出 JSON，不要解释，不要代码块），格式：
{"title":"视频标题，不超过16字",
 "scenes":[
  {"kind":"cover","heading":"封面大标题，不超过14字","sub":"一句英文副标题","text":"开头钩子旁白"},
  {"kind":"point","heading":"这一段的小标题，不超过12字","keyword":"2到6字关键词","text":"旁白"},
  {"kind":"number","number":"纯数字","unit":"单位如%、倍、年","heading":"这个数字说明什么，不超过12字","text":"旁白"},
  {"kind":"list","heading":"小标题","items":["要点1，不超过10字","要点2","要点3"],"text":"旁白"},
  {"kind":"compare","heading":"对比什么","items":["A标签:数值","B标签:数值"],"text":"旁白"},
  {"kind":"quote","heading":"一句金句，不超过24字","keyword":"出处或说话人","text":"旁白"},
  {"kind":"end","heading":"结尾一句话，不超过14字","text":"结尾旁白，可以引导关注"}
 ]}
规则：
1. 第一个分镜必须是 cover，最后一个必须是 end，中间灵活组合 point/number/list/compare/quote，同一种不要连续超过两次。
2. 每个分镜的旁白 text 是要读出来的话，20到60字，口语化，像跟朋友聊天。
3. 不要编造具体统计数字。只有广为人知、确定的数字才能用 number 或 compare；没把握就用 point 或 list。
4. heading 和 items 要短，适合大字显示在屏幕上；旁白里不要出现"如图所示"之类的话。`;
function sceneCountFor(secs){return secs<=30?[4,5]:secs<=60?[6,8]:[8,10];}
async function aiWrite(topic,secs){
  const key=S.set.key.trim();
  if(!key)throw new Error('还没有填智谱 API Key，请先到设置里填写（免费）');
  const [a,b]=sceneCountFor(secs);
  const body={model:S.set.model||'glm-4-flash',temperature:0.8,messages:[{role:'system',content:SYS},
    {role:'user',content:`主题：${topic}\n目标时长：约 ${secs} 秒，旁白总字数约 ${Math.round(secs*4.3)} 字，共 ${a} 到 ${b} 个分镜。`}]};
  let status,text;
  if(hasNative){const r=JSON.parse(await nat('post',{url:GLM_URL,key,body:JSON.stringify(body)}));status=r.status;text=r.body;}
  else{const r=await fetch(GLM_URL,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify(body)});status=r.status;text=await r.text();}
  let j;try{j=JSON.parse(text);}catch(e){throw new Error('AI 返回的不是 JSON：'+text.slice(0,200));}
  if(status>=400||j.error){const m=(j.error&&(j.error.message||j.error.code))||text.slice(0,200);
    throw new Error(status===401?'API Key 不对或已失效，请到设置里检查':'AI 调用失败（'+status+'）：'+m);}
  const content=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(!content)throw new Error('AI 没有返回内容');
  return parseScript(content,topic);
}
function parseScript(content,topic){
  const a=content.indexOf('{'),b=content.lastIndexOf('}');
  if(a<0||b<a)throw new Error('AI 返回的格式不对，请再点一次');
  let o;try{o=JSON.parse(content.slice(a,b+1));}catch(e){throw new Error('AI 返回的格式不对，请再点一次');}
  const cut=(s,n)=>String(s==null?'':s).trim().slice(0,n);
  let scenes=(Array.isArray(o.scenes)?o.scenes:[]).map(x=>{
    const k=KINDS[x.kind]?x.kind:'point';
    return newScene(k,{heading:cut(x.heading,30),text:cut(x.text,160),keyword:cut(x.keyword,12),sub:cut(x.sub,40),
      number:cut(x.number,12),unit:cut(x.unit,6),items:(Array.isArray(x.items)?x.items:[]).map(i=>cut(i,24)).filter(Boolean).slice(0,5)});
  }).filter(s=>s.heading||s.text);
  if(!scenes.length)throw new Error('AI 没写出分镜，请换个说法再试');
  if(scenes[0].kind!=='cover')scenes.unshift(newScene('cover',{heading:cut(o.title||topic,14),text:''}));
  if(scenes[scenes.length-1].kind!=='end')scenes.push(newScene('end',{heading:'你怎么看？',text:'你怎么看？评论区聊聊。'}));
  scenes.forEach(s=>{if(s.kind==='number'&&!/\d/.test(s.number))s.kind='point';if((s.kind==='list'||s.kind==='compare')&&s.items.length<2)s.kind='point';});
  return{title:cut(o.title||topic,20),scenes};
}
// 没有 AI 时：把自己写的文案按段落/句子切成分镜
function autoScenes(title,text){
  text=String(text||'').replace(/\r/g,'').trim();
  if(!text)throw new Error('先写点文案吧');
  let chunks=text.split(/\n\s*\n|\n/).map(s=>s.trim()).filter(Boolean);
  if(chunks.length<3){
    const sents=text.replace(/\n/g,'').split(/(?<=[。！？!?；;])/).map(s=>s.trim()).filter(Boolean);
    chunks=[];let cur='';
    sents.forEach(s=>{if((cur+s).length>56&&cur){chunks.push(cur);cur=s;}else cur+=s;});
    if(cur)chunks.push(cur);
  }
  const firstClause=s=>(s.split(/[，,：:。！？!?；;]/)[0]||s).trim().slice(0,14);
  const quoted=s=>{const m=s.match(/[「“"《]([^」”"》]{2,8})[」”"》]/);return m?m[1]:'';};
  const scenes=chunks.map((c,i)=>{
    if(i===0)return newScene('cover',{heading:(title||firstClause(c)).slice(0,14),text:c});
    if(i===chunks.length-1&&chunks.length>2)return newScene('end',{heading:firstClause(c),text:c});
    const num=c.match(/(\d+(?:\.\d+)?)\s*(%|％|倍|万|亿|岁|年|天|小时|分钟|次|人)/);
    if(num)return newScene('number',{number:num[1],unit:num[2].replace('％','%'),heading:firstClause(c.replace(num[0],'')||c),text:c});
    const parts=c.split(/[、；;]/).map(s=>s.split(/[，,。！？!?]/)[0].trim()).filter(Boolean);
    if(parts.length>=3&&parts.every(p=>p.length<=14))return newScene('list',{heading:title?title.slice(0,12):'要点',items:parts.slice(0,4),text:c});
    return newScene('point',{heading:firstClause(c),keyword:quoted(c),text:c});
  });
  if(scenes.length===1)scenes.push(newScene('end',{heading:'关注我，下期见',text:''}));
  return{title:title||scenes[0].heading,scenes};
}

// ============================================================
//  时间线：每个分镜的时长、配音位置、字幕
// ============================================================
function speakLen(t){return plain(t).replace(/[，。！？、；：,.!?;:“”"'（）()]/g,'').length;}
function estDur(text){const n=speakLen(text);return n?Math.max(1.2,n/4.6/(1+(S.p.rate||0)/100)):0;}
function splitSubs(text){
  const out=[];
  String(text||'').split(/[，。！？；、,.!?;：:\n]+/).map(s=>s.trim()).filter(Boolean).forEach(p=>{
    if(p.length<=15){out.push(p);return;}
    const k=Math.ceil(p.length/14),L=Math.ceil(p.length/k);
    for(let i=0;i<p.length;i+=L)out.push(p.slice(i,i+L));
  });
  return out;
}
function makeSubs(text,a0,ad){
  const parts=splitSubs(text);if(!parts.length||ad<=0)return[];
  const tot=parts.reduce((x,p)=>x+p.length,0);let t=a0;
  return parts.map(p=>{const d=ad*p.length/tot;const r={a:t,b:t+d,text:p};t+=d;return r;});
}
function buildTimeline(scenes,durs){
  let T=0;const items=[];
  scenes.forEach((s,i)=>{
    const ad=durs?durs[i]:estDur(s.text),lead=0.3,tail=0.45;
    let d=lead+ad+tail;d=Math.max(d,(s.kind==='cover'||s.kind==='end')?3:2.6);
    items.push({s,i,start:T,dur:d,a0:T+lead,ad,subs:makeSubs(s.text,T+lead,ad)});T+=d;
  });
  let ch=0;items.forEach(it=>{if(it.s.kind!=='cover'&&it.s.kind!=='end')ch++;it.chapter=ch;});
  return{items,total:T,n:scenes.length,chapters:ch,memo:new Map()};
}

// ============================================================
//  画布工具
// ============================================================
const FAM={sans:'"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Source Han Sans SC","Microsoft YaHei",sans-serif',
  serif:'"Noto Serif CJK SC","Noto Serif SC","Songti SC",serif',mono:'"DejaVu Sans Mono","Roboto Mono",monospace'};
function font(ctx,size,weight,fam){ctx.font=`${weight||700} ${size}px ${FAM[fam||'sans']}`;}
const NO_START='，。！？、；：”’）》」』,.!?;:)';
function wrap(ctx,text,maxW){
  const toks=String(text||'').match(/[A-Za-z0-9%.\-+'’@#]+|\s+|[\s\S]/gu)||[];
  const lines=[];let line='';
  for(const tk of toks){
    if(tk==='\n'){lines.push(line);line='';continue;}
    const test=line+tk;
    if(line&&ctx.measureText(test).width>maxW){
      if(NO_START.includes(tk[0])){line=test;continue;}
      lines.push(line.trimEnd());line=tk.trimStart();
    }else line=test;
  }
  if(line.trim())lines.push(line.trimEnd());
  return lines;
}
function fit(ctx,text,maxW,maxLines,size,min,weight,fam){
  for(let s=size;s>=min;s-=4){font(ctx,s,weight,fam);const l=wrap(ctx,text,maxW);
    const lonely=l.length>1&&l[l.length-1].replace(/[，。！？、；：,.!?;:”’）》」』]/g,'').length<=2;
    if(l.length<=maxLines&&(!lonely||s-4<min))return{lines:l,size:s};}
  font(ctx,min,weight,fam);return{lines:wrap(ctx,text,maxW).slice(0,maxLines),size:min};
}
function memo(o,key,fn){const k=o.i+':'+key;let v=o.tl.memo.get(k);if(!v){v=fn();o.tl.memo.set(k,v);}return v;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function lines(ctx,ls,x,y,lh,align){ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ls.forEach((l,k)=>ctx.fillText(l,x,y+k*lh));}
// 一行字里把关键词换色
function richLine(ctx,text,x,y,kw,base,hi,align){
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const segs=[];if(kw&&text.includes(kw)){let r=text;while(r.includes(kw)){const k=r.indexOf(kw);if(k)segs.push([r.slice(0,k),0]);segs.push([kw,1]);r=r.slice(k+kw.length);}if(r)segs.push([r,0]);}else segs.push([text,0]);
  const wAll=ctx.measureText(text).width;let cx=align==='center'?x-wAll/2:align==='right'?x-wAll:x;
  segs.forEach(([s,h])=>{ctx.fillStyle=h?hi:base;ctx.fillText(s,cx,y);cx+=ctx.measureText(s).width;});
  return wAll;
}
function patternFor(ctx,key,make){ctx.__p=ctx.__p||{};if(!ctx.__p[key])ctx.__p[key]=ctx.createPattern(make(),'repeat');return ctx.__p[key];}
function makeCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function numParts(str){const m=String(str||'').match(/-?\d+(?:\.\d+)?/);if(!m)return null;const v=parseFloat(m[0]);const dec=(m[0].split('.')[1]||'').length;return{v,dec,pre:str.slice(0,m.index),post:str.slice(m.index+m[0].length)};}
function countUp(str,p){const n=numParts(str);if(!n)return str;const v=n.v*E.out(p);return n.pre+v.toFixed(n.dec)+n.post;}
function pairs(items){return(items||[]).slice(0,2).map(t=>{const m=String(t).split(/[:：]/);const label=(m[0]||'').trim(),val=(m.slice(1).join(':')||'').trim();const n=numParts(val);return{label,val,v:n?Math.abs(n.v):0};});}
// 描边逐渐画出来
function reveal(ctx,p,draw){ctx.save();ctx.setLineDash([3000,3000]);ctx.lineDashOffset=3000*(1-clamp(p));draw();ctx.restore();}
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}

// ============================================================
//  风格 S25：奶油纸面 · 等距模型
// ============================================================
const INK='#2B2B35',PINK='#F4A6B8',BLUE='#9CC5E8',TEAL='#8FD3C8',CREAM='#F3EBDD';
const IC=Math.cos(Math.PI/6),IS=Math.sin(Math.PI/6);
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const m=x=>Math.round(clamp(f<0?x*(1+f):x+(255-x)*f,0,255));return`rgb(${m(r)},${m(g)},${m(b)})`;}
// 以底面中心 (cx,cy) 为基准画一个等距方块，边长 a，高 h
function isoBox(ctx,cx,cy,a,h,col){
  const ox=cx,oy=cy-a*IS;const P=(x,y,z)=>[ox+(x-y)*IC,oy+(x+y)*IS-z];
  const poly=(pts,fill)=>{ctx.beginPath();pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.stroke();};
  ctx.strokeStyle='rgba(43,43,53,.55)';ctx.lineWidth=3;ctx.lineJoin='round';
  poly([P(0,a,0),P(a,a,0),P(a,a,h),P(0,a,h)],col);
  poly([P(a,0,0),P(a,a,0),P(a,a,h),P(a,0,h)],shade(col,-.18));
  poly([P(0,0,h),P(a,0,h),P(a,a,h),P(0,a,h)],shade(col,.35));
  return P(a/2,a/2,h); // 顶面中心
}

function drawFrame(ctx,tl,T,opt){
  opt=opt||{};
  const items=tl.items;let it=items[items.length-1];
  for(const x of items){if(T<x.start+x.dur){it=x;break;}}
  const t=T-it.start;const sub=(it.subs.find(z=>T>=z.a&&T<z.b+0.12)||{}).text||'';
  const st=STYLES[opt.style||S.p.style]||S02;
  ctx.save();
  st.draw(ctx,{s:it.s,i:it.i,t,d:it.dur,T,tl,chapter:it.chapter,sub,title:opt.title||S.p.title,mark:opt.mark!=null?opt.mark:S.set.mark});
  ctx.restore();
  // 开头淡入、结尾淡出
  const f=Math.max(1-clamp(T/.35),clamp((T-(tl.total-.45))/.45));
  if(f>0){ctx.fillStyle=`rgba(0,0,0,${f})`;ctx.fillRect(0,0,W,H);}
}

const audioCache=new Map();
function b64ToBuf(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
async function decode(buf){const ac=new OfflineAudioContext(2,48000,48000);return await ac.decodeAudioData(buf);}
async function voiceFor(text,voice,rate){
  text=String(text||'').trim();
  if(!speakLen(text))return{buf:null,dur:0,engine:'none'};
  const key=voice+'|'+rate+'|'+text;if(audioCache.has(key))return audioCache.get(key);
  let r;
  if(hasNative){
    const j=JSON.parse(await nat('tts',{text,voice,rate,allowSystem:true}));
    const buf=await decode(b64ToBuf(j.b64));r={buf,dur:buf.duration,engine:j.engine,edgeError:j.edgeError};
  }else{ // 浏览器预览：没有配音，用估算时长的静音
    const d=estDur(text);r={buf:null,dur:d,engine:'silent'};
  }
  audioCache.set(key,r);return r;
}
async function mixAudio(tl,voices){
  const len=Math.ceil(tl.total*48000);const ac=new OfflineAudioContext(2,len,48000);
  tl.items.forEach((it,k)=>{const v=voices[k];if(!v||!v.buf)return;const src=ac.createBufferSource();src.buffer=v.buf;src.connect(ac.destination);src.start(it.a0);});
  return await ac.startRendering();
}

let job=null;
async function pickVideoConfig(w,h){
  if(!('VideoEncoder' in window))return null;
  const br=w>=1080?6_000_000:3_000_000;
  for(const codec of ['avc1.640028','avc1.4d0028','avc1.42e028','avc1.42001f']){
    const c={codec,width:w,height:h,bitrate:br,framerate:FPS,avc:{format:'avc'}};
    try{const r=await VideoEncoder.isConfigSupported(c);if(r.supported)return c;}catch(e){}
  }
  return null;
}
async function pickAudioConfig(){
  if(!('AudioEncoder' in window))return null;
  for(const c of [{codec:'mp4a.40.2',sampleRate:48000,numberOfChannels:2,bitrate:128000,mux:'aac'},{codec:'opus',sampleRate:48000,numberOfChannels:2,bitrate:128000,mux:'opus'}]){
    try{const {mux,...cfg}=c;const r=await AudioEncoder.isConfigSupported(cfg);if(r.supported)return c;}catch(e){}
  }
  return null;
}
async function encodeWC(tl,audio,w,h,vcfg,acfg,onProg){
  const canvas=makeCanvas(w,h),ctx=canvas.getContext('2d',{alpha:false});
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:w,height:h,frameRate:FPS},
    audio:acfg?{codec:acfg.mux,numberOfChannels:2,sampleRate:48000}:undefined,fastStart:'in-memory',firstTimestampBehavior:'offset'});
  let fail=null;
  if(acfg&&audio){
    const ae=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>fail=e});const {mux,...cfg}=acfg;ae.configure(cfg);
    const L=audio.length,c0=audio.getChannelData(0),c1=audio.numberOfChannels>1?audio.getChannelData(1):c0,step=4800;
    for(let off=0;off<L;off+=step){const n=Math.min(step,L-off),d=new Float32Array(n*2);d.set(c0.subarray(off,off+n),0);d.set(c1.subarray(off,off+n),n);
      const ad=new AudioData({format:'f32-planar',sampleRate:48000,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(off/48000*1e6),data:d});ae.encode(ad);ad.close();
      if(ae.encodeQueueSize>20)await sleep(1);}
    await ae.flush();ae.close();
  }
  if(fail)throw fail;
  const ve=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>fail=e});ve.configure(vcfg);
  const frames=Math.ceil(tl.total*FPS),sc=w/W;
  for(let f=0;f<frames;f++){
    if(job&&job.cancel)throw new Error('已取消');if(fail)throw fail;
    ctx.setTransform(sc,0,0,sc,0,0);drawFrame(ctx,tl,f/FPS);
    const vf=new VideoFrame(canvas,{timestamp:Math.round(f*1e6/FPS),duration:Math.round(1e6/FPS)});
    ve.encode(vf,{keyFrame:f%(FPS*2)===0});vf.close();
    while(ve.encodeQueueSize>4){await sleep(2);if(fail)throw fail;}
    if(f%6===0){onProg(f/frames);await sleep(0);}
  }
  await ve.flush();ve.close();if(fail)throw fail;
  muxer.finalize();onProg(1);
  return new Blob([muxer.target.buffer],{type:'video/mp4'});
}
// 备用：边播边录（实时）
async function encodeMR(tl,audio,w,h,onProg){
  if(!('MediaRecorder' in window))throw new Error('这台手机不支持导出视频');
  const canvas=makeCanvas(w,h),ctx=canvas.getContext('2d',{alpha:false}),sc=w/W;
  const stream=canvas.captureStream(FPS);const ac=new AudioContext({sampleRate:48000});
  const dest=ac.createMediaStreamDestination();let src=null;
  if(audio){src=ac.createBufferSource();src.buffer=audio;src.connect(dest);}
  dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
  const mime=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:w>=1080?6e6:3e6}:{});const parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data);};
  const stopped=new Promise(r=>rec.onstop=r);
  ctx.setTransform(sc,0,0,sc,0,0);drawFrame(ctx,tl,0);rec.start(1000);await ac.resume();const t0=ac.currentTime+.05;if(src)src.start(t0);
  await new Promise((res,rej)=>{const loop=()=>{if(job&&job.cancel){rej(new Error('已取消'));return;}const T=ac.currentTime-t0;
    if(T>=tl.total){res();return;}ctx.setTransform(sc,0,0,sc,0,0);drawFrame(ctx,tl,Math.max(0,T));onProg(clamp(T/tl.total));requestAnimationFrame(loop);};loop();});
  rec.stop();await stopped;ac.close();
  const type=(mime||'video/webm').split(';')[0];return new Blob(parts,{type});
}

        <div class="muted">左边是第 <b id="pvn">${sel+1}</b> 个分镜的动画预览（没有声音，时长按字数估算）。点下面的分镜切换。</div>
        <div class="chips">${Object.values(STYLES).map(s=>`<button class="chip ${p.style===s.id?'on':''}" data-act="style" data-v="${s.id}">${s.name}</button>`).join('')}</div></div></div>
    ${p.scenes.map((s,i)=>`<div class="sc ${i===sel?'on':''}" data-act="pick" data-i="${i}">
      <div class="sc-h"><span class="no">${i+1}</span><select data-kind="${s.id}">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${s.kind===k?'selected':''}>${v}</option>`).join('')}</select>
        <button class="mini" data-act="up" data-i="${i}">↑</button><button class="mini" data-act="down" data-i="${i}">↓</button><button class="mini" data-act="del" data-i="${i}">✕</button></div>
      ${field(s,'heading','屏幕大字','短一点更好看')}
      ${extra(s)}
      ${field(s,'text','旁白（会被读出来，也是字幕）','','ta')}
    </div>`).join('')}
    <button class="add" data-act="addscene">＋ 添加分镜</button>
    <div class="sticky"><div><button class="btn pri" data-act="makevideo" ${p.scenes.length?'':'disabled'}>🎬 生成视频<small>${esc(VOICES.find(v=>v.id===p.voice)?.name||'')}配音 · ${STYLES[p.style].name} · ${S.set.quality}p · 水印 ${esc(S.set.mark||'无')}</small></button></div></div>
  </div>`;
};
after.edit=(a)=>{
  const sel=a&&a.sel!=null?a.sel:0;
  const ti=$('#ptitle');ti.oninput=()=>{S.p.title=ti.value;save();};
  document.querySelectorAll('[data-f]').forEach(el=>{el.oninput=()=>{const s=S.p.scenes.find(x=>x.id===el.dataset.id);if(!s)return;
    const k=el.dataset.f;s[k]=k==='items'?el.value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,5):el.value;save();previewDirty=true;};
    el.onclick=e=>e.stopPropagation();});
  document.querySelectorAll('select[data-kind]').forEach(el=>{el.onclick=e=>e.stopPropagation();el.onchange=()=>{const i=S.p.scenes.findIndex(x=>x.id===el.dataset.kind);if(i<0)return;S.p.scenes[i].kind=el.value;save();go('edit',{sel:i},true);};});
  startPreview(sel);
};
let previewDirty=false;
function startPreview(sel){
  const c=$('#pv');if(!c||!S.p.scenes.length)return;const g=c.getContext('2d');
  let tl=buildTimeline(S.p.scenes),it=tl.items[Math.min(sel,tl.items.length-1)],t0=performance.now();
  const loop=now=>{if(screen!=='edit')return;
    if(previewDirty){previewDirty=false;tl=buildTimeline(S.p.scenes);it=tl.items[Math.min(sel,tl.items.length-1)];}
    const t=((now-t0)/1000)%(it.dur+0.6);g.setTransform(c.width/W,0,0,c.height/H,0,0);drawFrame(g,tl,it.start+Math.min(t,it.dur-0.01));
    raf=requestAnimationFrame(loop);};
  raf=requestAnimationFrame(loop);
}

V.render=()=>`<div class="scr">
  <div class="top"><h2>正在生成视频</h2></div>
  <div class="big" id="pct">0%</div><div class="bar"><i id="bar" style="width:0%"></i></div>
  <div class="steps" id="steps"></div>
  <div class="warn">请保持屏幕亮着、不要切出 App。一分钟的视频大约要一到几分钟，手机越新越快。</div>
  <div id="rmsg"></div>
  <button class="btn" data-act="cancel">取消</button>
</div>`;
function setSteps(list,cur){const el=$('#steps');if(!el)return;el.innerHTML=list.map((s,k)=>`<div class="step ${k<cur?'ok':k===cur?'on':''}">${k<cur?'✅':k===cur?'<span class="spin"></span>':'○'} ${s}</div>`).join('');}
function setPct(x,label){const p=Math.round(clamp(x)*100);const a=$('#pct'),b=$('#bar');if(a)a.textContent=(label||'')+p+'%';if(b)b.style.width=p+'%';}

V.done=(r)=>`<div class="scr">
  <div class="top"><button class="ib" data-act="edit">‹</button><h2>完成 🎉</h2></div>
  <video src="${r.url}" controls playsinline></video>
  <div class="muted">时长 ${fmtTime(r.dur)} · ${(r.size/1048576).toFixed(1)} MB · ${r.mime.includes('mp4')?'MP4':'WebM'} · 配音：${esc(r.engine)}</div>
  ${r.note?`<div class="warn">${esc(r.note)}</div>`:''}
  <button class="btn pri" data-act="savevideo">💾 保存到相册</button>
  <div class="row"><button class="btn" data-act="share">📤 分享</button><button class="btn" data-act="edit">✏️ 改一改</button></div>
  <button class="btn" data-act="newproj">＋ 新视频</button>
  <div id="smsg"></div>
</div>`;

V.settings=()=>`<div class="scr">
  <div class="top"><button class="ib" data-act="home">‹</button><h2>设置</h2></div>
  <div class="card"><h3>AI 写文案（免费）</h3>
    <div class="muted">用的是智谱的 GLM-4-Flash 免费模型。获取 Key：手机浏览器打开 <b>bigmodel.cn</b> → 注册登录 → 右上角头像「API Key」→ 新建，复制回来贴到下面。Key 只存在这台手机上。</div>
    <input type="password" id="key" placeholder="粘贴智谱 API Key" value="${esc(S.set.key)}">
    <div><label class="muted">模型名（一般不用改）</label><input type="text" id="model" value="${esc(S.set.model)}"></div>
    <button class="btn" data-act="testkey">测试一下 Key</button><div id="kmsg"></div>
  </div>
  <div class="card"><h3>画质</h3>
    <div class="chips">${['1080','720'].map(q=>`<button class="chip ${S.set.quality===q?'on':''}" data-act="quality" data-v="${q}">${q==='1080'?'1080p 高清':'720p 更快'}</button>`).join('')}</div>
    <div class="muted">竖屏 9:16。旧手机导出失败时可以换 720p。</div>
  </div>
  <div class="card"><h3>水印</h3><input type="text" id="mark" maxlength="16" value="${esc(S.set.mark)}" placeholder="留空就不加水印"></div>
  <button class="btn" data-act="clearproj">清空当前草稿</button>
  <div class="muted" style="text-align:center">AI成片 · 画面模板 + 免费配音，全部在手机上生成</div>
</div>`;
after.settings=()=>{
  const bind=(id,k)=>{const el=$('#'+id);el.oninput=()=>{S.set[k]=el.value.trim();save();};};
  bind('key','key');bind('model','model');bind('mark','mark');
};

// ============================================================
//  动作
// ============================================================
function msg(id,html,cls){const el=$('#'+id);if(el)el.innerHTML=html?`<div class="${cls||'err'}">${html}</div>`:'';}
const ACT={
  home:()=>go('create'),settings:()=>go('settings'),edit:()=>go('edit',{sel:0}),
  mode(d){S.p.mode=d.v;save();go('create');},
  secs(d){S.p.secs=+d.v;save();go('create',null,true);},
  style(d){S.p.style=d.v;save();go(screen,screen==='edit'?arg:null,true);},
  voice(d){S.p.voice=d.v;save();go('create',null,true);},
  quality(d){S.set.quality=d.v;save();go('settings');},
  async aiwrite(d,el){
    const topic=($('#topic').value||'').trim();if(!topic){msg('msg','先写一个主题吧');return;}
    S.p.topic=topic;save();el.disabled=true;el.innerHTML='<span class="spin"></span> AI 正在写…（10~30 秒）';msg('msg','');
    try{const r=await aiWrite(topic,S.p.secs);S.p.title=r.title;S.p.scenes=r.scenes;save();go('edit',{sel:0});}
    catch(e){msg('msg',esc(e.message));el.disabled=false;el.textContent='✨ 再试一次';}
  },
  autosplit(){try{const r=autoScenes(($('#title').value||'').trim(),$('#script').value);S.p.title=r.title;S.p.scenes=r.scenes;save();go('edit',{sel:0});}catch(e){msg('msg',esc(e.message));}},
  async listen(d,el){
    if(!hasNative){toast('浏览器里没有配音，装 App 后可试听');return;}
    el.disabled=true;el.innerHTML='<span class="spin"></span> 合成中…';
    try{const v=await voiceFor('你好，我是 AI 成片的配音，这是试听效果。',S.p.voice,S.p.rate);playBuf(v.buf);
      el.textContent=v.engine==='edge'?'🔊 试听（免费神经语音）':'🔊 试听（手机语音'+(v.edgeError?'，免费语音暂时连不上':'')+'）';}
    catch(e){toast('试听失败：'+e.message);el.textContent='🔊 试听';}
    el.disabled=false;
  },
  pick(d){const i=+d.i;arg={sel:i};document.querySelectorAll('.sc').forEach((el,k)=>el.classList.toggle('on',k===i));
    const n=$('#pvn');if(n)n.textContent=i+1;cancelAnimationFrame(raf);startPreview(i);},
  up(d){const i=+d.i;if(i<1)return;const a=S.p.scenes;[a[i-1],a[i]]=[a[i],a[i-1]];save();go('edit',{sel:i-1},true);},
  down(d){const i=+d.i,a=S.p.scenes;if(i>=a.length-1)return;[a[i+1],a[i]]=[a[i],a[i+1]];save();go('edit',{sel:i+1},true);},
  del(d){const i=+d.i;if(S.p.scenes.length<=1){toast('至少留一个分镜');return;}S.p.scenes.splice(i,1);save();go('edit',{sel:Math.max(0,i-1)},true);},
  addscene(){const a=S.p.scenes;const at=a.length&&a[a.length-1].kind==='end'?a.length-1:a.length;a.splice(at,0,newScene('point',{heading:'新的观点',text:''}));save();go('edit',{sel:at});},
  makevideo(){makeVideo();},
  cancel(){if(job)job.cancel=true;},
  savevideo(d,el){saveVideo(el);},
  async share(){if(!hasNative){toast('浏览器里请用「保存」下载后分享');return;}try{await nat('share',{});}catch(e){toast(e.message);}},
  newproj(){S.p.scenes=[];S.p.title='';S.p.topic='';S.p.script='';save();go('create');},
  clearproj(){S.p.scenes=[];S.p.title='';S.p.topic='';S.p.script='';save();toast('已清空');},
  async testkey(d,el){if(!S.set.key){msg('kmsg','先粘贴 Key');return;}el.disabled=true;el.innerHTML='<span class="spin"></span> 测试中…';
    try{const r=await aiWrite('测试：喝水的好处',30);msg('kmsg','✅ Key 可用，AI 写了 '+r.scenes.length+' 个分镜','warn');}catch(e){msg('kmsg',esc(e.message));}
    el.disabled=false;el.textContent='测试一下 Key';},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.tagName==='A')e.preventDefault();const f=ACT[el.dataset.act];if(f)f(el.dataset,el);});
let player=null;
function playBuf(buf){if(!buf)return;try{player&&player.close();player=new AudioContext();const s=player.createBufferSource();s.buffer=buf;s.connect(player.destination);s.start();}catch(e){}}

let lastVideo=null;
async function makeVideo(){
  const p=S.p;if(!p.scenes.length)return;
  job={cancel:false};go('render');
  const steps=['配音（'+p.scenes.length+' 段）','排版字幕和时间线','逐帧画面并编码','完成'];setSteps(steps,0);
  try{hasNative&&Android.keepScreenOn(true);}catch(e){}
  try{
    const voices=[];let engines=new Set(),edgeErr='';
    for(let i=0;i<p.scenes.length;i++){
      if(job.cancel)throw new Error('已取消');setPct(i/p.scenes.length,'配音 ');
      const v=await voiceFor(p.scenes[i].text,p.voice,p.rate);voices.push(v);engines.add(v.engine);if(v.edgeError)edgeErr=v.edgeError;
    }
    setSteps(steps,1);
    const tl=buildTimeline(p.scenes,voices.map(v=>v.dur));
    const audio=voices.some(v=>v.buf)?await mixAudio(tl,voices):null;
    setSteps(steps,2);
    const q=S.set.quality==='720'?[720,1280]:[1080,1920];
    let vcfg=await pickVideoConfig(q[0],q[1]);let w=q[0],h=q[1];
    if(!vcfg&&q[0]===1080){const v2=await pickVideoConfig(720,1280);if(v2){vcfg=v2;w=720;h=1280;}}
    const acfg=audio?await pickAudioConfig():null;
    let blob,note='';
    if(vcfg&&(!audio||acfg)){blob=await encodeWC(tl,audio,w,h,vcfg,acfg,x=>setPct(x,'画面 '));if(w!==q[0])note='这台手机不支持 1080p 编码，已自动用 720p。';}
    else{msg('rmsg','这台手机不支持快速导出，改用边播边录，需要等视频实际时长。','warn');blob=await encodeMR(tl,audio,w,h,x=>setPct(x,'录制 '));}
    setSteps(steps,3);
    if(edgeErr)note+=(note?' ':'')+'免费神经语音这次没连上，用了手机自带语音。';
    if(!hasNative)note+=(note?' ':'')+'浏览器预览没有配音。';
    const url=URL.createObjectURL(blob);if(lastVideo)URL.revokeObjectURL(lastVideo.url);
    const eng=engines.has('edge')?'免费神经语音':engines.has('system')?'手机语音':'无';
    lastVideo={blob,url,dur:tl.total,size:blob.size,mime:blob.type,engine:eng,note,saved:false};
    try{hasNative&&Android.vibrate(60);}catch(e){}
    go('done',lastVideo);
  }catch(e){
    if(screen==='render'){msg('rmsg',esc(e.message||String(e)));const b=document.querySelector('[data-act=cancel]');if(b){b.textContent='返回分镜';b.dataset.act='edit';}}
  }finally{try{hasNative&&Android.keepScreenOn(false);}catch(e){}job=null;}
}
function blobToB64(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
async function saveVideo(el){
  const v=lastVideo;if(!v)return;
  const ext=v.mime.includes('mp4')?'mp4':'webm';const name=(S.p.title||'AI成片').replace(/[\\/:*?"<>|\s]/g,'').slice(0,20)+'_'+Date.now()+'.'+ext;
  if(!hasNative){const a=document.createElement('a');a.href=v.url;a.download=name;document.body.appendChild(a);a.click();a.remove();return;}
  el.disabled=true;
  try{await nat('saveBegin',{name,mime:v.mime.split(';')[0]});const CH=393216;
    for(let off=0;off<v.blob.size;off+=CH){el.innerHTML=`<span class="spin"></span> 保存中 ${Math.round(off/v.blob.size*100)}%`;await nat('saveChunk',{b64:await blobToB64(v.blob.slice(off,off+CH))});}
    await nat('saveEnd',{});v.saved=true;el.textContent='✅ 已保存到相册（Movies/AI成片）';toast('已保存到相册');}
  catch(e){try{await nat('saveAbort',{});}catch(x){}msg('smsg','保存失败：'+esc(e.message));el.disabled=false;el.textContent='💾 再试一次';}
}
window.onAndroidBack=function(){
  if(screen==='render'){if(job)job.cancel=true;return true;}
  if(screen==='done'||screen==='settings'){go(screen==='done'?'edit':'create',{sel:0});return true;}
  if(screen==='edit'){go('create');return true;}
  return false;
};
// 给自动测试用
window.__test={S,buildTimeline,drawFrame,autoScenes,parseScript,encodeWC,pickVideoConfig,pickAudioConfig,mixAudio,STYLES,newScene,makeVideo,get last(){return lastVideo;}};
render();
</script>
